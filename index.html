hen und die Regel je nach Wirkung übernehmen, anpassen oder verwerfen.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]},{"id":"7.2","module":7,"title":"Ursachenanalyse und Lessons Learned","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Ein Symptom ist noch keine Ursache","body":"5 Why untersucht durch wiederholtes Nachfragen mögliche Ursachen; fünf Fragen sind keine feste Pflichtzahl. Ein Ishikawa-Diagramm ordnet unterschiedliche Ursachengruppen. Vermutungen werden durch Beobachtungen geprüft.","example":"Eine verspätete Lieferung führt zur Frage nach Übergaben, fehlenden Prüfdaten und unklarer Zuständigkeit, statt sofort eine Person verantwortlich zu machen."},{"title":"Aus Erfahrungen konkrete Maßnahmen machen","body":"Eine Retrospektive betrachtet die Zusammenarbeit; eine Vorfallnachbereitung rekonstruiert einen bestimmten Ablauf. Beide sollen überprüfbare Verbesserungen mit Verantwortung und Termin erzeugen.","example":"Aus einer fehlenden Alarmweiterleitung entsteht eine getestete Rufbereitschaftsregel mit einem festen Prüftermin."}],"questions":[{"id":"public-M07-02-Q1","module":7,"lesson_id":"7.2","lesson_title":"Ursachenanalyse und Lessons Learned","type":"single_choice","question":"Was ist ein sinnvoller Zweck wiederholter Warum-Fragen?","options":["Genau fünf Antworten ohne weitere Prüfung sammeln.","Alle widersprechenden Daten aus dem Bericht streichen.","Beeinflussbare Ursachen hinter einer Beobachtung untersuchen.","Eine vorab bestimmte schuldige Person bestätigen."],"correct_index":2,"explanation":"Die Untersuchung soll Ursachen mit belastbaren Hinweisen verbinden.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M07-02-Q2","module":7,"lesson_id":"7.2","lesson_title":"Ursachenanalyse und Lessons Learned","type":"single_choice","question":"Wozu eignet sich ein Ishikawa-Diagramm?","options":["Ausschließlich die zeitliche Reihenfolge von HTTP-Aufrufen darstellen.","Mögliche Ursachen aus mehreren Bereichen strukturiert sammeln.","Den Fertigstellungsgrad aus verbrauchten Kosten berechnen.","Eine Softwareversion automatisch abnehmen."],"correct_index":1,"explanation":"Ursachengruppen erweitern den Blick über die erste Vermutung hinaus.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M07-02-Q3","module":7,"lesson_id":"7.2","lesson_title":"Ursachenanalyse und Lessons Learned","type":"single_choice","question":"Welche Maßnahme ist nachvollziehbar?","options":["Alarmweiterleitung bis Freitag testen; zuständig ist die Betriebsleitung.","Kommunikation irgendwann allgemein verbessern.","Mehr Sorgfalt erwarten, ohne einen Ablauf zu ändern.","Den Bericht ablegen und die Wirkung nicht mehr prüfen."],"correct_index":0,"explanation":"Verantwortung, Termin und überprüfbare Handlung machen eine Verbesserung bearbeitbar.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M07-02-P1","module":7,"lesson_id":"7.2","lesson_title":"Ursachenanalyse und Lessons Learned","type":"practice","question":"Ein Produktionsalarm wurde zu spät bearbeitet. Skizziere eine sachliche Nachbereitung.","model_answer":"Zeitlinie und verfügbare Hinweise gemeinsam rekonstruieren. Ursachen in Alarmierung, Erreichbarkeit und Entscheidungswegen untersuchen, ohne vorschnell Schuld zuzuweisen. Eine konkrete Verbesserung mit Verantwortlichkeit und Termin festlegen. Durch einen Probealarm prüfen, ob die Bearbeitung künftig rechtzeitig startet.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]},{"id":"7.3","module":7,"title":"Verbesserungen priorisieren und begründen","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Wirkung, Aufwand und Risiko vergleichen","body":"Eine Verbesserung konkurriert mit anderen Aufgaben. Beschreibe Nutzen, Kosten, Unsicherheit und Abhängigkeiten. Eine Aufwand-Wirkungs-Matrix unterstützt die Übersicht, ersetzt aber keine fachliche Begründung.","example":"Ein automatisierter Test verspricht weniger Nacharbeit, benötigt jedoch einmaligen Aufbau und laufende Pflege."},{"title":"Eine entscheidbare Vorlage schreiben","body":"Eine Vorlage benennt Problem, Alternativen, erwartete Wirkung und eine Empfehlung. MoSCoW unterscheidet notwendige und unterschiedlich wichtige Anforderungen im betrachteten Umfang; nicht jede Anforderung kann ein Must sein.","example":"Die Entscheidungsvorlage vergleicht eine kleine Prozessänderung mit einem neuen Werkzeug und nennt für beide einen überprüfbaren Nutzen."}],"questions":[{"id":"public-M07-03-Q1","module":7,"lesson_id":"7.3","lesson_title":"Verbesserungen priorisieren und begründen","type":"single_choice","question":"Was gehört zu einer tragfähigen Verbesserungsempfehlung?","options":["Eine Zahl ohne erkennbare Annahmen oder Zeitraum.","Erwartete Wirkung, Aufwand, Risiken und eine begründete Alternative.","Nur die Bekanntheit eines Produkts.","Ausschließlich eine positive Einzelmeinung."],"correct_index":1,"explanation":"Eine Entscheidung braucht nachvollziehbare Kriterien und Unsicherheiten.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M07-03-Q2","module":7,"lesson_id":"7.3","lesson_title":"Verbesserungen priorisieren und begründen","type":"single_choice","question":"Was zeigt ein Eintrag mit hohem Nutzen und geringem Aufwand zunächst?","options":["Einen interessanten Kandidaten, dessen Annahmen geprüft werden sollten.","Eine gesetzlich vorgeschriebene Umsetzung ohne weitere Prüfung.","Den sicheren Ausschluss sämtlicher Risiken.","Eine automatische Freigabe durch alle betroffenen Teams."],"correct_index":0,"explanation":"Die Matrix unterstützt Priorisierung, garantiert aber keine tatsächliche Wirkung.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M07-03-Q3","module":7,"lesson_id":"7.3","lesson_title":"Verbesserungen priorisieren und begründen","type":"single_choice","question":"Worauf deutet eine Liste hin, in der alles als Must markiert ist?","options":["Eine besonders gute Differenzierung der Prioritäten.","Dass Zeit und Ressourcen grundsätzlich unbegrenzt sind.","Dass alle Abhängigkeiten bereits automatisch gelöst wurden.","Der notwendige Mindestumfang wurde noch nicht sinnvoll abgegrenzt."],"correct_index":3,"explanation":"Priorisieren verlangt nachvollziehbare Unterschiede und einen definierten Kontext.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M07-03-P1","module":7,"lesson_id":"7.3","lesson_title":"Verbesserungen priorisieren und begründen","type":"practice","question":"Vergleiche eine neue Review-Regel mit einem kostenpflichtigen Analysewerkzeug als Verbesserungsvorschlag.","model_answer":"Das konkrete Problem und einen messbaren Zielwert benennen. Für beide Alternativen Einführungsaufwand, laufende Kosten, erwartete Wirkung und Risiken beschreiben. Ein begrenztes Experiment für die besser begründete Alternative empfehlen. Verantwortliche und Zeitpunkt der Wirkungskontrolle festlegen.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]},{"id":"7.4","module":7,"title":"Datenmodelle und Abfragen evaluieren","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Mit beobachteter Nutzung prüfen","body":"Ein Datenmodell muss zu fachlichen Regeln und tatsächlichen Zugriffen passen. Sammle typische Abfragen, Datenmengen und Fehlerbilder, bevor Strukturen verändert werden. Ein Index hilft nicht automatisch jeder Abfrage.","example":"Das Team untersucht die häufige Suche nach offenen Terminen und prüft Filter, Datenverteilung und vorhandene Indizes."},{"title":"Messung und Konsistenz zusammen betrachten","body":"EXPLAIN zeigt einen geplanten Ausführungsweg; EXPLAIN ANALYZE führt die Anweisung aus und ergänzt Laufzeitbeobachtungen. Denormalisierung kann Lesen vereinfachen, erhöht aber den Aufwand für konsistente Änderungen.","example":"Eine Auswertung speichert einen abgeleiteten Zähler. Das Team definiert, wie er bei Korrekturen aktualisiert und überprüft wird."}],"questions":[{"id":"public-M07-04-Q1","module":7,"lesson_id":"7.4","lesson_title":"Datenmodelle und Abfragen evaluieren","type":"single_choice","question":"Was ist vor einer Datenbankoptimierung besonders hilfreich?","options":["Repräsentative Abfragen und gemessene Engstellen erfassen.","Alle Tabellen ohne Nutzungsanalyse zusammenführen.","Für jede einzelne Spalte ungeprüft einen Index anlegen.","Nur die Größe der Bildschirmdarstellung vergleichen."],"correct_index":0,"explanation":"Optimierung sollte an einer nachgewiesenen Belastung ansetzen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M07-04-Q2","module":7,"lesson_id":"7.4","lesson_title":"Datenmodelle und Abfragen evaluieren","type":"single_choice","question":"Was ist bei EXPLAIN ANALYZE wichtig?","options":["Es wird grundsätzlich nur ein unverbindlicher Plan angezeigt.","Es ersetzt alle fachlichen Konsistenzprüfungen.","Es legt selbstständig immer den optimalen Index an.","Die Anweisung wird tatsächlich ausgeführt."],"correct_index":3,"explanation":"Die Ausführung kann Last und bei ändernden Anweisungen Datenänderungen erzeugen; ein geeigneter Testkontext ist nötig.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M07-04-Q3","module":7,"lesson_id":"7.4","lesson_title":"Datenmodelle und Abfragen evaluieren","type":"single_choice","question":"Welcher Zielkonflikt kann bei Denormalisierung entstehen?","options":["Eine zusätzliche Kopie beseitigt jede Aktualisierungspflicht.","Die fachlichen Beziehungen verschwinden aus der Anwendung.","Einfachere Lesezugriffe gegenüber aufwendigerer konsistenter Pflege.","Mehr Kopien garantieren automatisch weniger Widersprüche."],"correct_index":2,"explanation":"Redundante Informationen müssen bei Änderungen übereinstimmend gehalten werden.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M07-04-P1","module":7,"lesson_id":"7.4","lesson_title":"Datenmodelle und Abfragen evaluieren","type":"practice","question":"Eine Terminübersicht ist langsam. Entwirf eine überprüfbare Optimierung ohne vorschnelle Schemaänderung.","model_answer":"Typische Filter, Datenmenge und Laufzeiten erfassen. Einen Ausführungsplan in geeigneter Umgebung untersuchen. Einen begründeten Index oder eine angepasste Abfrage testen und Laufzeit sowie Schreibaufwand vergleichen. Ergebnis und Annahmen dokumentieren; eine Strukturänderung erst bei nachvollziehbarem Nutzen prüfen.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"PostgreSQL · EXPLAIN","url":"https://www.postgresql.org/docs/current/using-explain.html"}]},{"id":"7.5","module":7,"title":"Wertstrom und Lieferfähigkeit verbessern","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Arbeit und Warten unterscheiden","body":"Ein Wertstrom macht Bearbeitung, Übergaben und Wartezeiten sichtbar. Eine zusätzliche Person beschleunigt einen Ablauf nicht zwangsläufig, wenn die größte Verzögerung an einer Freigabe entsteht.","example":"Eine kleine Änderung braucht zwei Stunden Arbeit, liegt aber drei Tage vor einer unklar zugeordneten Entscheidung."},{"title":"Kennzahlen im Teamkontext verwenden","body":"Die aktuelle DORA-Systematik betrachtet fünf Lieferkennzahlen: Change Lead Time, Deployment Frequency, Failed Deployment Recovery Time, Change Fail Rate und Deployment Rework Rate. Werte dienen der Verbesserung eines Dienstes und sind kein pauschales Personenranking.","example":"Das Team betrachtet Lieferzeit und Störungen gemeinsam und erprobt kleinere Änderungen, statt nur die Zahl der Deployments zu maximieren."}],"questions":[{"id":"public-M07-05-Q1","module":7,"lesson_id":"7.5","lesson_title":"Wertstrom und Lieferfähigkeit verbessern","type":"single_choice","question":"Was wird im Wertstrom neben Bearbeitungsschritten sichtbar?","options":["Nur die Namen der verwendeten Programmiersprachen.","Automatisch der rechtliche Abnahmestatus.","Die persönliche Produktivität jeder Person ohne Kontext.","Übergaben und Wartezeiten."],"correct_index":3,"explanation":"Gesamtdurchlaufzeit kann überwiegend durch Warten statt durch aktive Arbeit entstehen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M07-05-Q2","module":7,"lesson_id":"7.5","lesson_title":"Wertstrom und Lieferfähigkeit verbessern","type":"single_choice","question":"Wie sollten DORA-Werte besonders genutzt werden?","options":["Eine einzelne Kennzahl um jeden Preis maximieren.","Individuelle Gehälter ausschließlich aus Deployment-Zahlen ableiten.","Entwicklung desselben Dienstes im passenden Kontext beurteilen.","Unterschiedliche Teams ohne Kontext in eine Rangliste zwingen."],"correct_index":2,"explanation":"Gemeinsame Verbesserung ist aussagekräftiger als unpassende Vergleiche.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M07-05-Q3","module":7,"lesson_id":"7.5","lesson_title":"Wertstrom und Lieferfähigkeit verbessern","type":"single_choice","question":"Welche Verbesserung passt zu einer langen Wartezeit auf Freigaben?","options":["Wartezeiten aus der Messung entfernen.","Zuständigkeit, Kriterien und Reaktionszeit der Freigabe klären.","Unabhängig vom Engpass ausschließlich schnellere Rechner kaufen.","Mehr parallele Aufgaben beginnen, ohne den Engpass zu bearbeiten."],"correct_index":1,"explanation":"Die Maßnahme sollte an der beobachteten Verzögerung ansetzen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M07-05-P1","module":7,"lesson_id":"7.5","lesson_title":"Wertstrom und Lieferfähigkeit verbessern","type":"practice","question":"Ein Team liefert häufig, muss aber viele Änderungen unmittelbar korrigieren. Welche Untersuchung und Verbesserung schlägst du vor?","model_answer":"Fehlgeschlagene und ungeplante Nacharbeiten nachvollziehbar erfassen und typische Ursachen untersuchen. Lieferhäufigkeit gemeinsam mit Stabilität betrachten. Eine begrenzte Verbesserung wie kleinere Änderungen oder gezieltere Prüfungen erproben. Dieselben Messdefinitionen vor und nach dem Versuch anwenden.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"DORA · Software Delivery Metrics","url":"https://dora.dev/guides/dora-metrics/"}]},{"id":"7.6","module":7,"title":"Erfahrungen sichern und Wirkung nachhalten","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Entscheidungen für spätere Änderungen erklären","body":"Ein ADR beschreibt Kontext, Entscheidung und Konsequenzen einer relevanten Architekturfrage. Eine Lessons-Learned-Sammlung ergänzt Erfahrungen aus der Durchführung. Beide brauchen einen auffindbaren Ort und einen klaren Bezug.","example":"Ein ADR erläutert die Wahl eines Nachrichtenkanals; ein Erfahrungseintrag beschreibt Probleme beim anschließenden Betrieb und mögliche Abhilfen."},{"title":"Die Verbesserung wieder aufgreifen","body":"Dokumentation allein verändert noch keinen Ablauf. Verknüpfe einen Eintrag mit einer Maßnahme, Verantwortlichkeit und einem Prüfanlass. Bei geänderten Annahmen wird die Entscheidung überprüft statt stillschweigend vergessen.","example":"Nach vier Wochen prüft das Team die Wirkung der neuen Review-Regel und aktualisiert seine Arbeitsvereinbarung."}],"questions":[{"id":"public-M07-06-Q1","module":7,"lesson_id":"7.6","lesson_title":"Erfahrungen sichern und Wirkung nachhalten","type":"single_choice","question":"Welche Information macht einen ADR langfristig hilfreich?","options":["Nur die aktuelle Produktwerbung des Anbieters.","Eine Entscheidung ohne betrachtete Alternativen oder Anlass.","Begründung und Konsequenzen im damaligen Kontext.","Ausschließlich die Anzahl beteiligter Dateien."],"correct_index":2,"explanation":"Der Kontext ermöglicht spätere Überprüfung bei veränderten Bedingungen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M07-06-Q2","module":7,"lesson_id":"7.6","lesson_title":"Erfahrungen sichern und Wirkung nachhalten","type":"single_choice","question":"Was verbindet eine Erfahrung mit kontinuierlicher Verbesserung?","options":["Eine mündliche Zusage ohne erkennbaren nächsten Schritt.","Eine konkrete Maßnahme mit Zuständigkeit und Wirkungskontrolle.","Ein archivierter Bericht ohne weitere Bearbeitung.","Eine ständig wachsende Liste ohne Priorisierung."],"correct_index":1,"explanation":"Eine Verbesserung muss bearbeitet und anhand ihrer Wirkung geprüft werden.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M07-06-Q3","module":7,"lesson_id":"7.6","lesson_title":"Erfahrungen sichern und Wirkung nachhalten","type":"single_choice","question":"Wann ist ein sinnvoller Anlass zur erneuten Entscheidungsprüfung?","options":["Wesentliche Annahmen oder Anforderungen haben sich geändert.","Nur weil eine Überschrift länger geworden ist.","Grundsätzlich niemals nach der ersten Freigabe.","Immer ohne Bezug zu Kosten oder Auswirkungen."],"correct_index":0,"explanation":"Entscheidungen bleiben nur unter passenden Voraussetzungen tragfähig.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M07-06-P1","module":7,"lesson_id":"7.6","lesson_title":"Erfahrungen sichern und Wirkung nachhalten","type":"practice","question":"Formuliere einen kurzen Erfahrungseintrag nach einer erfolglosen Prozessänderung.","model_answer":"Ziel und erwartete Wirkung festhalten. Tatsächlich beobachtete Ergebnisse und Randbedingungen beschreiben. Erklären, welche Annahme sich nicht bestätigt hat. Eine angepasste Maßnahme mit Verantwortlichkeit und Prüftermin ableiten; verknüpfte Arbeitsregeln oder Entscheidungen aktualisieren.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]},{"id":"8.1","module":8,"title":"Datenschutz: Zweck, Daten und Rechtsgrundlage","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Zweck und Umfang begrenzen","body":"Personenbezogene Daten beziehen sich auf identifizierte oder identifizierbare Menschen. Bestimme vor der Erhebung einen konkreten Zweck und beschränke die Daten auf das dafür Erforderliche.","example":"Für eine Rückrufanfrage genügen geeignete Kontaktdaten; ein Geburtsdatum wird nicht ohne passenden Bedarf zum Pflichtfeld."},{"title":"Die Verarbeitung rechtlich einordnen","body":"Art. 6 DSGVO kennt unterschiedliche Rechtsgrundlagen. Einwilligung ist eine Möglichkeit, aber keine allgemeine Pflichtlösung. Prüfe Zweck, Erforderlichkeit und die im Fall tatsächlich passende Grundlage.","example":"Das Team unterscheidet notwendige Vertragsabwicklung von einer zusätzlichen Werbenutzung und dokumentiert die jeweilige Prüfung."}],"questions":[{"id":"public-M08-01-Q1","module":8,"lesson_id":"8.1","lesson_title":"Datenschutz: Zweck, Daten und Rechtsgrundlage","type":"single_choice","question":"Welche Angabe ist personenbezogen?","options":["Eine rein technische Versionsnummer ohne Personenbezug.","Eine abstrakte Formel ohne Bezug zu einer Person.","Eine Kundennummer, die einer Person zugeordnet werden kann.","Eine tatsächlich nicht mehr zuordenbare aggregierte Gesamtzahl."],"correct_index":2,"explanation":"Auch indirekte Identifizierbarkeit kann einen Personenbezug begründen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-01-Q2","module":8,"lesson_id":"8.1","lesson_title":"Datenschutz: Zweck, Daten und Rechtsgrundlage","type":"single_choice","question":"Was verlangt Datenminimierung?","options":["Jedes angebotene Formularfeld zwingend verpflichtend machen.","Nur für den festgelegten Zweck erforderliche Daten verarbeiten.","Alle möglicherweise später interessanten Angaben auf Vorrat sammeln.","Daten möglichst oft unverändert kopieren."],"correct_index":1,"explanation":"Der konkrete Zweck bestimmt den notwendigen Umfang.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-01-Q3","module":8,"lesson_id":"8.1","lesson_title":"Datenschutz: Zweck, Daten und Rechtsgrundlage","type":"single_choice","question":"Welche Aussage zur Einwilligung ist richtig?","options":["Sie ist eine von mehreren möglichen Rechtsgrundlagen.","Sie ersetzt in jedem Fall jede weitere Datenschutzprüfung.","Sie ist immer für jede Vertragsabwicklung zwingend notwendig.","Sie erlaubt eine beliebige spätere Verwendung sämtlicher Daten."],"correct_index":0,"explanation":"Die passende Grundlage hängt von der konkreten Verarbeitung ab.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M08-01-P1","module":8,"lesson_id":"8.1","lesson_title":"Datenschutz: Zweck, Daten und Rechtsgrundlage","type":"practice","question":"Ein Rückrufformular verlangt Name, Telefonnummer, Geburtsdatum und Lieblingssport. Welche Prüfung schlägst du vor?","model_answer":"Den Zweck Rückruf festhalten und die Erforderlichkeit jedes Feldes prüfen. Nicht benötigte Angaben entfernen oder eine eigenständige zulässige Verwendung gesondert bewerten. Eine passende Rechtsgrundlage bestimmen und Betroffene verständlich informieren. Auch Zugriff und Aufbewahrung auf den Zweck abstimmen.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"EDPB · Datenschutz-Grundlagen","url":"https://www.edpb.europa.eu/sme/learn-the-basics/data-protection-basics_en"},{"title":"EU-Kommission · Rechtsgrundlagen","url":"https://commission.europa.eu/law/law-topic/data-protection/information-business-and-organisations/legal-grounds-processing-data_en"}]},{"id":"8.2","module":8,"title":"Rollen, Betroffenenrechte und Folgenabschätzung","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Verantwortung nach tatsächlicher Rolle bestimmen","body":"Verantwortliche bestimmen Zwecke und wesentliche Mittel der Verarbeitung. Auftragsverarbeiter verarbeiten personenbezogene Daten für sie und nach Weisung. Ein Vertragsname allein entscheidet nicht über die tatsächliche Rolle.","example":"Ein Unternehmen legt den Zweck seines Kundenportals fest; ein weisungsgebundener Hostingdienst kann dabei Auftragsverarbeiter sein."},{"title":"Rechte und hohe Risiken vorbereiten","body":"Plane nachvollziehbare Abläufe für Auskunft, Berichtigung und weitere anwendbare Rechte. Eine DSFA untersucht vor einer voraussichtlich hochriskanten Verarbeitung Auswirkungen und Schutzmaßnahmen für die Rechte und Freiheiten Betroffener.","example":"Eine Auskunftsanfrage wird sicher zugeordnet und fristgerecht bearbeitet. Ein neues umfassendes Beschäftigtenprofiling wird vor seinem Einsatz auf DSFA-Pflicht geprüft."}],"questions":[{"id":"public-M08-02-Q1","module":8,"lesson_id":"8.2","lesson_title":"Rollen, Betroffenenrechte und Folgenabschätzung","type":"single_choice","question":"Wer bestimmt bei einer Verarbeitung grundsätzlich Zwecke und wesentliche Mittel?","options":["Der Auftragsverarbeiter unabhängig von seinem tatsächlichen Auftrag.","Der Verantwortliche.","Jede Person mit einem beliebigen Lesekonto.","Immer ausschließlich der Netzbetreiber."],"correct_index":1,"explanation":"Die Rolle folgt der tatsächlichen Entscheidung über die Verarbeitung.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-02-Q2","module":8,"lesson_id":"8.2","lesson_title":"Rollen, Betroffenenrechte und Folgenabschätzung","type":"single_choice","question":"Was ist bei einem Auskunftsersuchen sinnvoll?","options":["Identität bei Bedarf angemessen prüfen und die Anfrage fristgerecht bearbeiten.","Alle Daten ohne Zuordnung an die anfragende Adresse senden.","Jede Anfrage unabhängig vom Einzelfall grundsätzlich ignorieren.","Zuerst sämtliche Daten anderer Kunden in denselben Export aufnehmen."],"correct_index":0,"explanation":"Rechte müssen ermöglicht werden, ohne fremde Daten offenzulegen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-02-Q3","module":8,"lesson_id":"8.2","lesson_title":"Rollen, Betroffenenrechte und Folgenabschätzung","type":"single_choice","question":"Wann ist eine DSFA besonders zu prüfen?","options":["Erst wenn ein beliebiger Server voll belegt ist.","Nur nach dem Austausch des Firmenlogos.","Grundsätzlich ausschließlich nach einem bereits eingetretenen Schaden.","Vor einer Verarbeitung mit voraussichtlich hohem Risiko für Betroffene."],"correct_index":3,"explanation":"Die Folgenabschätzung soll hohe Risiken vorab untersuchen und geeignete Maßnahmen unterstützen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M08-02-P1","module":8,"lesson_id":"8.2","lesson_title":"Rollen, Betroffenenrechte und Folgenabschätzung","type":"practice","question":"Ein neuer Dienst soll Bewegungsmuster von Beschäftigten dauerhaft auswerten. Nenne vier notwendige Prüfschritte.","model_answer":"Zweck, Erforderlichkeit und Rechtsgrundlage klären. Verantwortlichkeiten und beteiligte Dienstleister einordnen. Rechte, Information und angemessene Zugriffe vorsehen. Vor dem Einsatz das hohe Risiko und eine mögliche DSFA-Pflicht mit zuständigen Fachverantwortlichen prüfen; Schutzmaßnahmen und die Entscheidung dokumentieren.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"EDPB · Verantwortliche und Auftragsverarbeiter","url":"https://www.edpb.europa.eu/system/files/2023-10/EDPB_guidelines_202007_controllerprocessor_final_en.pdf"},{"title":"EDPB · Betroffenenrechte","url":"https://www.edpb.europa.eu/sme/be-compliant/respect-individuals-rights_en"},{"title":"EDPB · Datenschutz-Folgenabschätzung","url":"https://www.edpb.europa.eu/sme/be-compliant/be-compliant_en"}]},{"id":"8.3","module":8,"title":"Schutzbedarf und Sicherheitsmanagement","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Schäden je Schutzziel betrachten","body":"Vertraulichkeit betrifft unberechtigtes Bekanntwerden, Integrität unberechtigte Veränderung und Verfügbarkeit die nutzbare Bereitstellung. Begründe den Schutzbedarf anhand möglicher Schäden für den betrachteten Prozess.","example":"Veröffentlichte Kontaktdaten, manipulierte Termine und ein ausgefallenes Portal haben unterschiedliche Auswirkungen und benötigen passende Bewertungen."},{"title":"Sicherheit als laufende Aufgabe organisieren","body":"Ein ISMS ordnet Verantwortungen, Risiken, Maßnahmen und regelmäßige Prüfung. ISO/IEC 27001 beschreibt Anforderungen an ein solches Managementsystem; IT-Grundschutz bietet eine strukturierte Methodik. Ein Zertifikat beweist keine völlige Fehlerfreiheit.","example":"Ein Sicherheitsverantwortlicher verfolgt erkannte Risiken und prüft, ob beschlossene Maßnahmen weiterhin zum Betrieb passen."}],"questions":[{"id":"public-M08-03-Q1","module":8,"lesson_id":"8.3","lesson_title":"Schutzbedarf und Sicherheitsmanagement","type":"single_choice","question":"Welches Schutzziel betrifft eine unberechtigt geänderte Terminliste besonders?","options":["Integrität.","Verfügbarkeit allein.","Ausschließlich optische Einheitlichkeit.","Die Anzahl der installierten Anwendungen."],"correct_index":0,"explanation":"Die Verlässlichkeit und Unverfälschtheit der Daten steht im Mittelpunkt.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-03-Q2","module":8,"lesson_id":"8.3","lesson_title":"Schutzbedarf und Sicherheitsmanagement","type":"single_choice","question":"Worauf stützt sich eine Schutzbedarfsbewertung?","options":["Nur auf den Preis des Arbeitsplatzrechners.","Auf identische Werte für jedes System ohne Begründung.","Ausschließlich auf den Namen der eingesetzten Software.","Auf mögliche Schäden im betrachteten fachlichen Kontext."],"correct_index":3,"explanation":"Schutzbedarf ist aus den Auswirkungen eines Schadens abzuleiten.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-03-Q3","module":8,"lesson_id":"8.3","lesson_title":"Schutzbedarf und Sicherheitsmanagement","type":"single_choice","question":"Was ist ein ISMS?","options":["Ein einzelner Virenscanner ohne organisatorischen Rahmen.","Eine Liste von Passwörtern für sämtliche Mitarbeitenden.","Ein System zum organisierten Umgang mit Informationssicherheitsrisiken.","Eine Garantie, dass nie wieder ein Fehler auftritt."],"correct_index":2,"explanation":"Informationssicherheit braucht Steuerung und kontinuierliche Überprüfung.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M08-03-P1","module":8,"lesson_id":"8.3","lesson_title":"Schutzbedarf und Sicherheitsmanagement","type":"practice","question":"Ordne drei Risiken eines Serviceportals den Schutzzielen zu und nenne eine organisatorische Aufgabe.","model_answer":"Unberechtigter Einblick in Kundendaten betrifft Vertraulichkeit. Manipulierte Buchungen betreffen Integrität. Ein Ausfall der Terminvergabe betrifft Verfügbarkeit. Auswirkungen je Prozess bewerten und begründen; Verantwortliche für die daraus abgeleiteten Maßnahmen und ihre regelmäßige Prüfung festlegen.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"BSI · IT-Grundschutz-Methodik","url":"https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Grundschutz/BSI_Standards/standard_200_2.pdf?__blob=publicationFile"},{"title":"ISO · Informationssicherheitsmanagement","url":"https://committee.iso.org/standard/27001"}]},{"id":"8.4","module":8,"title":"Technische und organisatorische Schutzmaßnahmen","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Maßnahmen zur Bedrohung passend auswählen","body":"Ein Schutzkonzept verbindet Zugriffsregeln, sichere Konfiguration, Aktualisierung, Sicherungen und organisatorische Abläufe. Mehrere passende Schutzebenen helfen, die Folgen eines einzelnen Fehlers zu begrenzen.","example":"Ein Administrationszugang ist besonders geschützt; Berechtigungen werden beim Rollenwechsel angepasst und regelmäßig überprüft."},{"title":"Wirksamkeit statt bloßer Existenz prüfen","body":"Eine Maßnahme muss zur Anwendung passen und überprüfbar funktionieren. Ein vorhandenes Backup allein zeigt noch nicht, dass Daten rechtzeitig und konsistent wiederhergestellt werden können.","example":"Das Team spielt eine Sicherung in einer isolierten Umgebung ein und prüft anschließend die wichtigsten fachlichen Abläufe."}],"questions":[{"id":"public-M08-04-Q1","module":8,"lesson_id":"8.4","lesson_title":"Technische und organisatorische Schutzmaßnahmen","type":"single_choice","question":"Was setzt das Prinzip minimaler Rechte um?","options":["Alle Konten erhalten vorsorglich Administrationsrechte.","Berechtigungen werden nach Eintritt nie wieder geprüft.","Geheimnisse werden in allgemein sichtbaren Dokumenten gesammelt.","Eine Rolle erhält nur die für ihre Aufgabe benötigten Berechtigungen."],"correct_index":3,"explanation":"Begrenzte Rechte reduzieren die möglichen Folgen eines Missbrauchs oder Fehlers.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-04-Q2","module":8,"lesson_id":"8.4","lesson_title":"Technische und organisatorische Schutzmaßnahmen","type":"single_choice","question":"Welcher Nachweis prüft ein Backup besonders aussagekräftig?","options":["Ausschließlich der Kaufpreis des Speichermediums.","Die Zusicherung, dass noch nie eine Störung auftrat.","Ein dokumentierter erfolgreicher Wiederherstellungstest.","Nur der Dateiname einer Sicherung."],"correct_index":2,"explanation":"Entscheidend ist die nutzbare Wiederherstellung, nicht allein das Vorhandensein einer Datei.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-04-Q3","module":8,"lesson_id":"8.4","lesson_title":"Technische und organisatorische Schutzmaßnahmen","type":"single_choice","question":"Was ist eine organisatorische Sicherheitsmaßnahme?","options":["Ein unveränderter Passwortzettel am gemeinsamen Arbeitsplatz.","Ein geregelter Prozess zum Entziehen von Rechten bei Austritt.","Nur eine größere Festplatte ohne neuen Ablauf.","Eine zufällige Farbauswahl für Administratorseiten."],"correct_index":1,"explanation":"Organisation legt Verantwortungen und verbindliche Bearbeitungsschritte fest.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M08-04-P1","module":8,"lesson_id":"8.4","lesson_title":"Technische und organisatorische Schutzmaßnahmen","type":"practice","question":"Entwirf drei zusammenwirkende Schutzmaßnahmen für die Portalverwaltung und je einen Nachweis.","model_answer":"Administrative Rechte auf passende Rollen begrenzen und anhand einer Berechtigungsprüfung nachweisen. Starke Anmeldung vorsehen und den Zugriff mit geeigneten Tests prüfen. Änderungen sowie Austritte in einem geregelten Prozess bearbeiten und die Bearbeitung dokumentieren. Zusätzlich Wiederherstellung regelmäßig anhand wichtiger Fachabläufe testen.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]},{"id":"8.5","module":8,"title":"Bedrohungsmodell und Risikobehandlung","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Angriffsflächen strukturiert betrachten","body":"Ein Bedrohungsmodell untersucht Datenflüsse, Beteiligte und Vertrauensgrenzen. STRIDE fragt nach Identitätsvortäuschung, Manipulation, Abstreitbarkeit, Offenlegung, Dienstverweigerung und Rechteausweitung. Die Einordnung unterstützt passende Gegenmaßnahmen.","example":"Für einen Datenimport werden Quelle, Validierung, Berechtigungen und gespeicherte Änderungen gemeinsam betrachtet."},{"title":"Risiken mit Begründung behandeln","body":"Bewerte Eintritt und Auswirkung anhand des Szenarios. Lege Behandlung und Verantwortung fest und bewerte das verbleibende Risiko erneut. Eine Risikomatrix unterstützt die Diskussion, liefert aber keine automatisch objektive Wahrheit.","example":"Ein unberechtigter Massenexport wird durch Zugriffskontrolle und Begrenzung erschwert; die Wirksamkeit wird mit Negativtests geprüft."}],"questions":[{"id":"public-M08-05-Q1","module":8,"lesson_id":"8.5","lesson_title":"Bedrohungsmodell und Risikobehandlung","type":"single_choice","question":"Welche STRIDE-Kategorie betrifft unbefugte Datenveränderung?","options":["Denial of Service.","Spoofing.","Tampering.","Information Disclosure."],"correct_index":2,"explanation":"Tampering beschreibt Manipulation und damit eine Bedrohung der Integrität.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-05-Q2","module":8,"lesson_id":"8.5","lesson_title":"Bedrohungsmodell und Risikobehandlung","type":"single_choice","question":"Warum werden Vertrauensgrenzen im Modell markiert?","options":["Weil Rechte hinter einer Netzwerkgrenze automatisch unbegrenzt gelten.","Weil dort Annahmen über Identität und Daten geprüft werden müssen.","Weil damit jede Authentifizierung ersetzt wird.","Weil Daten außerhalb der Anwendung grundsätzlich vertrauenswürdig sind."],"correct_index":1,"explanation":"Der Übergang zwischen unterschiedlich vertrauenswürdigen Bereichen braucht bewusste Kontrollen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-05-Q3","module":8,"lesson_id":"8.5","lesson_title":"Bedrohungsmodell und Risikobehandlung","type":"single_choice","question":"Was ist nach Einführung einer Risikomaßnahme zu tun?","options":["Wirksamkeit und verbleibendes Risiko erneut beurteilen.","Das Risiko unabhängig vom Ergebnis endgültig als unmöglich markieren.","Alle zugehörigen Nachweise unmittelbar löschen.","Nur die ursprüngliche Farbe der Matrix beibehalten."],"correct_index":0,"explanation":"Eine Maßnahme verändert ein Risiko, beseitigt es aber nicht zwangsläufig vollständig.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M08-05-P1","module":8,"lesson_id":"8.5","lesson_title":"Bedrohungsmodell und Risikobehandlung","type":"practice","question":"Ein normales Konto kann im Portal fremde Kundendaten exportieren. Ordne Bedrohung, Maßnahme und Nachweis zu.","model_answer":"Die Offenlegung fremder Daten betrifft Vertraulichkeit und Information Disclosure; unzulässige Rechte können zusätzlich relevant sein. Serverseitige Autorisierung für den konkreten Datenumfang vorsehen und Exporte begrenzen. Mit unterschiedlichen Rollen gezielte Negativtests durchführen. Verbleibende Risiken und Verantwortlichkeit dokumentieren.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"Microsoft · STRIDE-Bedrohungen","url":"https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats"}]},{"id":"8.6","module":8,"title":"Governance, Compliance und Auditnachweise","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Steuerung und Regeleinhaltung unterscheiden","body":"IT-Governance richtet Entscheidungen und Verantwortungen an Zielen aus. IT-Compliance untersucht und erfüllt relevante Vorgaben. Beide brauchen klare Zuständigkeiten und nachvollziehbare Entscheidungen.","example":"Eine Leitung legt Freigabeverantwortung fest; ein Team weist nach, dass vorgeschriebene Prüfungen vor dem Release durchgeführt wurden."},{"title":"Vorgabe, Kontrolle und Nachweis verbinden","body":"Ein Audit untersucht anhand von Kriterien und Belegen einen bestimmten Umfang. Eine bloß vorhandene Richtlinie beweist noch keine gelebte Umsetzung. Halte Abweichungen und ihre Bearbeitung nachvollziehbar fest.","example":"Für eine regelmäßige Rechteprüfung gibt es Regel, verantwortliche Person, durchgeführten Prüftermin und dokumentierte Korrekturen."}],"questions":[{"id":"public-M08-06-Q1","module":8,"lesson_id":"8.6","lesson_title":"Governance, Compliance und Auditnachweise","type":"single_choice","question":"Was beschreibt IT-Compliance am besten?","options":["Nur die Darstellung einer Unternehmenshierarchie.","Das Einhalten einschlägiger Vorgaben mit geeigneten Nachweisen.","Das Ersetzen sämtlicher Gesetze durch Teamvorlieben.","Ausschließlich die Wahl einer modernen Programmiersprache."],"correct_index":1,"explanation":"Compliance verbindet relevante Anforderungen mit ihrer Umsetzung.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-06-Q2","module":8,"lesson_id":"8.6","lesson_title":"Governance, Compliance und Auditnachweise","type":"single_choice","question":"Was ist ein belastbarer Kontrollnachweis?","options":["Ein nachvollziehbares Ergebnis einer tatsächlich durchgeführten Prüfung.","Ein ungeprüfter Vermerk, dass alles immer korrekt sei.","Eine Vorlage ohne ausgefüllten Prüfumfang.","Nur das Vorhandensein eines leeren Ordners."],"correct_index":0,"explanation":"Ein Nachweis muss erkennen lassen, was wann mit welchem Ergebnis geprüft wurde.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-06-Q3","module":8,"lesson_id":"8.6","lesson_title":"Governance, Compliance und Auditnachweise","type":"single_choice","question":"Wie wird eine Auditabweichung sinnvoll behandelt?","options":["Die Feststellung ohne Prüfung aus dem Bericht entfernen.","Nur die Überschrift der Richtlinie ändern.","Jede Verantwortung bis zum nächsten Audit offenlassen.","Ursache, Korrektur, Zuständigkeit und Wirksamkeitsprüfung festlegen."],"correct_index":3,"explanation":"Die Bearbeitung soll das konkrete Problem nachvollziehbar beheben.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M08-06-P1","module":8,"lesson_id":"8.6","lesson_title":"Governance, Compliance und Auditnachweise","type":"practice","question":"Leite aus der Vorgabe einer quartalsweisen Rechteprüfung einen überprüfbaren Ablauf ab.","model_answer":"Umfang und Prüfkriterien definieren, Verantwortliche und Termin festlegen. Ist-Rechte mit den benötigten Aufgaben vergleichen und Abweichungen korrigieren. Durchgeführte Prüfung und Entscheidungen geeignet dokumentieren. Nachkontrolle und Eskalation offener Punkte vorsehen.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]},{"id":"8.7","module":8,"title":"Vertragsarten, Leistungsumfang und Änderungen","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Geschuldete Leistung genau lesen","body":"Beim Werkvertrag steht der vereinbarte Erfolg im Mittelpunkt; beim Dienstvertrag die zugesagte Tätigkeit. Ein IT-Projekt kann unterschiedliche Leistungselemente enthalten. Überschrift oder Entwicklungsverfahren allein legen den Vertragstyp nicht fest.","example":"Ein klar beschriebenes Erweiterungsergebnis wird anders geprüft als ein vereinbartes Unterstützungskontingent; entscheidend bleibt der tatsächliche Inhalt."},{"title":"Änderungen nachvollziehbar vereinbaren","body":"Eine Änderungsanfrage benennt Anlass, neuen Umfang und Auswirkungen auf Zeit, Kosten, Qualität und Risiken. Eine Bewertung allein ist noch keine Freigabe. Abnahmefragen werden passend zum Vertragsrahmen geklärt.","example":"Ein zusätzlicher Export wird erst nach Bewertung und Entscheidung in den Lieferumfang aufgenommen, statt stillschweigend den bisherigen Termin zu verdrängen."}],"questions":[{"id":"public-M08-07-Q1","module":8,"lesson_id":"8.7","lesson_title":"Vertragsarten, Leistungsumfang und Änderungen","type":"single_choice","question":"Welcher Schwerpunkt kennzeichnet grundsätzlich einen Werkvertrag?","options":["Die Herstellung des versprochenen Erfolgs.","Ausschließlich die Anwesenheit einer Person im Team.","Die bloße Verwendung einer bestimmten Entwicklungsumgebung.","Die garantierte Fehlerfreiheit sämtlicher späterer Fremdsysteme."],"correct_index":0,"explanation":"§ 631 BGB stellt auf das versprochene Werk beziehungsweise den herbeizuführenden Erfolg ab.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-07-Q2","module":8,"lesson_id":"8.7","lesson_title":"Vertragsarten, Leistungsumfang und Änderungen","type":"single_choice","question":"Welche Leistung steht beim Dienstvertrag grundsätzlich im Vordergrund?","options":["Ausnahmslos ein bestimmter abnahmefähiger Softwareerfolg.","Automatisch die Übertragung aller Urheberrechte ohne Vereinbarung.","Eine unbeschränkte Änderung sämtlicher Termine durch eine Seite.","Die vereinbarten Dienste."],"correct_index":3,"explanation":"§ 611 BGB beschreibt die Leistung der zugesagten Dienste.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-07-Q3","module":8,"lesson_id":"8.7","lesson_title":"Vertragsarten, Leistungsumfang und Änderungen","type":"single_choice","question":"Was sollte vor der Freigabe eines Change Requests vorliegen?","options":["Die Annahme, dass jede Zusatzfunktion kostenlos und sofort möglich ist.","Die Löschung aller bisher vereinbarten Anforderungen.","Eine Bewertung von Umfang und Auswirkungen sowie eine zuständige Entscheidung.","Nur ein neuer Funktionsname ohne Aufwandsschätzung."],"correct_index":2,"explanation":"Ein geregelter Änderungsprozess macht Folgen und Zustimmung nachvollziehbar.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M08-07-P1","module":8,"lesson_id":"8.7","lesson_title":"Vertragsarten, Leistungsumfang und Änderungen","type":"practice","question":"Ein Kunde verlangt kurz vor dem Termin eine zusätzliche Schnittstelle. Skizziere eine geordnete Bearbeitung.","model_answer":"Anfrage und Abgrenzung zum vereinbarten Umfang dokumentieren. Auswirkungen auf Aufwand, Termin, Kosten, Qualität und Risiken bewerten. Alternativen wie eine spätere Lieferung darstellen. Die zuständige Entscheidung einholen und erst danach Plan sowie Vereinbarungen nachvollziehbar aktualisieren.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"BGB § 631 · Werkvertrag","url":"https://www.gesetze-im-internet.de/bgb/__631.html"},{"title":"BGB § 611 · Dienstvertrag","url":"https://www.gesetze-im-internet.de/bgb/__611.html"},{"title":"BGB § 640 · Abnahme","url":"https://www.gesetze-im-internet.de/bgb/__640.html"}]},{"id":"8.8","module":8,"title":"Lieferkette und neue Anforderungen nachhalten","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Abhängigkeiten kennen und Änderungen prüfen","body":"Bibliotheken, externe Dienste und Lieferanten beeinflussen Sicherheit und Betrieb. Ein Verzeichnis mit Version, Herkunft, Verantwortlichkeit und Lizenzbezug unterstützt Bewertung und Aktualisierung. Eine Liste allein behebt keine Schwachstelle.","example":"Das Team kann eine betroffene Bibliotheksversion ihren Anwendungen zuordnen und testet ein geeignetes Update vor der Auslieferung."},{"title":"Regeländerungen systematisch bewerten","body":"Bei neuen Vorgaben wie NIS-2 werden Anwendungsbereich, tatsächliche Betroffenheit und aktuelle amtliche Informationen geprüft. Daraus folgen bewertete Aufgaben mit Verantwortung, Termin und Nachweis; pauschale Aussagen allein nach Firmennamen reichen nicht.","example":"Ein Verantwortlicher dokumentiert eine Betroffenheitsprüfung und verfolgt daraus abgeleitete Anforderungen gemeinsam mit den zuständigen Fachstellen."}],"questions":[{"id":"public-M08-08-Q1","module":8,"lesson_id":"8.8","lesson_title":"Lieferkette und neue Anforderungen nachhalten","type":"single_choice","question":"Was hilft bei einer gemeldeten Schwachstelle in einer Abhängigkeit?","options":["Nur die Anzahl der Repository-Sterne betrachten.","Alle Aktualisierungen ohne Prüfung dauerhaft sperren.","Die Herkunft eingesetzter Komponenten bewusst nicht erfassen.","Verwendete Versionen und betroffene Anwendungen nachvollziehbar zuordnen."],"correct_index":3,"explanation":"Eine bekannte Komponentenbasis ermöglicht gezielte Bewertung und Behandlung.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-08-Q2","module":8,"lesson_id":"8.8","lesson_title":"Lieferkette und neue Anforderungen nachhalten","type":"single_choice","question":"Wie werden neue regulatorische Anforderungen sinnvoll behandelt?","options":["Grundsätzlich jede Firma unabhängig vom Sachverhalt gleich einordnen.","Nur die Namen der Produkte ändern und die Prüfung abschließen.","Aktuellen Anwendungsbereich und Betroffenheit prüfen und Maßnahmen ableiten.","Die erste gefundene Zusammenfassung ohne Datumsprüfung für immer übernehmen."],"correct_index":2,"explanation":"Relevanz und konkrete Pflichten müssen zum tatsächlichen Fall passen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M08-08-Q3","module":8,"lesson_id":"8.8","lesson_title":"Lieferkette und neue Anforderungen nachhalten","type":"single_choice","question":"Was gehört nach einem sicherheitsrelevanten Update zur Freigabe?","options":["Ausschließlich ein neues Bildschirmfoto der Startseite.","Geeignete Funktionstests und nachvollziehbare Bewertung der Änderung.","Die Annahme, dass jede neue Versionsnummer automatisch kompatibel ist.","Das ungeprüfte Entfernen sämtlicher Protokolle."],"correct_index":1,"explanation":"Die Behebung eines Problems darf unerwünschte Auswirkungen auf die Anwendung nicht übersehen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M08-08-P1","module":8,"lesson_id":"8.8","lesson_title":"Lieferkette und neue Anforderungen nachhalten","type":"practice","question":"Eine häufig verwendete Bibliothek ist von einer Schwachstelle betroffen. Beschreibe deinen Bearbeitungsplan.","model_answer":"Betroffene Versionen und Anwendungen ermitteln. Auswirkung und tatsächliche Nutzung bewerten, zuständige Personen informieren und eine Behandlung priorisieren. Update oder begründete Zwischenmaßnahme testen und freigeben. Umsetzung, verbleibendes Risiko und weitere Prüfung dokumentieren.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"BSI · NIS-2-Betroffenheitsprüfung","url":"https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/NIS-2/nis-2-betroffenheit-entscheidungsbaum.pdf?__blob=publicationFile&v=11"}]},{"id":"9.1","module":9,"title":"Teilprojektziele, Struktur und Rollen","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Ergebnisse mit dem Gesamtziel verbinden","body":"Ein Teilprojektziel beschreibt einen konkreten Beitrag, messbare Erfolgskriterien und einen Termin. Ein Projektstrukturplan zerlegt den Umfang in handhabbare Ergebnisse und Arbeitspakete; er ist noch kein zeitlicher Ablaufplan.","example":"Für die Portal-Einführung wird ein geprüftes Schulungspaket mit Zielgruppe, Abgabetermin und Abnahmekriterium geplant."},{"title":"Verantwortung verständlich zuordnen","body":"RACI unterscheidet Bearbeitung, abschließende Ergebnisverantwortung, Beratung und Information. Kläre insbesondere, wer entscheiden darf und welche Übergaben zwischen Rollen nötig sind.","example":"Ein Team erstellt die Unterlagen; eine benannte Person trägt die Ergebnisverantwortung und stimmt notwendige Freigaben ab."}],"questions":[{"id":"public-M09-01-Q1","module":9,"lesson_id":"9.1","lesson_title":"Teilprojektziele, Struktur und Rollen","type":"single_choice","question":"Was gehört zu einem gut überprüfbaren Teilprojektziel?","options":["Ein Termin ohne Beschreibung des erwarteten Ergebnisses.","Konkretes Ergebnis, Erfolgskriterium und Termin.","Nur die allgemeine Absicht, die Zusammenarbeit zu verbessern.","Eine Werkzeugliste ohne Bezug zum Gesamtprojekt."],"correct_index":1,"explanation":"Das Ziel muss einen erkennbaren, überprüfbaren Beitrag beschreiben.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-01-Q2","module":9,"lesson_id":"9.1","lesson_title":"Teilprojektziele, Struktur und Rollen","type":"single_choice","question":"Wofür steht Accountable in RACI?","options":["Für die abschließende Ergebnisverantwortung.","Für jede lediglich informierte Person.","Für ausschließlich beratende Beteiligte.","Für die automatische Durchführung aller einzelnen Arbeitsschritte."],"correct_index":0,"explanation":"Responsible und Accountable unterscheiden Bearbeitung und Ergebnisverantwortung.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-01-Q3","module":9,"lesson_id":"9.1","lesson_title":"Teilprojektziele, Struktur und Rollen","type":"single_choice","question":"Was liefert ein Projektstrukturplan vorrangig?","options":["Bereits alle frühesten und spätesten Termine.","Eine Garantie, dass keine Abhängigkeit auftreten wird.","Die individuelle Urlaubsfreigabe sämtlicher Beschäftigten.","Eine Gliederung des Projektumfangs in Ergebnisse und Arbeitspakete."],"correct_index":3,"explanation":"Die Struktur beschreibt den Umfang; zeitliche Beziehungen werden anschließend geplant.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M09-01-P1","module":9,"lesson_id":"9.1","lesson_title":"Teilprojektziele, Struktur und Rollen","type":"practice","question":"Formuliere ein Ziel für das Teilprojekt Schulung und ordne drei RACI-Rollen zu.","model_answer":"Bis zum vereinbarten Termin steht eine geprüfte Übung bereit, mit der die Zielgruppe eine Buchung und einen Konfliktfall bearbeiten kann. Ein Schulungsteam ist für die Erstellung zuständig (Responsible). Eine benannte Leitung trägt die Ergebnisverantwortung (Accountable). Fachanwender werden beratend einbezogen (Consulted).","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]},{"id":"9.2","module":9,"title":"Vorgehen und gemeinsame Qualitätskriterien","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Vorgehen passend zur Unsicherheit wählen","body":"Ein planorientiertes Vorgehen kann stabile Ergebnisse und geregelte Prüfungen betonen. Iterative Arbeit ermöglicht frühe Rückmeldung bei unsicheren Anforderungen. Kanban macht Arbeitsfluss und Begrenzung paralleler Arbeit sichtbar; ein Methodenname allein löst kein Organisationsproblem.","example":"Bei einer noch unklaren Bedienung liefert das Team früh einen prüfbaren Zwischenstand und lernt aus tatsächlicher Nutzung."},{"title":"Fertig und bereit bewusst unterscheiden","body":"In Scrum beschreibt die Definition of Done den erforderlichen Qualitätszustand eines Increments. Eine teaminterne Definition of Ready kann die Vorbereitung unterstützen, ist aber kein vorgeschriebenes Scrum-Artefakt und keine zusätzliche Abnahmeinstanz.","example":"Eine Funktion gilt erst nach vereinbarten Prüfungen als fertig; ausreichend geklärte Fragen erleichtern die Planung der nächsten Arbeit."}],"questions":[{"id":"public-M09-02-Q1","module":9,"lesson_id":"9.2","lesson_title":"Vorgehen und gemeinsame Qualitätskriterien","type":"single_choice","question":"Was unterstützt frühe Rückmeldung bei unsicheren Anforderungen?","options":["Kleine überprüfbare Ergebnisse mit regelmäßiger Anpassung.","Sämtliche Rückfragen bis zum Projektende vermeiden.","Nur die Länge eines Plans maximieren.","Ungeklärte Annahmen grundsätzlich als gesichert behandeln."],"correct_index":0,"explanation":"Ein früher überprüfbarer Stand ermöglicht Lernen vor einer großen Gesamtlieferung.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-02-Q2","module":9,"lesson_id":"9.2","lesson_title":"Vorgehen und gemeinsame Qualitätskriterien","type":"single_choice","question":"Was beschreibt die Definition of Done in Scrum?","options":["Die persönliche Anwesenheitszeit aller Mitarbeitenden.","Eine beliebige Freigabe unabhängig vom Produktzustand.","Die Reihenfolge der Urlaubstermine im nächsten Quartal.","Die Qualitätsanforderungen an ein fertiges Increment."],"correct_index":3,"explanation":"Fertige Arbeit muss den gemeinsam geltenden Qualitätszustand erfüllen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-02-Q3","module":9,"lesson_id":"9.2","lesson_title":"Vorgehen und gemeinsame Qualitätskriterien","type":"single_choice","question":"Welche Aussage zur Definition of Ready passt?","options":["Sie ersetzt die Definition of Done vollständig.","Sie verbietet jede nachträgliche Klärung einer Anforderung.","Sie kann eine ergänzende Teamvereinbarung zur Vorbereitung sein.","Sie ist zwingend ein viertes offizielles Scrum-Artefakt."],"correct_index":2,"explanation":"Vorbereitungshilfen dürfen nicht mit verbindlichen Elementen des Scrum Guide verwechselt werden.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M09-02-P1","module":9,"lesson_id":"9.2","lesson_title":"Vorgehen und gemeinsame Qualitätskriterien","type":"practice","question":"Ein Team nennt eine Funktion fertig, obwohl zentrale Tests fehlen. Wie klärst du das Vorgehen?","model_answer":"Den vereinbarten Qualitätszustand und die fehlenden Nachweise gemeinsam prüfen. Nicht erfüllte Kriterien sichtbar machen und die nötigen Arbeiten planen. Für künftige Aufgaben ein gemeinsames Verständnis von Done schaffen. Vorbereitungskriterien gegebenenfalls ergänzen, ohne sie mit dem fertigen Produktzustand zu verwechseln.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"Scrum Guide · Offizieller Leitfaden","url":"https://scrumguides.org/scrum-guide.html"}]},{"id":"9.3","module":9,"title":"Stakeholder und Kommunikationswege","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Betroffenheit und Einfluss verstehen","body":"Stakeholder können Ergebnisse beeinflussen oder von ihnen betroffen sein. Eine Analyse untersucht Interessen, Einfluss und Informationsbedarf. Die Einordnung wird bei Veränderungen überprüft, statt Personen dauerhaft in eine Schublade zu stecken.","example":"Eine kleine Supportgruppe hat wenig formale Macht, kennt aber wichtige Betriebsprobleme und wird deshalb gezielt einbezogen."},{"title":"Aus Bedarf konkrete Kommunikation machen","body":"Ein Kommunikationsplan benennt Zielgruppe, Zweck, Inhalt, Zeitpunkt und Verantwortlichkeit. Vertraulichkeit und Rückmeldewege gehören dazu. Nicht jede Zielgruppe braucht dieselbe Detailtiefe.","example":"Die Leitung erhält eine entscheidbare Statusübersicht; der Betrieb erhält konkrete Umstellungsschritte und einen Eskalationskontakt."}],"questions":[{"id":"public-M09-03-Q1","module":9,"lesson_id":"9.3","lesson_title":"Stakeholder und Kommunikationswege","type":"single_choice","question":"Wer kann ein Stakeholder sein?","options":["Nur eine Person, die im Projekt Vollzeit arbeitet.","Ausschließlich die zahlende Auftraggeberseite.","Nur ein Mitglied der Geschäftsleitung.","Eine vom Ergebnis betroffene Supportgruppe."],"correct_index":3,"explanation":"Betroffenheit und Einfluss reichen über das Kernprojektteam hinaus.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-03-Q2","module":9,"lesson_id":"9.3","lesson_title":"Stakeholder und Kommunikationswege","type":"single_choice","question":"Was sollte aus einer Stakeholderanalyse folgen?","options":["Der Verzicht auf alle fachlichen Rückfragen.","Eine identische tägliche Vollinformation für jede Person.","Ein abgestimmter Beteiligungs- und Kommunikationsbedarf.","Eine unveränderliche Rangliste persönlicher Sympathie."],"correct_index":2,"explanation":"Die Analyse soll angemessene Zusammenarbeit ermöglichen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-03-Q3","module":9,"lesson_id":"9.3","lesson_title":"Stakeholder und Kommunikationswege","type":"single_choice","question":"Welche Angabe macht einen Kommunikationsplan konkret?","options":["Ein allgemeiner Hinweis, dass alle jederzeit informiert sein sollten.","Wer welche Information wann über welchen Weg verantwortet.","Nur die Anzahl aller vorhandenen Chatkanäle.","Ausschließlich die Namen eingesetzter Präsentationsprogramme."],"correct_index":1,"explanation":"Verantwortete Kommunikationswege verhindern Lücken und Doppelarbeit.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M09-03-P1","module":9,"lesson_id":"9.3","lesson_title":"Stakeholder und Kommunikationswege","type":"practice","question":"Plane die Kommunikation eines Portal-Roll-outs für Leitung, Betrieb und Anwender.","model_answer":"Der Leitung rechtzeitig Entscheidungsvorlage und Risiken bereitstellen. Mit dem Betrieb Ablauf, Zeitfenster und Eskalationsweg abstimmen. Anwender auf geänderte Aufgaben, Schulung und Unterstützung vorbereiten. Für jede Zielgruppe Verantwortliche, Termin, Medium und Rückmeldeweg benennen.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]},{"id":"9.4","module":9,"title":"Projektrisiken, Maßnahmen und Eskalation","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Unsicherheit von eingetretenen Problemen trennen","body":"Ein Risiko ist eine mögliche zukünftige Entwicklung; ein Issue ist bereits eingetreten. Beschreibe Ursache, mögliches Ereignis und Auswirkung. Ordne Verantwortlichkeit, Gegenmaßnahme und Beobachtung zu.","example":"Ein noch unbestätigter Liefertermin einer Schnittstelle ist ein Risiko. Ein bereits ausgefallener Testserver ist ein aktuelles Problem."},{"title":"An vereinbarten Grenzen handeln","body":"Eskalation stellt rechtzeitig eine Entscheidung mit passenden Informationen bereit. Zeige Auswirkung, bereits ergriffene Schritte und Handlungsoptionen. Ein roter Status ist ein Signal zur Bearbeitung und keine persönliche Schuldzuweisung.","example":"Eine verpasste Abhängigkeit gefährdet den Starttermin; das Team legt Alternativen und eine notwendige Entscheidung bis Freitag vor."}],"questions":[{"id":"public-M09-04-Q1","module":9,"lesson_id":"9.4","lesson_title":"Projektrisiken, Maßnahmen und Eskalation","type":"single_choice","question":"Was unterscheidet ein Issue von einem Risiko?","options":["Risiken benötigen keine Verantwortlichkeit.","Ein Risiko ist automatisch unwichtig, solange es noch nicht eingetreten ist.","Das Issue ist bereits eingetreten.","Ein Issue betrifft grundsätzlich nie einen Termin."],"correct_index":2,"explanation":"Mögliche und tatsächliche Probleme brauchen unterschiedliche unmittelbare Bearbeitung.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-04-Q2","module":9,"lesson_id":"9.4","lesson_title":"Projektrisiken, Maßnahmen und Eskalation","type":"single_choice","question":"Was gehört in einen nachvollziehbaren Risikoeintrag?","options":["Ausschließlich ein Datum ohne weiteren Bezug.","Szenario, Bewertung, Verantwortlichkeit und Behandlung.","Nur eine Farbe ohne beschriebenes Ereignis.","Die Privatmeinung einer unbeteiligten Person."],"correct_index":1,"explanation":"Ein Risiko muss verständlich und bearbeitbar beschrieben sein.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-04-Q3","module":9,"lesson_id":"9.4","lesson_title":"Projektrisiken, Maßnahmen und Eskalation","type":"single_choice","question":"Was macht eine Eskalation entscheidbar?","options":["Auswirkung, Optionen und eine klare benötigte Entscheidung.","Nur eine dringende Nachricht ohne Sachverhalt.","Eine Schuldzuweisung ohne mögliche Lösung.","Das Zurückhalten aller bisher bekannten Folgen."],"correct_index":0,"explanation":"Die zuständige Ebene braucht die nötigen Informationen zum Handeln.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M09-04-P1","module":9,"lesson_id":"9.4","lesson_title":"Projektrisiken, Maßnahmen und Eskalation","type":"practice","question":"Eine externe Schnittstelle wird vermutlich zwei Wochen später fertig. Formuliere Risiko und Eskalationsinhalt.","model_answer":"Risiko: Eine verspätete Schnittstelle kann Integration und Starttermin verschieben. Verantwortliche und Beobachtung festlegen; Alternativen wie einen abgegrenzten Übergang oder eine gestufte Lieferung prüfen. Auswirkungen auf Termin, Kosten und Qualität darstellen. Eine konkrete Entscheidung mit benötigtem Zeitpunkt an die zuständige Ebene geben.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]},{"id":"9.5","module":9,"title":"Abhängigkeiten, Netzplan und kritischer Pfad","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Termine aus Beziehungen ableiten","body":"Ein Netzplan ordnet Dauern und Abhängigkeiten. Bei Ende-Anfang-Beziehungen startet ein Vorgang erst, wenn seine erforderlichen Vorgänger fertig sind. Eine Vorwärtsterminierung verwendet an Zusammenführungen den spätesten notwendigen Vorgängerabschluss.","example":"Nach Analyse folgen Umsetzung und Datenvorbereitung parallel; der gemeinsame Test wartet auf beide Ergebnisse."},{"title":"Puffer und Terminwirkung verstehen","body":"Im einfachen Netzplan ohne zusätzliche Zwangstermine bestimmt der längste Abhängigkeitspfad die frühestmögliche Gesamtdauer. Kritische Vorgänge haben dabei keinen Gesamtpuffer. Eine Verkürzung eines anderen Pfads beschleunigt das Projekt nicht automatisch.","example":"Wenn Umsetzung länger als Datenvorbereitung dauert, verkürzt eine schnellere Datenvorbereitung den gemeinsamen Testbeginn zunächst nicht."}],"questions":[{"id":"public-M09-05-Q1","module":9,"lesson_id":"9.5","lesson_title":"Abhängigkeiten, Netzplan und kritischer Pfad","type":"single_choice","question":"Ein Test benötigt zwei Vorgänger, die an Tag 5 und Tag 8 fertig sind. Wann kann er frühestens starten?","options":["Vor Beginn beider Vorgänger, weil er Test heißt.","An Tag 8, wenn keine weiteren Einschränkungen gelten.","An Tag 5, sobald der erste Vorgänger fertig ist.","Immer an Tag 6 unabhängig von den Vorgängern."],"correct_index":1,"explanation":"Alle erforderlichen Vorgänger müssen für den gemeinsamen Start abgeschlossen sein.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-05-Q2","module":9,"lesson_id":"9.5","lesson_title":"Abhängigkeiten, Netzplan und kritischer Pfad","type":"single_choice","question":"Was bestimmt im einfachen Netzplan die frühestmögliche Projektdauer?","options":["Der längste Pfad notwendiger Abhängigkeiten.","Die kürzeste einzelne Aufgabe.","Der alphabetisch erste Vorgang.","Die Summe aller parallel bearbeiteten Aufgaben ohne Beziehungsprüfung."],"correct_index":0,"explanation":"Die längste notwendige Kette begrenzt den frühestmöglichen Abschluss.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-05-Q3","module":9,"lesson_id":"9.5","lesson_title":"Abhängigkeiten, Netzplan und kritischer Pfad","type":"single_choice","question":"Was bedeutet Gesamtpuffer in einem einfachen Terminmodell?","options":["Die maximal erlaubte Anzahl von Besprechungen.","Eine zusätzliche Dauer, die immer vollständig verbraucht werden muss.","Die garantierte Reserve jeder Aufgabe unabhängig von Abhängigkeiten.","Mögliche Verzögerung eines Vorgangs ohne Verschiebung des Projektendes."],"correct_index":3,"explanation":"Puffer beschreibt zeitlichen Spielraum im betrachteten Modell.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M09-05-P1","module":9,"lesson_id":"9.5","lesson_title":"Abhängigkeiten, Netzplan und kritischer Pfad","type":"practice","question":"A dauert 2 Tage. Danach laufen B mit 5 Tagen und C mit 3 Tagen parallel. D dauert 2 Tage und benötigt B und C. Berechne Dauer und kritischen Pfad.","model_answer":"A endet an Tag 2. B endet an Tag 7, C an Tag 5. D kann an Tag 7 starten und endet an Tag 9. Die Gesamtdauer beträgt 9 Tage; A–B–D ist der kritische Pfad. C hat in diesem einfachen Modell 2 Tage Gesamtpuffer.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"PMI · Abhängigkeiten und kritischer Pfad","url":"https://www.pmi.org/learning/library/planning-scheduling-managing-project-8510"}]},{"id":"9.6","module":9,"title":"Kapazität, Aufwand und Drei-Punkt-Schätzung","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Aufwand ist nicht automatisch Kalenderdauer","body":"Eine Schätzung braucht Umfang, Annahmen, verfügbare Fähigkeiten und Abhängigkeiten. Berücksichtige Teilzeit, laufende Aufgaben und Einarbeitung. Zwei Personen halbieren eine Aufgabe nicht zwingend.","example":"Eine Spezialistin ist nur einen halben Tag pro Woche verfügbar; die Planung unterscheidet Arbeitsstunden und frühesten Liefertermin."},{"title":"Unsicherheit mit einer Bandbreite ausdrücken","body":"Die klassische gewichtete PERT-Schätzung verwendet (optimistisch + 4 × wahrscheinlich + pessimistisch) / 6. Sie ist eine Schätzung auf Annahmenbasis, kein garantierter Fertigstellungstermin. Kosten entstehen aus bewerteten Aufwänden und weiteren notwendigen Ausgaben.","example":"Bei 2, 4 und 8 Tagen ergibt sich ein gewichteter Wert von 26 / 6, also etwa 4,33 Tagen."}],"questions":[{"id":"public-M09-06-Q1","module":9,"lesson_id":"9.6","lesson_title":"Kapazität, Aufwand und Drei-Punkt-Schätzung","type":"single_choice","question":"Warum unterscheiden sich Aufwand und Dauer?","options":["Verfügbarkeit und Abhängigkeiten beeinflussen die zeitliche Verteilung.","Weil Aufwand grundsätzlich nur in Euro angegeben werden darf.","Weil eine Aufgabe unabhängig von Kapazität immer gleich viele Kalendertage dauert.","Weil jede weitere Person ohne Abstimmung genau denselben Zeitgewinn erzeugt."],"correct_index":0,"explanation":"Arbeitsmenge und Zeitspanne beschreiben unterschiedliche Sachverhalte.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-06-Q2","module":9,"lesson_id":"9.6","lesson_title":"Kapazität, Aufwand und Drei-Punkt-Schätzung","type":"single_choice","question":"Welcher PERT-Wert ergibt sich aus 1, 3 und 5 Tagen?","options":["9 Tage.","15 Tage.","1 Tag.","3 Tage."],"correct_index":3,"explanation":"(1 + 4 × 3 + 5) / 6 = 18 / 6 = 3.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-06-Q3","module":9,"lesson_id":"9.6","lesson_title":"Kapazität, Aufwand und Drei-Punkt-Schätzung","type":"single_choice","question":"Was gehört zu einer nachvollziehbaren Schätzung?","options":["Die Zusage, dass keine spätere Anpassung nötig sein kann.","Das vollständige Ignorieren benötigter Fähigkeiten.","Dokumentierte Annahmen und erkennbare Unsicherheiten.","Eine möglichst genaue Zahl ohne beschriebenen Umfang."],"correct_index":2,"explanation":"Eine Schätzung wird überprüfbar, wenn ihre Grundlagen bekannt sind.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M09-06-P1","module":9,"lesson_id":"9.6","lesson_title":"Kapazität, Aufwand und Drei-Punkt-Schätzung","type":"practice","question":"Schätze mit PERT aus 2, 5 und 14 Tagen und erkläre, was für die Terminplanung zusätzlich fehlt.","model_answer":"(2 + 4 × 5 + 14) / 6 = 36 / 6 = 6 Tage. Für einen Kalendertermin fehlen unter anderem tatsächliche Verfügbarkeit, Abhängigkeiten und weitere Aufgaben. Annahmen sowie Unsicherheit dokumentieren und die Schätzung bei neuen Erkenntnissen überprüfen.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"PMI · Drei-Punkt-Schätzung","url":"https://www.pmi.org/learning/library/2019/04/07/15/24/leveraging-new-practice-standard-project-estimating-6222"}]},{"id":"9.7","module":9,"title":"Earned Value und verständlicher Projektstatus","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Kosten mit erbrachter Leistung vergleichen","body":"PV ist der geplante Leistungswert zum Stichtag, EV der budgetierte Wert tatsächlich erbrachter Arbeit und AC die angefallenen Kosten. Verbrauchtes Budget allein zeigt daher keinen verlässlichen Fertigstellungsgrad.","example":"Wenn viel Geld ausgegeben wurde, aber wenig vereinbarte Leistung vorliegt, muss der Status diese Differenz sichtbar machen."},{"title":"Kennzahlen sachgerecht interpretieren","body":"CPI = EV / AC beschreibt Kostenleistung, SPI = EV / PV den Leistungsstand gegenüber dem Plan. Werte unter 1 zeigen die entsprechende ungünstige Abweichung. SPI ist keine direkte Zahl verspäteter Kalendertage; Ursachen und Prognose müssen ergänzt werden.","example":"Mit EV 6.000, AC 8.000 und PV 7.500 ergeben sich CPI 0,75 und SPI 0,8."}],"questions":[{"id":"public-M09-07-Q1","module":9,"lesson_id":"9.7","lesson_title":"Earned Value und verständlicher Projektstatus","type":"single_choice","question":"Was bedeutet EV?","options":["Sämtliche bisher bezahlten Rechnungen unabhängig vom Ergebnis.","Die gesamte noch unveränderte Projektplanung.","Eine unmittelbar aus dem Kalender abgelesene Verspätung.","Der budgetierte Wert der tatsächlich erbrachten Leistung."],"correct_index":3,"explanation":"Earned Value bewertet erbrachte Arbeit mit ihrem geplanten Wert.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-07-Q2","module":9,"lesson_id":"9.7","lesson_title":"Earned Value und verständlicher Projektstatus","type":"single_choice","question":"EV beträgt 9.000 Euro, AC 12.000 Euro. Wie hoch ist CPI?","options":["3.000.","0,25.","0,75.","1,33."],"correct_index":2,"explanation":"CPI = 9.000 / 12.000 = 0,75.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-07-Q3","module":9,"lesson_id":"9.7","lesson_title":"Earned Value und verständlicher Projektstatus","type":"single_choice","question":"Wie wird SPI 0,8 angemessen beschrieben?","options":["Es sind ohne weitere Informationen genau 80 Prozent des Gesamtprojekts fertig.","Der erreichte Leistungswert liegt unter dem zum Stichtag geplanten Wert.","Das Projekt ist zwingend genau 20 Kalendertage verspätet.","Alle Kosten liegen automatisch 20 Prozent unter dem Budget."],"correct_index":1,"explanation":"Die Kennzahl bezieht sich auf den geplanten Leistungswert, nicht unmittelbar auf Kalenderdauer oder Gesamtfortschritt.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M09-07-P1","module":9,"lesson_id":"9.7","lesson_title":"Earned Value und verständlicher Projektstatus","type":"practice","question":"PV = 12.000 Euro, EV = 9.000 Euro, AC = 10.000 Euro. Berechne CPI und SPI und ergänze einen sinnvollen Statusschritt.","model_answer":"CPI = 9.000 / 10.000 = 0,9; SPI = 9.000 / 12.000 = 0,75. Kostenleistung und planmäßiger Leistungsstand sind ungünstig. Ursachen und verbleibenden Aufwand prüfen, Handlungsoptionen entwickeln und eine aktualisierte Prognose mit Annahmen berichten.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"PMI · Earned Value und Kennzahlen","url":"https://www.pmi.org/learning/library/practical-calculation-schedule-variance-7028"}]},{"id":"9.8","module":9,"title":"Roll-out koordinieren und Wissen übertragen","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Die Einführung über Aufgaben hinweg koordinieren","body":"Für den Start müssen fachliche Freigabe, Betrieb, Datenübernahme, Kommunikation und Unterstützung zusammenpassen. Verfolge Zuständigkeiten und Übergaben anhand eines abgestimmten Plans. Offene Entscheidungen werden rechtzeitig eskaliert.","example":"Das Portal startet erst im vereinbarten Umfang, wenn Betrieb und Support ihre Bereitschaft bestätigt haben und die Zielgruppe informiert ist."},{"title":"Qualifizierung und sichere Arbeit verankern","body":"Plane aufgabenbezogene Schulung sowie die notwendige Sicherheitsunterweisung. Prüfe anschließend nicht nur Teilnahme, sondern auch sichere Ausführung im Alltag. Erkenntnisse fließen in Unterstützung, Dokumentation und weitere Verbesserungen ein.","example":"Supportkräfte üben einen Berechtigungsfehler, nutzen den freigegebenen Meldeweg und geben keine Kundendaten in öffentliche Kanäle."}],"questions":[{"id":"public-M09-08-Q1","module":9,"lesson_id":"9.8","lesson_title":"Roll-out koordinieren und Wissen übertragen","type":"single_choice","question":"Welche Abstimmung gehört zur Roll-out-Koordination?","options":["Den Betrieb grundsätzlich erst nach Abschaltung des Altsystems beteiligen.","Alle offenen Entscheidungen bis nach dem breiten Start aufheben.","Freigabe, Betrieb, Kommunikation und Unterstützung miteinander verbinden.","Nur den Starttermin in einer Präsentation ändern."],"correct_index":2,"explanation":"Ein koordinierter Start braucht zusammenpassende Vorbereitungen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-08-Q2","module":9,"lesson_id":"9.8","lesson_title":"Roll-out koordinieren und Wissen übertragen","type":"single_choice","question":"Was sollte eine praktische Sicherheitsunterweisung trainieren?","options":["Das Abschalten jeder Rückfragemöglichkeit bei Unsicherheit.","Relevante sichere Handlungen und bekannte Meldewege.","Das ungeprüfte Weitergeben aller Zugangsdaten.","Nur die Anzahl der vorhandenen Richtlinien auswendig lernen."],"correct_index":1,"explanation":"Sicheres Verhalten muss in tatsächlichen Arbeitssituationen ausführbar sein.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M09-08-Q3","module":9,"lesson_id":"9.8","lesson_title":"Roll-out koordinieren und Wissen übertragen","type":"single_choice","question":"Welche Beobachtung prüft den Wissenstransfer besonders direkt?","options":["Eine relevante Aufgabe wird im Arbeitsalltag korrekt ausgeführt.","Nur eine unterschriebene Teilnehmerliste.","Die Dateigröße der Schulungspräsentation.","Die Zahl der während der Schulung gezeigten Menüs."],"correct_index":0,"explanation":"Teilnahme allein beweist keine sichere Anwendung des Gelernten.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M09-08-P1","module":9,"lesson_id":"9.8","lesson_title":"Roll-out koordinieren und Wissen übertragen","type":"practice","question":"Erstelle eine kurze Abschluss-Checkliste für einen koordinierten Portal-Roll-out.","model_answer":"Freigegebenen Umfang und Entscheidung festhalten. Betrieb, Datenübernahme und Rückfallplan abstimmen. Zielgruppen informieren, Aufgaben praktisch schulen und sichere Meldewege erklären. Zuständigkeiten, Unterstützung und Eskalation für den Start benennen. Fachliche Nutzung und offene Punkte nach dem Start prüfen und Verbesserungen nachverfolgen.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]}],"cards":[{"id":"train-SKY-017","lesson_id":"2.0","number":1,"type":"Übungskarte","displayFront":"Welches Altsystem wird im durchgängigen Kursfall abgelöst?","answer":"PALOS — PALOS bildet den Ausgangszustand; Lagerkompass ist das neue Projekt."},{"id":"train-SKY-018","lesson_id":"2.0","number":2,"type":"Übungskarte","displayFront":"Welche Person kennt als Key-Userin die Lagerabläufe besonders gut?","answer":"Heike Schulz — Heike Schulz ist Lagerleiterin und fachliche Ansprechpartnerin für die tatsächlichen Abläufe."},{"id":"train-SKY-019","lesson_id":"2.0","number":3,"type":"Übungskarte","displayFront":"Warum ist ein nächtlicher Batch-Abgleich für aktuelle Bestände problematisch?","answer":"Änderungen sind zwischen den Abgleichen nicht überall aktuell — Die verzögerte Synchronisation kann veraltete Bestandsinformationen verursachen."},{"id":"train-SKY-021","lesson_id":"2.1","number":4,"type":"Übungskarte","displayFront":"Was unterscheidet einen Bedarf von einem Lösungswunsch?","answer":"Der Bedarf beschreibt das zugrunde liegende Problem oder Ziel — Der Wunsch nach einer bestimmten App kann beispielsweise auf dem Bedarf nach weniger Erfassungsfehlern beruhen."},{"id":"train-SKY-022","lesson_id":"2.1","number":5,"type":"Übungskarte","displayFront":"Wer zählt als Stakeholder eines Softwareprojekts?","answer":"Eine Person oder Gruppe, die das Projekt beeinflusst oder davon betroffen ist — Auch Anwender, Betrieb, Datenschutz und angrenzende Fachbereiche können beteiligt sein."},{"id":"train-SKY-023","lesson_id":"2.1","number":6,"type":"Übungskarte","displayFront":"Was beschreibt eine Persona?","answer":"Ein auf Erkenntnissen beruhendes Beispiel einer Nutzergruppe — Personas machen Ziele, Arbeitsumfeld und Schwierigkeiten typischer Nutzer greifbar."},{"id":"train-SKY-025","lesson_id":"2.2","number":7,"type":"Übungskarte","displayFront":"Welche Methode zeigt besonders gut den tatsächlichen Arbeitsablauf?","answer":"Beobachtung am Arbeitsplatz — Beobachtung macht Medienbrüche, Umwege und implizites Wissen sichtbar."},{"id":"train-SKY-026","lesson_id":"2.2","number":8,"type":"Übungskarte","displayFront":"Welche Aussage ist eine funktionale Anforderung?","answer":"Das System muss eine Lieferung erfassen können — Funktionale Anforderungen beschreiben eine Fähigkeit des Systems."},{"id":"train-SKY-027","lesson_id":"2.2","number":9,"type":"Übungskarte","displayFront":"Welche Formulierung ist am besten überprüfbar?","answer":"95 Prozent der Bestandsabfragen antworten unter definierter Testlast innerhalb von zwei Sekunden — Messgröße, Grenzwert und Bedingungen ermöglichen eine objektive Prüfung."},{"id":"train-SKY-029","lesson_id":"2.3","number":10,"type":"Übungskarte","displayFront":"Wer beschreibt im klassischen Lastenheft vor allem die Anforderungen?","answer":"Der Auftraggeber — Das Lastenheft beschreibt aus Auftraggebersicht, was erreicht werden soll."},{"id":"train-SKY-030","lesson_id":"2.3","number":11,"type":"Übungskarte","displayFront":"Welche Form folgt einer typischen User Story?","answer":"Als Rolle möchte ich Funktion, damit Nutzen — Die Story verknüpft Nutzerrolle, gewünschte Fähigkeit und Nutzen."},{"id":"train-SKY-031","lesson_id":"2.3","number":12,"type":"Übungskarte","displayFront":"Was ist der Zweck von Traceability?","answer":"Anforderungen mit Umsetzung und Nachweisen verknüpfen — Verknüpfungen unterstützen Änderungsfolgenanalyse und den Nachweis der Erfüllung."},{"id":"train-SKY-033","lesson_id":"2.4","number":13,"type":"Übungskarte","displayFront":"Was bedeutet Won't Have this time?","answer":"Bewusst außerhalb des aktuellen Umfangs — Won't beschreibt eine Entscheidung für den betrachteten Zeitraum oder Release."},{"id":"train-SKY-034","lesson_id":"2.4","number":14,"type":"Übungskarte","displayFront":"Was kennzeichnet ein Basismerkmal im Kano-Modell?","answer":"Fehlen erzeugt Unzufriedenheit, Erfüllung wird erwartet — Basismerkmale werden häufig als selbstverständlich vorausgesetzt."},{"id":"train-SKY-035","lesson_id":"2.4","number":15,"type":"Übungskarte","displayFront":"Wie entsteht ein gewichteter Gesamtnutzwert?","answer":"Bewertungen je Kriterium mit den Gewichte
