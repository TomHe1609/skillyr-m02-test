iert","Ein Objekt muss stets allein existieren","Jede Tabelle erbt von jeder anderen","Eine Funktion darf keine Rückgabe haben"],"correct_index":0,"explanation":"Observer unterstützt ereignisbezogene Benachrichtigungen.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-091","module":3,"lesson_id":"3.6","lesson_title":"Objektorientierung, Entwurfsmuster und UML","type":"single_choice","question":"Welche Information zeigt ein UML-Klassendiagramm besonders gut?","options":["Ausschließlich den Projektkalender","Nur die zeitliche Reihenfolge aller Requests","Nur die aktuellen Stromkosten","Klassen, Attribute, Operationen und Beziehungen"],"correct_index":3,"explanation":"Statische Struktur ist das Hauptanliegen des Klassendiagramms.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"SKY-092","module":3,"lesson_id":"3.6","lesson_title":"Objektorientierung, Entwurfsmuster und UML","type":"practice","question":"Für Mengenabweichungen gelten je Kunde verschiedene Bewertungsregeln. Entwirf eine Erweiterung.","model_answer":"Eine gemeinsame Schnittstelle für die Bewertung definieren. Jede Kundenregel als eigene Strategie implementieren. Die passende Strategie abhängig von der Konfiguration auswählen und je Regel Tests erstellen. Neue Varianten erfordern keine große zentrale Fallunterscheidung.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"3.7","module":3,"title":"Versionsmanagement und CI/CD-Pipeline","trainingMinutes":6,"minutes":0,"slide_count":0,"concepts":[{"title":"Änderungen nachvollziehbar integrieren","body":"Kleine Branches, Reviews und vereinbarte Integrationsregeln erleichtern gemeinsame Arbeit. Das Umschreiben gemeinsam verwendeter Historie braucht Abstimmung.","example":"Ein Pull Request enthält einen begrenzten fachlichen Schritt und passende Prüfungen. Ein Rebase wird mit den Beteiligten abgesprochen."},{"title":"Automatisierung braucht klare Freigaben","body":"Continuous Integration prüft integrierte Änderungen früh. Continuous Delivery hält eine auslieferbare Fassung bereit; Continuous Deployment automatisiert auch den Produktionsschritt.","example":"Eine Pipeline testet, baut ein versioniertes Artefakt und stellt es zunächst auf einer Testumgebung bereit. Geheimnisse kommen aus einer geschützten Verwaltung."}],"questions":[{"id":"SKY-093","module":3,"lesson_id":"3.7","lesson_title":"Versionsmanagement und CI/CD-Pipeline","type":"single_choice","question":"Warum ist ein Rebase eines gemeinsam genutzten Branches abzustimmen?","options":["Weil Rebase nur Datenbanktabellen betrifft","Weil dabei zwangsläufig das Passwort geändert wird","Weil Rebase jede Datei automatisch löscht","Weil Commit-Historie umgeschrieben und andere Arbeit dadurch betroffen werden kann"],"correct_index":3,"explanation":"Die geänderten Commit-Identitäten können bei anderen Arbeitskopien Konflikte verursachen.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-094","module":3,"lesson_id":"3.7","lesson_title":"Versionsmanagement und CI/CD-Pipeline","type":"single_choice","question":"Was unterscheidet Continuous Deployment von Continuous Delivery?","options":["Es werden keine Tests ausgeführt","Die Software wird ausschließlich lokal gespeichert","Es gibt keine Versionsverwaltung","Produktionsbereitstellung erfolgt automatisiert ohne manuelle Freigabestufe"],"correct_index":3,"explanation":"Continuous Delivery hält auslieferbare Änderungen bereit, kann aber eine manuelle Freigabe vor Produktion enthalten.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"SKY-095","module":3,"lesson_id":"3.7","lesson_title":"Versionsmanagement und CI/CD-Pipeline","type":"single_choice","question":"Wie sollten Pipeline-Secrets bereitgestellt werden?","options":["In allen Build-Logs vollständig ausgeben","Über dafür vorgesehene geschützte Secret-Verwaltung","Klartext im öffentlichen Repository","Im Titel jedes Commits"],"correct_index":1,"explanation":"Secrets müssen vor unbefugtem Zugriff und unbeabsichtigter Ausgabe geschützt werden.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"SKY-096","module":3,"lesson_id":"3.7","lesson_title":"Versionsmanagement und CI/CD-Pipeline","type":"practice","question":"Plane fünf Stufen einer Pipeline für eine API.","model_answer":"Abhängigkeiten reproduzierbar installieren; statische Prüfungen ausführen; Unit- und Integrationstests ausführen; versioniertes Artefakt bauen und prüfen; auf einer Testumgebung bereitstellen und nach definierter Freigabe ausrollen. Secrets und Rollback getrennt berücksichtigen.","max_points":5,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"3.8","module":3,"title":"Release-Management und Software-Paketierung","trainingMinutes":6,"minutes":0,"slide_count":0,"concepts":[{"title":"Ein Release ist mehr als neuer Code","body":"Eine Auslieferung braucht eine nachvollziehbare Version, ein überprüftes Artefakt und Hinweise zu Änderungen. Bei SemVer signalisiert eine inkompatible Änderung der öffentlichen API eine neue Major-Version.","example":"Vor einem Roll-out prüft das Team, ob die bisherige Client-Version das neue Antwortformat weiterhin verarbeiten kann."},{"title":"Den Rückweg vor dem Roll-out klären","body":"Ein Rollback muss zu Anwendung und bereits geänderten Daten passen. Zwei Bereitstellungsumgebungen können einen schnellen Verkehrswechsel ermöglichen, ersetzen aber keine Kompatibilitätsprüfung.","example":"Eine neue Datenbankspalte wird zuerst kompatibel eingeführt. Erst nach erfolgreicher Umstellung darf die alte Zugriffsmöglichkeit entfallen."}],"questions":[{"id":"SKY-097","module":3,"lesson_id":"3.8","lesson_title":"Release-Management und Software-Paketierung","type":"single_choice","question":"Welche Versionserhöhung signalisiert bei SemVer eine inkompatible Änderung der öffentlichen API?","options":["Nur Build-Metadaten","Keine Änderung der Versionsnummer","Major","Patch"],"correct_index":2,"explanation":"Eine inkompatible Änderung wird im MAJOR-Anteil sichtbar gemacht.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"SKY-098","module":3,"lesson_id":"3.8","lesson_title":"Release-Management und Software-Paketierung","type":"single_choice","question":"Was ist der Hauptzweck von Release Notes?","options":["Anwender über Änderungen und relevante Folgen eines Releases informieren","Nur die Zahl der Entwickler nennen","Alle geheimen Zugangsdaten veröffentlichen","Jede Quellcodezeile wiedergeben"],"correct_index":0,"explanation":"Release Notes beschreiben neue Funktionen, Änderungen, bekannte Probleme und gegebenenfalls Umstellungshinweise.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-099","module":3,"lesson_id":"3.8","lesson_title":"Release-Management und Software-Paketierung","type":"single_choice","question":"Wie unterstützt Blue-Green Deployment einen schnellen Wechsel?","options":["Durch manuelles Ändern jeder Clientdatei","Durch Verzicht auf eine zweite Umgebung","Durch Löschen aller alten Daten vor dem Test","Durch zwei Umgebungen, zwischen denen Verkehr umgeschaltet wird"],"correct_index":3,"explanation":"Eine Umgebung kann geprüft werden, während die andere weiterhin bedient; Datenkompatibilität bleibt zu planen.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"SKY-100","module":3,"lesson_id":"3.8","lesson_title":"Release-Management und Software-Paketierung","type":"practice","question":"Ein Release verursacht Fehler bei Buchungen. Skizziere einen Hotfix- und Rückfallablauf.","model_answer":"Fehler eingrenzen und betroffene Änderungen bewerten; gegebenenfalls Verkehr zur geprüften alten Version zurückschalten; Datenkompatibilität und bereits erfolgte Buchungen prüfen; Fix mit Regressionstest bauen; versionieren und kontrolliert ausrollen; Ursache und Maßnahmen dokumentieren.","max_points":5,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"3.9","module":3,"title":"Sicherheitsmaßnahmen in der Entwicklung","trainingMinutes":6,"minutes":0,"slide_count":0,"concepts":[{"title":"Eingaben und Berechtigungen getrennt behandeln","body":"Validierung prüft, ob Daten zum erwarteten Format und zur Fachregel passen. Autorisierung prüft, ob die anfragende Identität auf eine konkrete Ressource zugreifen darf.","example":"Eine syntaktisch gültige Rechnungsnummer berechtigt noch nicht dazu, die Rechnung einer anderen Person zu lesen."},{"title":"Geheimnisse und Daten schützen","body":"Parametrisierte Abfragen trennen SQL-Struktur von Eingabewerten. Passwörter brauchen ein geeignetes Passwort-Hashverfahren; API-Schlüssel gehören in eine geschützte serverseitige Verwaltung.","example":"Der Server kontrolliert einen Datenzugriff und setzt eine parametrisierte Abfrage ein. In Browser-Code oder Logs stehen keine geheimen Zugangsdaten."}],"questions":[{"id":"SKY-101","module":3,"lesson_id":"3.9","lesson_title":"Sicherheitsmaßnahmen in der Entwicklung","type":"single_choice","question":"Welche Maßnahme schützt SQL-Abfragen vor der Interpretation von Nutzereingaben als SQL-Code?","options":["Passwörter nur länger machen","Parametrisierte Abfragen","Alle Fehler ignorieren","Nutzereingaben direkt in SQL-Strings einsetzen"],"correct_index":1,"explanation":"Daten werden getrennt von der SQL-Struktur übergeben; ergänzend bleiben Rechte und Validierung wichtig.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-102","module":3,"lesson_id":"3.9","lesson_title":"Sicherheitsmaßnahmen in der Entwicklung","type":"single_choice","question":"Welche Speicherung ist für Benutzerpasswörter vorgesehen?","options":["Reversible Verschlüsselung ohne weitere Begründung","Klartext in einer Datenbank","Ein geeignetes langsames Passwort-Hashverfahren mit individuellem Salt","Nur Base64-Codierung"],"correct_index":2,"explanation":"Ein Passwort-Hashverfahren erschwert das massenhafte Durchprobieren; ein Salt verhindert identische Hashes bei gleichen Passwörtern.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-103","module":3,"lesson_id":"3.9","lesson_title":"Sicherheitsmaßnahmen in der Entwicklung","type":"single_choice","question":"Was muss vor dem Zugriff auf eine konkrete Lieferung geprüft werden?","options":["Ob die anfragende Identität für genau diese Ressource berechtigt ist","Nur ob die Anfrage eine Zahl enthält","Nur ob die URL bekannt ist","Nur ob der Browser modern ist"],"correct_index":0,"explanation":"Authentifizierung allein ersetzt keine ressourcenbezogene Autorisierung.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"SKY-104","module":3,"lesson_id":"3.9","lesson_title":"Sicherheitsmaßnahmen in der Entwicklung","type":"practice","question":"Ein Nutzer ändert eine Lieferungs-ID in der URL und sieht fremde Daten. Benenne Ursache, Maßnahme und Test.","model_answer":"Ursache ist fehlende beziehungsweise fehlerhafte objektbezogene Autorisierung. Berechtigung serverseitig für jede Ressource prüfen. Ein Test mit einem berechtigten und einem unberechtigten Konto muss zeigen, dass fremde Ressourcen auch bei manipulierter ID nicht gelesen oder geändert werden können.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"3.10","module":3,"title":"Integrationsprojekt: Vom Entwurf zur sicheren Anwendung","trainingMinutes":6,"minutes":0,"slide_count":0,"concepts":[{"title":"Eine durchgängige Lösung bauen","body":"Anforderung, API-Vertrag, Datenmodell, Umsetzung und Test sollen dieselbe fachliche Aufgabe abdecken. Ein kleiner vollständiger Ablauf zeigt mehr als viele voneinander getrennte Fragmente.","example":"Eine Reservierung wird vom Formular bis zum gespeicherten Datensatz demonstriert, einschließlich eines verständlichen Konfliktfalls."},{"title":"Zwischenstände überprüfbar machen","body":"Checkpoints brauchen sichtbare Ergebnisse und Kriterien. Risiken, offene Annahmen und begründete Entscheidungen werden dabei früh besprochen.","example":"Zuerst werden Vertrag und Modell geprüft, danach ein funktionierender Ablauf und zum Schluss Betrieb, Dokumentation und Fehlerfälle."}],"questions":[{"id":"SKY-105","module":3,"lesson_id":"3.10","lesson_title":"Integrationsprojekt: Vom Entwurf zur sicheren Anwendung","type":"single_choice","question":"Was sollte in einem Integrationsprojekt durchgängig verbunden sein?","options":["Nur Dateien ohne fachlichen Bezug","Anforderungen, Entwurf, Umsetzung und Tests","Nur die letzte Präsentationsfolie","Nur der Projektname und die Farbe"],"correct_index":1,"explanation":"Die Verbindung zeigt, dass die technische Lösung das fachliche Ziel erfüllt.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-106","module":3,"lesson_id":"3.10","lesson_title":"Integrationsprojekt: Vom Entwurf zur sicheren Anwendung","type":"single_choice","question":"Wozu dienen Checkpoints in einem Projekt?","options":["Nur Arbeitszeit zählen","Tests vollständig ersetzen","Entscheidungen bis zum Ende vermeiden","Ergebnisse früh prüfen und Abweichungen rechtzeitig erkennen"],"correct_index":3,"explanation":"Kurze Überprüfungen verhindern, dass große Fehler erst bei der Abschlusspräsentation auffallen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"SKY-107","module":3,"lesson_id":"3.10","lesson_title":"Integrationsprojekt: Vom Entwurf zur sicheren Anwendung","type":"single_choice","question":"Welche Aussage ist eine belastbare technische Begründung?","options":["Der Name klingt modern","Ein anderer Kurs benutzt sie","Die Technologie ist gerade beliebt","Die Entscheidung erfüllt eine benannte Anforderung und ihre Nachteile werden bewertet"],"correct_index":3,"explanation":"Eine gute Begründung enthält fachlichen Bezug und eine Abwägung.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"SKY-108","module":3,"lesson_id":"3.10","lesson_title":"Integrationsprojekt: Vom Entwurf zur sicheren Anwendung","type":"practice","question":"Plane ein kleines Wareneingangsprojekt mit drei überprüfbaren Zwischenständen.","model_answer":"Stand 1: Anforderungen, API-Vertrag und Datenmodell abgestimmt. Stand 2: Eine gültige Buchung und wichtige Fehlerfälle implementiert und getestet. Stand 3: CI, Zugriffsprüfung, Dokumentation und reproduzierbare Bereitstellung gezeigt. Jeden Stand anhand vorab definierter Kriterien prüfen.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"3.11","module":3,"title":"Prüfungsvorbereitung und Modulabschluss","trainingMinutes":6,"minutes":0,"slide_count":0,"concepts":[{"title":"Den Arbeitsauftrag genau lesen","body":"Operator, verlangte Anzahl und Situationsbezug bestimmen die Antwort. Eine Empfehlung braucht eine nachvollziehbare Begründung, nicht nur einen bekannten Produktnamen.","example":"Bei „Begründen Sie zwei Maßnahmen“ nennt die Antwort zwei passende Maßnahmen und erklärt für beide die Wirkung im beschriebenen Fall."},{"title":"Die Lösung aus mehreren Blickwinkeln prüfen","body":"Eine technische Entscheidung lässt sich mit Anforderungen, Datenkonsistenz, Sicherheit und Tests verbinden. Eine angemessene Zeitverteilung lässt Raum für alle Teilaufgaben.","example":"Nach einer Antwort zur API überprüfst du, ob Fehlerfälle, Berechtigungen und der Bezug zum Beispiel tatsächlich enthalten sind."}],"questions":[{"id":"SKY-109","module":3,"lesson_id":"3.11","lesson_title":"Prüfungsvorbereitung und Modulabschluss","type":"single_choice","question":"Was solltest du vor dem Schreiben einer Prüfungsantwort klären?","options":["Die Produktfarbe","Operator, verlangte Anzahl und Fallbezug","Nur die Länge der eigenen Antwort","Die Lieblingssprache des Prüfers"],"correct_index":1,"explanation":"Diese Vorgaben bestimmen Form und Tiefe der Antwort.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"SKY-110","module":3,"lesson_id":"3.11","lesson_title":"Prüfungsvorbereitung und Modulabschluss","type":"single_choice","question":"Welche Struktur eignet sich für eine begründete Empfehlung?","options":["Anforderung, Entscheidung, Nutzen und Nachteil beziehungsweise Gegenmaßnahme","Eine Lösung ohne Bezug zur Situation","Produktname ohne Erklärung","Ausschließlich eine Abkürzungsliste"],"correct_index":0,"explanation":"Die Struktur macht die fachliche Herleitung nachvollziehbar.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-111","module":3,"lesson_id":"3.11","lesson_title":"Prüfungsvorbereitung und Modulabschluss","type":"single_choice","question":"Wie hilft eine Zeitplanung bei mehreren Teilaufgaben?","options":["Sie ersetzt jede fachliche Vorbereitung","Sie macht alle Aufgaben gleich schwer","Sie erlaubt, alle Operatoren zu ignorieren","Sie verteilt Zeit angemessen und verhindert das Festhalten an einer einzelnen Aufgabe"],"correct_index":3,"explanation":"Arbeitszeit sollte sich an Umfang und erwarteter Bewertung orientieren.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"SKY-112","module":3,"lesson_id":"3.11","lesson_title":"Prüfungsvorbereitung und Modulabschluss","type":"practice","question":"Begründe für eine Wareneingangs-API die Kombination aus Transaktionen, Autorisierung und Integrationstests.","model_answer":"Transaktionen verhindern unvollständige Buchungen. Autorisierung schützt fremde Lieferungen und Standorte. Integrationstests prüfen, ob API und Datenbank gemeinsam gültige und fehlerhafte Fälle korrekt behandeln. Alle drei Maßnahmen beziehen sich auf Konsistenz und Schutz der konkreten Buchungsprozesse.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"4.1","module":4,"title":"Qualitätsziele und Qualitätssicherung","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Qualität in beobachtbare Ziele übersetzen","body":"Ein Qualitätswunsch wird überprüfbar, wenn Situation, Messgröße und Zielwert zusammenpassen. Funktionalität, Zuverlässigkeit, Bedienbarkeit und Wartbarkeit betreffen unterschiedliche Blickwinkel.","example":"Statt „Die Suche ist schnell“ wird eine maximale Antwortzeit für eine festgelegte Last vereinbart."},{"title":"Vorbeugen und untersuchen","body":"Konstruktive Maßnahmen helfen, Fehler zu vermeiden. Analytische Maßnahmen suchen Fehler oder bewerten Ergebnisse; beide ergänzen sich.","example":"Ein Coding-Standard unterstützt die Umsetzung. Ein Review und ein Test untersuchen das entstandene Ergebnis."}],"questions":[{"id":"M04-01-Q1","module":4,"lesson_id":"4.1","lesson_title":"Qualitätsziele und Qualitätssicherung","type":"single_choice","question":"Welches Qualitätsziel lässt sich am besten prüfen?","options":["Die Anwendung wirkt zeitgemäß.","Bei definierter Last antworten 95 % der Suchanfragen in höchstens zwei Sekunden.","Die Anwendung ist perfekt.","Jede Person findet die Software schön."],"correct_index":1,"explanation":"Die Aussage nennt einen überprüfbaren Zielwert und eine Bedingung.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-01-Q2","module":4,"lesson_id":"4.1","lesson_title":"Qualitätsziele und Qualitätssicherung","type":"single_choice","question":"Welche Maßnahme ist vor allem konstruktive Qualitätssicherung?","options":["Ein Fehlerprotokoll nach dem Systemtest lesen.","Einen aufgetretenen Absturz nachstellen.","Verbindliche Implementierungsregeln für das Team vereinbaren.","Eine fertige Oberfläche auf Bedienfehler untersuchen."],"correct_index":2,"explanation":"Gemeinsame Regeln sollen Fehler bereits während der Entstehung vermeiden.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-01-Q3","module":4,"lesson_id":"4.1","lesson_title":"Qualitätsziele und Qualitätssicherung","type":"single_choice","question":"Warum reichen viele fehlerfreie Unit-Tests allein nicht für eine Qualitätsaussage?","options":["Weitere Qualitätsziele und das Zusammenspiel des Systems müssen ebenfalls betrachtet werden.","Unit-Tests dürfen nie verwendet werden.","Qualität hängt ausschließlich vom Projektnamen ab.","Jeder Test beweist automatisch vollständige Fehlerfreiheit."],"correct_index":0,"explanation":"Ein einzelner Testtyp deckt nicht alle Anforderungen und Nutzungssituationen ab.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M04-01-P1","module":4,"lesson_id":"4.1","lesson_title":"Qualitätsziele und Qualitätssicherung","type":"practice","question":"Formuliere für eine Termin-App ein messbares Qualitätsziel und zwei passende QS-Maßnahmen.","model_answer":"Beispiel: Unter festgelegter Last müssen 95 % der Terminabfragen innerhalb von zwei Sekunden beantwortet werden. Eine verbindliche Abfragestruktur und ein Review wirken vorbeugend; ein Lasttest überprüft den Zielwert unter dokumentierten Bedingungen.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"4.2","module":4,"title":"Testplanung und Nachverfolgbarkeit","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Tests auf Anforderungen zurückführen","body":"Ein Testziel beschreibt, welche Eigenschaft untersucht wird. Die Verbindung zwischen Anforderung und Test hilft, fehlende Abdeckung und Änderungen sichtbar zu machen.","example":"Die Anforderung „Nur eigene Rechnungen lesen“ erhält Tests für ein berechtigtes und ein fremdes Konto."},{"title":"Die passende Teststufe wählen","body":"Unit-, Integrations-, System- und Abnahmetests betrachten unterschiedliche Grenzen. Ein Testplan legt Umfang, Risiken, Umgebung und Entscheidungsregeln fest.","example":"Das Zusammenspiel von API und Datenbank wird integriert getestet; eine fachliche Nutzerreise wird am Gesamtsystem bewertet."}],"questions":[{"id":"M04-02-Q1","module":4,"lesson_id":"4.2","lesson_title":"Testplanung und Nachverfolgbarkeit","type":"single_choice","question":"Wozu dient eine Nachverfolgbarkeitsmatrix?","options":["Sie ersetzt die Anforderungen.","Sie zählt nur die Dateien.","Sie verbindet Anforderungen mit zugehörigen Tests und Ergebnissen.","Sie speichert geheime Zugangsdaten."],"correct_index":2,"explanation":"So werden Abdeckung und Auswirkungen von Änderungen nachvollziehbar.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-02-Q2","module":4,"lesson_id":"4.2","lesson_title":"Testplanung und Nachverfolgbarkeit","type":"single_choice","question":"Was ist ein sinnvoller Schwerpunkt eines Integrationstests?","options":["Nur den Namen einer Funktion lesen.","Die Zusammenarbeit von API und Testdatenbank prüfen.","Die Schriftfarbe einer Präsentation ändern.","Projektbudgets freigeben."],"correct_index":1,"explanation":"Integrationstests betrachten Schnittstellen und Zusammenarbeit mehrerer Komponenten.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-02-Q3","module":4,"lesson_id":"4.2","lesson_title":"Testplanung und Nachverfolgbarkeit","type":"single_choice","question":"Welche Information gehört in einen Testplan?","options":["Nur die Lieblingssprache des Teams.","Eine Garantie, dass nie Fehler auftreten.","Alle privaten Passwörter.","Testumfang, Risiken, Testumgebung und Abschlusskriterien."],"correct_index":3,"explanation":"Ein Plan macht Durchführung und Bewertung der Tests nachvollziehbar.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M04-02-P1","module":4,"lesson_id":"4.2","lesson_title":"Testplanung und Nachverfolgbarkeit","type":"practice","question":"Eine Freigabe darf nur durch die zuständige Rolle erfolgen. Leite zwei Tests und ein Abnahmekriterium ab.","model_answer":"Ein berechtigtes Konto kann den passenden Vorgang freigeben. Ein nicht berechtigtes Konto erhält auch bei direktem API-Aufruf keinen Zugriff. Ein mögliches Kriterium ist, dass beide Fälle in der vereinbarten Testumgebung nachweislich wie beschrieben funktionieren.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"4.3","module":4,"title":"Testfälle, Grenzwerte und Methoden","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Eingabebereiche sinnvoll aufteilen","body":"Äquivalenzklassen bündeln Eingaben mit erwartet ähnlichem Verhalten. Grenzwerte verdienen besondere Aufmerksamkeit, weil sich das erlaubte Verhalten dort ändert.","example":"Bei einer erlaubten Menge von 1 bis 20 prüft das Team unter anderem 0, 1, 20 und 21."},{"title":"Erwartungen vor dem Test festhalten","body":"Ein Testfall beschreibt Voraussetzungen, Eingabe oder Aktion und erwartetes Ergebnis. Black-Box-Tests leiten Fälle aus sichtbarem Verhalten ab; White-Box-Tests nutzen zusätzlich die innere Struktur.","example":"Eine Entscheidungstabelle macht Kombinationen aus Kundentyp und Bestellwert nachvollziehbar."}],"questions":[{"id":"M04-03-Q1","module":4,"lesson_id":"4.3","lesson_title":"Testfälle, Grenzwerte und Methoden","type":"single_choice","question":"Welche Werte passen besonders zur Grenzwertanalyse für eine erlaubte Menge von 1 bis 20?","options":["0, 1, 20 und 21","Nur 10 und 11","Ausschließlich 100","Immer die leere Liste"],"correct_index":0,"explanation":"Die Werte liegen an den Grenzen oder direkt außerhalb des erlaubten Bereichs.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-03-Q2","module":4,"lesson_id":"4.3","lesson_title":"Testfälle, Grenzwerte und Methoden","type":"single_choice","question":"Welche Angabe macht einen Testfall auswertbar?","options":["Nur der Zeitpunkt des Mittagessens.","Ein erwartetes, beobachtbares Ergebnis.","Eine beliebige Dateifarbe.","Der Satz „Es wird schon funktionieren“."],"correct_index":1,"explanation":"Erst ein vorab beschriebenes Soll-Ergebnis ermöglicht einen belastbaren Vergleich.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-03-Q3","module":4,"lesson_id":"4.3","lesson_title":"Testfälle, Grenzwerte und Methoden","type":"single_choice","question":"Wann ist eine Entscheidungstabelle besonders hilfreich?","options":["Wenn keine Regeln bekannt sind und keine geklärt werden sollen.","Nur beim Umbenennen von Dateien.","Wenn mehrere Bedingungen gemeinsam ein fachliches Ergebnis bestimmen.","Wenn alle Kombinationen grundsätzlich verboten sind."],"correct_index":2,"explanation":"Tabellen helfen, Kombinationen systematisch und lückenbewusst zu betrachten.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M04-03-P1","module":4,"lesson_id":"4.3","lesson_title":"Testfälle, Grenzwerte und Methoden","type":"practice","question":"Ein Rabatt gilt nur für Mitglieder mit einem Warenwert von mindestens 100 Euro. Skizziere passende Testfälle.","model_answer":"Prüfe Mitglieder unter 100 Euro, genau bei 100 Euro und darüber. Ergänze Nichtmitglieder bei denselben relevanten Werten. Halte für jeden Fall fest, ob ein Rabatt erwartet wird, und grenze die betrachtete Berechnungsregel klar ab.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"4.4","module":4,"title":"Testumgebung, Testdaten und Automatisierung","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Tests reproduzierbar aufbauen","body":"Eine definierte Umgebung und bekannte Daten machen Ergebnisse vergleichbar. Testdaten müssen den vorgesehenen Zugriff und die betrachteten Fälle abbilden, ohne unnötige echte personenbezogene Daten zu übernehmen.","example":"Ein Skript erzeugt synthetische Bestellungen und setzt die Testdatenbank vor einem Lauf in einen bekannten Zustand."},{"title":"Automatisierung gezielt einsetzen","body":"Häufig wiederholte, stabil prüfbare Abläufe sind gute Kandidaten. Die Testpyramide hilft beim Abwägen vieler schneller Prüfungen und ausgewählter aufwendiger Systemabläufe.","example":"Ein Mengenvalidator wird mit vielen Unit-Fällen geprüft; wenige UI-Tests decken kritische Nutzerreisen ab."}],"questions":[{"id":"M04-04-Q1","module":4,"lesson_id":"4.4","lesson_title":"Testumgebung, Testdaten und Automatisierung","type":"single_choice","question":"Welche Eigenschaft unterstützt reproduzierbare Tests?","options":["Unbekannte Startdaten bei jedem Lauf.","Gemeinsam genutzte Produktionskonten für alle Tests.","Ein dokumentierter Aufbau mit definiertem Ausgangszustand.","Das Ignorieren von Versionsständen."],"correct_index":2,"explanation":"Ein kontrollierter Ausgangszustand macht Unterschiede und Fehler leichter erklärbar.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-04-Q2","module":4,"lesson_id":"4.4","lesson_title":"Testumgebung, Testdaten und Automatisierung","type":"single_choice","question":"Welche Testdaten sind für eine allgemeine Testumgebung oft ein geeigneter Ausgangspunkt?","options":["Ungeprüft kopierte vollständige Kundendaten.","Passende synthetische Daten mit bekannten Eigenschaften.","Nur geheime Administratorpasswörter.","Zufällige Daten ohne erwartetes Ergebnis."],"correct_index":1,"explanation":"Synthetische Daten können gezielt Fälle abdecken und unnötige Offenlegung echter Daten vermeiden.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-04-Q3","module":4,"lesson_id":"4.4","lesson_title":"Testumgebung, Testdaten und Automatisierung","type":"single_choice","question":"Welcher Ablauf eignet sich besonders für Automatisierung?","options":["Eine einmalige unklare Produktidee ohne Prüfkriterium.","Das persönliche Bauchgefühl zum Design.","Jede spontane Besprechung.","Ein regelmäßig wiederholter, eindeutig auswertbarer Regressionstest."],"correct_index":3,"explanation":"Wiederholung und klare Erwartungen machen den Nutzen von Automatisierung gut erkennbar.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M04-04-P1","module":4,"lesson_id":"4.4","lesson_title":"Testumgebung, Testdaten und Automatisierung","type":"practice","question":"Plane eine Testumgebung für eine Buchungs-API mit Datenbank.","model_answer":"Verwende eine getrennte Testdatenbank mit bekanntem Schema und synthetischen Fällen. Beschreibe das Zurücksetzen der Daten, benötigte Dienste und Versionsstände. Automatisiere wichtige API- und Integrationstests und protokolliere die Ergebnisse nachvollziehbar.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"4.5","module":4,"title":"Fehlerberichte und Priorisierung","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Einen Fehler nachvollziehbar beschreiben","body":"Ein guter Bericht enthält Umgebung, Schritte, erwartetes und tatsächliches Ergebnis. Passende Belege helfen bei der Reproduktion, sollten aber keine unnötigen Geheimnisse enthalten.","example":"Ein fehlgeschlagener Export wird mit Version, Beispielschritten und bereinigter Fehlermeldung dokumentiert."},{"title":"Wirkung und Bearbeitungsreihenfolge unterscheiden","body":"Schweregrad beschreibt die Auswirkung eines Fehlers. Priorität beschreibt, wann er bearbeitet werden soll; Risiko und Nutzungssituation beeinflussen diese Entscheidung.","example":"Ein selten genutzter Prozess kann einen schweren Fehler haben. Ein kleiner Darstellungsfehler kann vor einer unmittelbar bevorstehenden Vorführung dennoch dringend sein."}],"questions":[{"id":"M04-05-Q1","module":4,"lesson_id":"4.5","lesson_title":"Fehlerberichte und Priorisierung","type":"single_choice","question":"Welche Information hilft besonders beim Nachstellen eines Fehlers?","options":["Nur „geht nicht“.","Eine genaue Schrittfolge mit Soll- und Ist-Ergebnis.","Ein beliebiger Projektname.","Eine Liste aller privaten Kontakte."],"correct_index":1,"explanation":"Reproduzierbare Schritte ermöglichen die gezielte Untersuchung.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-05-Q2","module":4,"lesson_id":"4.5","lesson_title":"Fehlerberichte und Priorisierung","type":"single_choice","question":"Was beschreibt die Priorität eines Fehlers?","options":["Ausschließlich die Zahl der Codezeilen.","Immer denselben Wert wie der Schweregrad.","Die Farbe des Tickets.","Die vereinbarte Dringlichkeit und Bearbeitungsreihenfolge."],"correct_index":3,"explanation":"Priorität berücksichtigt neben Auswirkungen auch zeitlichen und fachlichen Kontext.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-05-Q3","module":4,"lesson_id":"4.5","lesson_title":"Fehlerberichte und Priorisierung","type":"single_choice","question":"Wozu dient eine Triage?","options":["Fehler bewerten, klären und einer passenden Bearbeitung zuordnen.","Jede Fehlermeldung ungeprüft löschen.","Tests dauerhaft abschalten.","Alle Tickets automatisch als gelöst markieren."],"correct_index":0,"explanation":"Gemeinsame Einordnung unterstützt eine begründete Bearbeitungsreihenfolge.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M04-05-P1","module":4,"lesson_id":"4.5","lesson_title":"Fehlerberichte und Priorisierung","type":"practice","question":"Schreibe einen kurzen Fehlerbericht für einen Export, der bei einer leeren Ergebnisliste abstürzt.","model_answer":"Umgebung und Version nennen. Schritte: Suche ohne Treffer ausführen und Export wählen. Erwartet: eine verständliche Rückmeldung oder ein definierter leerer Export. Tatsächlich: Abbruch mit bereinigter Fehlermeldung. Reproduzierbarkeit, Auswirkungen und geeignete Belege ergänzen.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"4.6","module":4,"title":"Testergebnisse und Verbesserung","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Ergebnisse im Kontext bewerten","body":"Ein Testbericht verbindet Befunde mit Umfang, Umgebung und offenen Risiken. Eine Kennzahl kann Orientierung geben, ersetzt aber keine fachliche Bewertung.","example":"Eine hohe Anzahl erfolgreicher Tests sagt wenig über eine kritische Berechtigungsprüfung aus, wenn für sie kein Test vorhanden ist."},{"title":"Aus Ursachen lernen","body":"Ursachenanalyse betrachtet, warum ein Problem entstehen und unentdeckt bleiben konnte. Eine Verbesserungsmaßnahme wird geplant, umgesetzt und anschließend auf Wirkung geprüft.","example":"Nach einem wiederkehrenden Validierungsfehler ergänzt das Team einen gemeinsamen Validator, passende Tests und einen späteren Wirksamkeitscheck."}],"questions":[{"id":"M04-06-Q1","module":4,"lesson_id":"4.6","lesson_title":"Testergebnisse und Verbesserung","type":"single_choice","question":"Warum beweist eine hohe Codeabdeckung allein keine Fehlerfreiheit?","options":["Weil ausgeführte Zeilen noch keine vollständigen Erwartungen und Fälle garantieren.","Weil Tests keine Ergebnisse liefern dürfen.","Weil nur die Länge des Codes zählt.","Weil alle ungetesteten Funktionen automatisch korrekt sind."],"correct_index":0,"explanation":"Abdeckung zeigt Ausführung, nicht automatisch die Güte aller Prüfungen.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-06-Q2","module":4,"lesson_id":"4.6","lesson_title":"Testergebnisse und Verbesserung","type":"single_choice","question":"Was gehört zu einer nachvollziehbaren Testempfehlung?","options":["Nur ein grünes Symbol.","Der Name des Testwerkzeugs ohne Befunde.","Ergebnisse, offener Umfang und verbleibende Risiken.","Eine geheime Zugangsliste."],"correct_index":2,"explanation":"Die Entscheidung braucht den Kontext dessen, was geprüft wurde und was offen bleibt.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-06-Q3","module":4,"lesson_id":"4.6","lesson_title":"Testergebnisse und Verbesserung","type":"single_choice","question":"Wann ist eine Verbesserung überzeugend abgeschlossen?","options":["Sobald jemand eine Idee erwähnt.","Wenn ihre Wirkung anhand eines passenden Kriteriums überprüft wurde.","Sobald das Ticket anders eingefärbt ist.","Wenn sämtliche Rückmeldungen ignoriert werden."],"correct_index":1,"explanation":"Eine überprüfte Wirkung schließt den Lernkreislauf besser als eine bloße Aufgabenliste.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M04-06-P1","module":4,"lesson_id":"4.6","lesson_title":"Testergebnisse und Verbesserung","type":"practice","question":"Mehrere Fehler werden erst kurz vor der Freigabe entdeckt. Leite eine Verbesserung mit Wirksamkeitsprüfung ab.","model_answer":"Untersuche zuerst, welche frühen Prüfungen fehlen oder unzuverlässig sind. Ergänze gezielte Reviews oder automatisierte Tests für die betroffenen Risiken. Vergleiche in folgenden Auslieferungen beispielsweise den Anteil spät gefundener kritischer Fehler und bewerte den Befund im Projektkontext.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"5.1","module":5,"title":"Zielgruppen und Dokumentationsarten","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Die Leserfrage bestimmt die Erklärung","body":"Nutzende, Entwickler und Betrieb benötigen unterschiedliche Informationen. Eine hilfreiche Dokumentation beginnt mit Aufgabe, Vorwissen und Nutzungssituation.","example":"Eine Kurzanleitung erklärt das Abschließen eines Vorgangs; der Betrieb benötigt zusätzlich Hinweise zu Überwachung und Störungen."},{"title":"Lernen, Handeln, Nachschlagen und Verstehen trennen","body":"Ein Tutorial führt beim Lernen, eine Anleitung unterstützt eine konkrete Aufgabe, eine Referenz beschreibt Details und eine Erklärung vermittelt Zusammenhänge.","example":"Eine API-Feldliste ist eine Referenz. Eine geführte erste Beispielintegration ist ein Tutorial."}],"questions":[{"id":"M05-01-Q1","module":5,"lesson_id":"5.1","lesson_title":"Zielgruppen und Dokumentationsarten","type":"single_choice","question":"Was sollte die Auswahl von Tiefe und Sprache einer Dokumentation besonders bestimmen?","options":["Nur die Lieblingsfarbe der Autorin.","Zielgruppe, Vorwissen und konkrete Aufgabe.","Die maximale Dateigröße.","Immer die Anzahl aller internen Klassen."],"correct_index":1,"explanation":"Informationen werden nützlich, wenn sie zur Leseraufgabe passen.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-01-Q2","module":5,"lesson_id":"5.1","lesson_title":"Zielgruppen und Dokumentationsarten","type":"single_choice","question":"Welche Form passt zum schnellen Nachschlagen erlaubter API-Felder?","options":["Ein Projekttagebuch ohne Struktur.","Eine beliebige Werbeanzeige.","Ein persönlicher Kalender.","Eine strukturierte Referenz."],"correct_index":3,"explanation":"Eine Referenz stellt definierte Details zum gezielten Nachschlagen bereit.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-01-Q3","module":5,"lesson_id":"5.1","lesson_title":"Zielgruppen und Dokumentationsarten","type":"single_choice","question":"Was ist ein typisches Ziel eines Tutorials?","options":["Einen geführten ersten Lernerfolg ermöglichen.","Nur unbekannte Fachwörter sammeln.","Jede Rückfrage vermeiden, indem alles weggelassen wird.","Ausschließlich eine Versionsnummer anzeigen."],"correct_index":0,"explanation":"Ein Tutorial unterstützt Lernen durch einen nachvollziehbaren Ablauf.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M05-01-P1","module":5,"lesson_id":"5.1","lesson_title":"Zielgruppen und Dokumentationsarten","type":"practice","question":"Plane je ein Dokument für neue Nutzende und für den technischen Betrieb einer Termin-App.","model_answer":"Für neue Nutzende eine kurze Anleitung zu Anmeldung, Terminanlage und typischen Rückmeldungen erstellen. Für den Betrieb Aufbau, Konfiguration, Überwachung und Störungsbehandlung beschreiben. Beide Dokumente erhalten einen klaren Versionsbezug und eine verantwortliche Stelle.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"5.2","module":5,"title":"Docs-as-Code und Architekturentscheidungen","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Dokumentation wie eine Änderung pflegen","body":"Docs-as-Code verbindet versionierte Texte mit Reviews und automatisierten Prüfungen. Die Werkzeugkette hilft, benötigt aber weiterhin fachliche Verantwortung.","example":"Ein Pull Request ändert Funktion und Anleitung gemeinsam; eine Prüfung kontrolliert Links und den Bau der Dokumentation."},{"title":"Entscheidungen mit Gründen festhalten","body":"Ein ADR erklärt Kontext, Entscheidung, Alternativen und Folgen einer wesentlichen Architekturwahl. So bleibt verständlich, warum ein Team eine Lösung gewählt hat.","example":"Ein ADR nennt die Gründe für einen modularen Monolithen und beschreibt, wann die Entscheidung erneut geprüft wird."}],"questions":[{"id":"M05-02-Q1","module":5,"lesson_id":"5.2","lesson_title":"Docs-as-Code und Architekturentscheidungen","type":"single_choice","question":"Was gehört zum Docs-as-Code-Ansatz?","options":["Dokumentation nur auf einem privaten Desktop behalten.","Reviews grundsätzlich überspringen.","Dokumentation versionieren, prüfen und gemeinsam ändern.","Geheime Schlüssel in jeder Anleitung abdrucken."],"correct_index":2,"explanation":"Der Ansatz nutzt bewährte Änderungs- und Prüfabläufe auch für Texte.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-02-Q2","module":5,"lesson_id":"5.2","lesson_title":"Docs-as-Code und Architekturentscheidungen","type":"single_choice","question":"Welche Frage beantwortet ein guter ADR besonders?","options":["Welche Tastatur wird verwendet?","Warum wurde diese Architekturentscheidung im gegebenen Kontext getroffen?","Wie viele E-Mails gibt es im Postfach?","Wer hat die längste Datei geschrieben?"],"correct_index":1,"explanation":"Der Entscheidungsgrund ist für spätere Änderungen oft wichtiger als nur das Ergebnis.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-02-Q3","module":5,"lesson_id":"5.2","lesson_title":"Docs-as-Code und Architekturentscheidungen","type":"single_choice","question":"Wann sollte eine relevante Dokumentationsänderung geprüft werden?","options":["Erst nach dem Löschen der Anwendung.","Nur wenn der Dateiname lang ist.","Nie, weil Texte keine Fehler enthalten.","Im passenden Änderungsprozess zusammen mit der betroffenen Funktion."],"correct_index":3,"explanation":"Gemeinsame Prüfung reduziert veraltete oder widersprüchliche Beschreibungen.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M05-02-P1","module":5,"lesson_id":"5.2","lesson_title":"Docs-as-Code und Architekturentscheidungen","type":"practice","question":"Skizziere einen ADR zur Entscheidung für eine gemeinsam ausgelieferte Web-Anwendung.","model_answer":"Kontext: kleines Team und überschaubare Last. Entscheidung: zunächst eine gemeinsam ausgelieferte, klar gegliederte Anwendung. Alternativen: getrennte Dienste. Gründe und Nachteile benennen; etwa einfacherer Betrieb bei gemeinsamer Auslieferung. Einen Prüfanlass für spätere Änderungen festhalten.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"5.3","module":5,"title":"Code-, API- und Prozessdokumentation","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Erklären, was nicht offensichtlich ist","body":"Code-Dokumentation beschreibt Absicht, Verträge und überraschende Randbedingungen. Kommentare, die sichtbaren Code nur wiederholen, liefern wenig zusätzlichen Nutzen.","example":"Ein Kommentar erklärt, weshalb ein Rundungsverfahren verwendet wird, statt nur „Betrag runden“ zu wiederholen."},{"title":"Schnittstellen und Abläufe überprüfbar beschreiben","body":"Eine API-Beschreibung umfasst Daten, Verhalten und Fehler. Eine Prozessbeschreibung klärt Schritte, Rollen und Übergaben. Beide brauchen einen Bezug zur tatsächlichen Umsetzung.","example":"Ein Freigabeprozess nennt die zuständige Rolle und den Umgang mit Ablehnungen; die API beschreibt dazu die erlaubten Eingaben und Antworten."}],"questions":[{"id":"M05-03-Q1","module":5,"lesson_id":"5.3","lesson_title":"Code-, API- und Prozessdokumentation","type":"single_choice","question":"Welcher Kommentar liefert typischerweise zusätzlichen Nutzen?","options":["Er erklärt eine nicht offensichtliche fachliche Entscheidung.","Er kopiert nur den Namen der nächsten Variablen.","Er enthält ein geheimes Passwort.","Er widerspricht absichtlich dem Code."],"correct_index":0,"explanation":"Ein guter Kommentar macht Absicht oder besondere Bedingungen verständlich.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-03-Q2","module":5,"lesson_id":"5.3","lesson_title":"Code-, API- und Prozessdokumentation","type":"single_choice","question":"Welche Information gehört in eine API-Beschreibung?","options":["Nur das Teamlogo.","Ausschließlich eine Bildschirmfarbe.","Eingaben, Antworten und relevante Fehlerfälle.","Die private Urlaubsplanung."],"correct_index":2,"explanation":"Clients benötigen einen vollständigen, nachvollziehbaren Vertrag.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-03-Q3","module":5,"lesson_id":"5.3","lesson_title":"Code-, API- und Prozessdokumentation","type":"single_choice","question":"Was macht eine Prozessbeschreibung besonders hilfreich?","options":["Die Arbeitsschritte werden ohne Zusammenhang vermischt.","Rollen, Schritte und Übergaben sind nachvollziehbar.","Zuständigkeiten bleiben absichtlich unbekannt.","Jeder Ablauf wird nur als Bild ohne Erklärung abgelegt."],"correct_index":1,"explanation":"Die Beschreibung soll Zusammenarbeit und Verantwortlichkeiten erklären.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M05-03-P1","module":5,"lesson_id":"5.3","lesson_title":"Code-, API- und Prozessdokumentation","type":"practice","question":"Beschreibe die Dokumentation für einen Endpunkt, der eine Reservierung anlegt.","model_answer":"Methode und Adresse, erforderliche Felder, Bedingungen und Beispielanfrage nennen. Erfolgsantwort sowie ungültige Eingaben und fachliche Konflikte beschreiben. Berechtigungen, Versionsbezug und ein überprüfbares Beispiel ergänzen, ohne Geheimnisse zu veröffentlichen.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"5.4","module":5,"title":"Verständliche Anwenderanleitungen","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Vom Nutzerziel zum Handlungsschritt","body":"Eine Anleitung beschreibt, was eine Person erreichen möchte und welche Voraussetzungen gelten. Kurze eindeutige Schritte sind leichter anwendbar als lange Listen interner Details.","example":"Die Anleitung „Termin verschieben“ beginnt bei einem vorhandenen Termin und endet bei einer sichtbaren Bestätigung."},{"title":"Ergebnisse und Fehlerwege sichtbar machen","body":"Nach wichtigen Schritten soll erkennbar sein, was passieren müsste. Häufige Fehlermeldungen brauchen verständliche Ursachen und passende nächste Handlungen.","example":"Bei einer bereits vergebenen Uhrzeit erklärt die Anleitung, wie eine freie Alternative gewählt werden kann."}],"questions":[{"id":"M05-04-Q1","module":5,"lesson_id":"5.4","lesson_title":"Verständliche Anwenderanleitungen","type":"single_choice","question":"Welche Formulierung eignet sich für einen konkreten Handlungsschritt?","options":["Benutzerfreundlichkeit ist ein komplexes Thema.","Eventuell sollte irgendetwas passieren.","Der Prozess kann vielleicht konfiguriert werden.","Wähle den Termin und tippe auf „Verschieben“."],"correct_index":3,"explanation":"Die Formulierung benennt eine beobachtbare, konkrete Handlung.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-04-Q2","module":5,"lesson_id":"5.4","lesson_title":"Verständliche Anwenderanleitungen","type":"single_choice","question":"Was sollte eine Anleitung neben den Schritten erklären?","options":["Voraussetzungen und das erwartete Ergebnis.","Nur den Geburtstag des Entwicklungsteams.","Sämtliche internen Datenbanktabellen.","Eine zufällige Auswahl fremder Funktionen."],"correct_index":0,"explanation":"Voraussetzungen und Ergebnis helfen, den Ablauf richtig einzuordnen.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-04-Q3","module":5,"lesson_id":"5.4","lesson_title":"Verständliche Anwenderanleitungen","type":"single_choice","question":"Was ist bei einem Screenshot besonders sinnvoll?","options":["Unlesbare Details und geheime Daten zeigen.","Eine passende Ansicht mit erforderlicher Erklärung und Versionsbezug verwenden.","Immer den gesamten Desktop mit privaten Nachrichten zeigen.","Den Screenshot unabhängig von Änderungen nie prüfen."],"correct_index":1,"explanation":"Bilder ergänzen eine Anleitung nur, wenn sie zum beschriebenen Zustand passen.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M05-04-P1","module":5,"lesson_id":"5.4","lesson_title":"Verständliche Anwenderanleitungen","type":"practice","question":"Schreibe eine kurze Anleitung zum Verschieben eines Termins mit einem möglichen Fehlerfall.","model_answer":"Voraussetzung: angemeldet sein und einen bearbeitbaren Termin besitzen. Termin öffnen, Verschieben wählen, neue Zeit eintragen und bestätigen. Die neue Zeit muss anschließend sichtbar sein. Ist die Zeit vergeben, eine andere freie Zeit auswählen oder den Vorgang abbrechen.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"5.5","module":5,"title":"Schulung und lebendige Wissenssammlung","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Lernen aktiv gestalten","body":"Schulungsunterlagen unterstützen ein Lernziel und eine Aufgabe. Eine eigene Übung mit Rückmeldung macht eher sichtbar, ob der Ablauf verstanden wurde.","example":"Neue Mitarbeitende legen einen Testvorgang an und erklären anschließend einen typischen Fehlerfall."},{"title":"Wissen braucht Pflege","body":"Eine Wissenssammlung benötigt auffindbare Einträge, Verantwortliche und Prüfanlässe. Veraltete oder doppelte Seiten können ebenso schaden wie fehlende Informationen.","example":"Ein Eintrag zur Störungsbehandlung wird einer verantwortlichen Person zugeordnet und nach relevanten Systemänderungen erneut geprüft."}],"questions":[{"id":"M05-05-Q1","module":5,"lesson_id":"5.5","lesson_title":"Schulung und lebendige Wissenssammlung","type":"single_choice","question":"Welche Schulungsaktivität unterstützt das Überprüfen des Verständnisses?","options":["Nur Folien im Hintergrund laufen lassen.","Aufgaben ohne Ziel verteilen.","Einen Ablauf selbst durchführen und das Ergebnis besprechen.","Fragen grundsätzlich verbieten."],"correct_index":2,"explanation":"Aktive Anwendung und Rückmeldung zeigen praktische Lücken.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-05-Q2","module":5,"lesson_id":"5.5","lesson_title":"Schulung und lebendige Wissenssammlung","type":"single_choice","question":"Was hilft gegen eine veraltete Wissenssammlung?","options":["Einträge ohne Zuständigkeit immer weiter kopieren.","Verantwortliche und regelmäßige oder ereignisbezogene Prüfung festlegen.","Alle Links ungeprüft dauerhaft übernehmen.","Informationen ausschließlich in privaten Chats behalten."],"correct_index":1,"explanation":"Pflege benötigt klare Verantwortung und erkennbare Auslöser.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-05-Q3","module":5,"lesson_id":"5.5","lesson_title":"Schulung und lebendige Wissenssammlung","type":"single_choice","question":"Worin unterscheiden sich Unterlagen für Endnutzende und Multiplikatoren oft?","options":["Sie müssen immer vollständig identisch sein.","Endnutzende benötigen sämtliche Trainerhinweise.","Multiplikatoren dürfen keine Beispiele sehen.","Multiplikatoren benötigen zusätzlich Hinweise zum Erklären und Begleiten von Übungen."],"correct_index":3,"explanation":"Die Rolle bestimmt, ob neben der Bedienung auch die Vermittlung unterstützt werden soll.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M05-05-P1","module":5,"lesson_id":"5.5","lesson_title":"Schulung und lebendige Wissenssammlung","type":"practice","question":"Plane eine zehnminütige Schulungsübung und die Pflege des zugehörigen Wissenseintrags.","model_answer":"Ein klares Ziel setzen, etwa einen Termin korrekt verschieben. Kurz vorführen, selbst durchführen lassen und einen Fehlerfall besprechen. Den Wissenseintrag mit Voraussetzungen, Schritten und Verantwortlichkeit versehen; nach einer Änderung des Ablaufs erneut prüfen.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"5.6","module":5,"title":"Review, Versionierung und Bereitstellung","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Die Anleitung an der Anwendung prüfen","body":"Ein Review untersucht fachliche Richtigkeit, Verständlichkeit und Vollständigkeit. Besonders aussagekräftig ist es, wenn eine passende Person den Ablauf tatsächlich anhand der Anleitung ausführt.","example":"Eine neue Kollegin folgt der Kurzanleitung und markiert fehlende Voraussetzungen oder unklare Begriffe."},{"title":"Dokumentation passend ausliefern","body":"Eine Dokumentation braucht einen erkennbaren Versionsbezug und einen geeigneten Ablageort. Automatisierte Prüfungen können Links und Beispiele prüfen, ersetzen aber kein Verständnis der Leseraufgabe.","example":"Mit einer neuen API-Version wird die passende Referenz veröffentlicht; ältere Versionen bleiben eindeutig gekennzeichnet."}],"questions":[{"id":"M05-06-Q1","module":5,"lesson_id":"5.6","lesson_title":"Review, Versionierung und Bereitstellung","type":"single_choice","question":"Welche Prüfung bewertet eine Anleitung besonders praxisnah?","options":["Eine passende Person führt die beschriebene Aufgabe damit aus.","Nur die Wortanzahl wird maximiert.","Alle Rückmeldungen werden gelöscht.","Der Text wird ausschließlich nach Dateigröße sortiert."],"correct_index":0,"explanation":"Die tatsächliche Nutzung zeigt Lücken, die beim reinen Lesen leicht übersehen werden.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-06-Q2","module":5,"lesson_id":"5.6","lesson_title":"Review, Versionierung und Bereitstellung","type":"single_choice","question":"Warum ist ein Versionsbezug wichtig?","options":["Er ersetzt jede fachliche Erklärung.","Er schützt automatisch alle Konten.","Er zeigt, zu welchem Anwendungsstand die Beschreibung gehört.","Er macht jede spätere Prüfung unnötig."],"correct_index":2,"explanation":"Die Zuordnung verhindert, dass unterschiedliche Softwarestände verwechselt werden.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-06-Q3","module":5,"lesson_id":"5.6","lesson_title":"Review, Versionierung und Bereitstellung","type":"single_choice","question":"Welche automatisierte Dokumentationsprüfung ist sinnvoll?","options":["Geheime Zugangsdaten in den Bericht schreiben.","Links und ausführbare Beispiele auf erwartetes Verhalten prüfen.","Alle Absätze zufällig vertauschen.","Jede fehlende Seite als Erfolg werten."],"correct_index":1,"explanation":"Automatische Prüfungen können konkrete technische Fehler zuverlässig sichtbar machen.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M05-06-P1","module":5,"lesson_id":"5.6","lesson_title":"Review, Versionierung und Bereitstellung","type":"practice","question":"Eine neue Version verändert den Anmeldeablauf. Plane die Aktualisierung der Dokumentation.","model_answer":"Betroffene Anleitungen, Referenzen und Schulungsunterlagen identifizieren. Schritte und Bilder anpassen und durch eine passende Person prüfen lassen. Den Versionsbezug aktualisieren, Links und Beispiele prüfen und die Dokumentation gemeinsam mit der neuen Anwendung bereitstellen.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"6.1","module":6,"title":"Abnahmekriterien und Prüfplanung","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Vom Wunsch zum Nachweis","body":"Eine Abnahmeplanung verbindet vereinbarten Leistungsumfang, messbare Kriterien, Testfälle und entscheidungsbefugte Personen. Ein erfolgreicher interner Test allein ist noch keine dokumentierte Abnahmeentscheidung.","example":"Für ein Serviceportal wird vorab festgelegt, wer eine Terminbuchung unter welchen Bedingungen prüft und welches Ergebnis erwartet wird."},{"title":"Prüfung nachvollziehbar vorbereiten","body":"Lege Version, Testumgebung, benötigte Daten und einen Termin fest. Verknüpfe jedes Kriterium mit einem Nachweis; offene Annahmen müssen vor der Entscheidung sichtbar sein.","example":"Ein Protokoll nennt den geprüften Softwarestand und verweist auf einen Testlauf mit anonymen Beispieldaten."}],"questions":[{"id":"public-M06-01-Q1","module":6,"lesson_id":"6.1","lesson_title":"Abnahmekriterien und Prüfplanung","type":"single_choice","question":"Was macht ein Abnahmekriterium prüfbar?","options":["Eine beobachtbare Bedingung mit eindeutigem erwarteten Ergebnis.","Ein möglichst allgemeiner Wunsch nach guter Bedienbarkeit.","Ein Produktname ohne beschriebenen Anwendungsfall.","Eine Zustimmung des Entwicklungsteams ohne Prüfung."],"correct_index":0,"explanation":"Prüfende müssen feststellen können, ob die vereinbarte Bedingung erfüllt ist.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M06-01-Q2","module":6,"lesson_id":"6.1","lesson_title":"Abnahmekriterien und Prüfplanung","type":"single_choice","question":"Welche Angabe verbindet einen Testnachweis mit der ausgelieferten Fassung?","options":["Die Zahl der Projektbesprechungen.","Die Reihenfolge der Folien im Kick-off.","Die persönliche Einschätzung eines unbeteiligten Teams.","Die eindeutig identifizierte Softwareversion."],"correct_index":3,"explanation":"Ohne Versionsbezug kann ein Ergebnis zu einer anderen Fassung gehören.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M06-01-Q3","module":6,"lesson_id":"6.1","lesson_title":"Abnahmekriterien und Prüfplanung","type":"single_choice","question":"Wer sollte vor dem Abnahmetermin geklärt sein?","options":["Ausschließlich der Anbieter der Entwicklungsumgebung.","Alle Personen mit einem beliebigen Benutzerkonto.","Die für Prüfung und Entscheidung zuständigen Beteiligten.","Nur die Person, die den Quellcode zuerst geschrieben hat."],"correct_index":2,"explanation":"Prüfaufgaben und die Befugnis zur Entscheidung sind unterschiedliche Verantwortungen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M06-01-P1","module":6,"lesson_id":"6.1","lesson_title":"Abnahmekriterien und Prüfplanung","type":"practice","question":"Formuliere zwei Abnahmekriterien für die Terminbuchung eines Serviceportals und nenne je einen Nachweis.","model_answer":"Eine berechtigte Person kann einen freien Termin buchen; Nachweis ist ein dokumentierter Test mit anschließend sichtbarer Bestätigung. Eine zweite Buchung desselben exklusiven Termins wird verhindert; Nachweis ist ein kontrollierter Parallelitätstest. Softwarestand, Testdaten und zuständige Prüfer werden im Protokoll festgehalten.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]},{"id":"6.2","module":6,"title":"Mängel, Protokoll und Abnahmeentscheidung","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Befund und Entscheidung trennen","body":"Ein Befund beschreibt beobachtetes und erwartetes Verhalten sowie die Auswirkung. Die Abnahmeentscheidung berücksichtigt Vereinbarung und anwendbaren Vertrag; technische Fehlerklassen sind dafür eine Hilfe, kein Ersatz.","example":"Ein nicht lesbarer Export und eine abweichende Überschrift werden jeweils mit reproduzierbarem Beispiel und fachlicher Auswirkung erfasst."},{"title":"Rechtlichen Rahmen beachten","body":"Bei einem Werkvertrag regelt § 640 BGB die Abnahme. Unwesentliche Mängel erlauben allein keine Verweigerung. Bei bekannten Mängeln ist ein Vorbehalt für bestimmte Mängelrechte relevant; eine pauschale Aussage zu jedem Softwarevertrag wäre falsch.","example":"Das Team dokumentiert einen bekannten Mangel und lässt Entscheidung und erforderliche Vorbehalte durch die zuständigen Beteiligten klären."}],"questions":[{"id":"public-M06-02-Q1","module":6,"lesson_id":"6.2","lesson_title":"Mängel, Protokoll und Abnahmeentscheidung","type":"single_choice","question":"Was beschreibt einen Mangel nachvollziehbar?","options":["Nur die Vermutung, dass eine bestimmte Person schuld ist.","Eine Fehlernummer ohne Beschreibung oder Bezug.","Eine Priorität, die jeden weiteren Nachweis ersetzt.","Abweichung, Reproduktionsschritte und fachliche Auswirkung."],"correct_index":3,"explanation":"Sachliche Angaben ermöglichen Bewertung und Nachprüfung.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M06-02-Q2","module":6,"lesson_id":"6.2","lesson_title":"Mängel, Protokoll und Abnahmeentscheidung","type":"single_choice","question":"Welche Aussage passt zu § 640 BGB bei einem Werkvertrag?","options":["Jede Nutzung ersetzt ausnahmslos sämtliche Abnahmevereinbarungen.","Ein Testbericht beseitigt automatisch alle Mängelrechte.","Ein unwesentlicher Mangel allein rechtfertigt keine Abnahmeverweigerung.","Jeder optische Fehler verhindert zwingend jede Abnahme."],"correct_index":2,"explanation":"Wesentlichkeit und Vertragsrahmen müssen berücksichtigt werden.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M06-02-Q3","module":6,"lesson_id":"6.2","lesson_title":"Mängel, Protokoll und Abnahmeentscheidung","type":"single_choice","question":"Was sollte mit einem vereinbarten Nachbesserungspunkt geschehen?","options":["Die Entscheidung ausschließlich einer automatischen Farbcodierung überlassen.","Verantwortliche, Termin und Art der Nachprüfung festhalten.","Ihn nach dem Termin ohne Rückmeldung aus der Liste entfernen.","Nur die Anzahl offener Punkte statt ihres Inhalts speichern."],"correct_index":1,"explanation":"Ein Befund braucht einen überprüfbaren weiteren Bearbeitungsweg.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M06-02-P1","module":6,"lesson_id":"6.2","lesson_title":"Mängel, Protokoll und Abnahmeentscheidung","type":"practice","question":"Bei einer Abnahme funktioniert die Buchung, der PDF-Export enthält jedoch falsche Summen. Skizziere das weitere Vorgehen.","model_answer":"Befund mit Beispiel, Soll-Ergebnis und Auswirkung dokumentieren. Bedeutung für den vereinbarten Zweck und den Vertragsrahmen bewerten lassen. Entscheidung und gegebenenfalls erforderliche Vorbehalte im Protokoll festhalten. Zuständigkeit, Nachbesserungstermin und einen Test mit korrekter Summenberechnung vereinbaren.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"BGB § 640 · Abnahme","url":"https://www.gesetze-im-internet.de/bgb/__640.html"}]},{"id":"6.3","module":6,"title":"Release-Paket und Übergabe an den Betrieb","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Eine nutzbare Lieferung übergeben","body":"Zur Übergabe gehören identifizierbare Artefakte, passende Konfiguration, Installationsschritte, Dokumentation und bekannte Einschränkungen. Der Empfänger muss den vorgesehenen Betrieb nachvollziehen können.","example":"Das Paket enthält Version, Prüfsumme, Installationsanleitung und einen Verweis auf die passende Betriebsdokumentation."},{"title":"Betriebsverantwortung übernehmen","body":"Kläre Supportwege, Überwachung, Wiederherstellung und die Übergabe offener Punkte. Zugangsdaten werden über einen geeigneten geschützten Kanal mit begrenzten Berechtigungen übergeben, anschließend gegebenenfalls erneuert.","example":"Der Betrieb bestätigt einen Wiederherstellungstest und kennt Kontaktpersonen; geheime Schlüssel stehen weder im Ticket noch in der Anleitung."}],"questions":[{"id":"public-M06-03-Q1","module":6,"lesson_id":"6.3","lesson_title":"Release-Paket und Übergabe an den Betrieb","type":"single_choice","question":"Was hilft, die Vollständigkeit eines Übergabepakets zu prüfen?","options":["Die Annahme, dass der Empfänger alle Entwicklungsdetails kennt.","Ein Screenshot der letzten Teamkonferenz.","Eine auf Empfänger und Betrieb abgestimmte Checkliste.","Eine Quellcode-Datei ohne weitere Beschreibung."],"correct_index":2,"explanation":"Eine Checkliste macht notwendige Bestandteile und Zuständigkeiten sichtbar.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M06-03-Q2","module":6,"lesson_id":"6.3","lesson_title":"Release-Paket und Übergabe an den Betrieb","type":"single_choice","question":"Wie sollten produktive Zugangsdaten übergeben werden?","options":["Als identisches Passwort für sämtliche beteiligten Personen.","Über einen geschützten, berechtigten und nachvollziehbaren Weg.","Gemeinsam mit allen Release Notes im öffentlichen Download.","Als Kommentar im allgemein sichtbaren Quellcode."],"correct_index":1,"explanation":"Geheimnisse brauchen geeignete Zugriffsbeschränkungen und klare Verantwortlichkeit.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M06-03-Q3","module":6,"lesson_id":"6.3","lesson_title":"Release-Paket und Übergabe an den Betrieb","type":"single_choice","question":"Was gehört zur Support-Transition?","options":["Kontaktwege, Zuständigkeiten und bekannte offene Punkte abstimmen.","Den Betrieb erst nach der ersten Störung informieren.","Alle Entwicklungsprotokolle ungeprüft als Handbuch übergeben.","Den Support ausschließlich über private Telefonnummern organisieren."],"correct_index":0,"explanation":"Eine geordnete Übergabe ermöglicht Bearbeitung und Eskalation nach dem Start.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M06-03-P1","module":6,"lesson_id":"6.3","lesson_title":"Release-Paket und Übergabe an den Betrieb","type":"practice","question":"Erstelle eine kurze Übergabe-Checkliste für den Betrieb des Serviceportals.","model_answer":"Version und Lieferbestandteile prüfen; Installation und Konfiguration nachvollziehen; Dokumentation und bekannte Einschränkungen übergeben. Überwachung, Backup und Wiederherstellung erproben. Zugänge geschützt mit minimalen Rechten übergeben. Supportkontakte, Eskalation und offene Aufgaben mit Verantwortlichen bestätigen.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]},{"id":"6.4","module":6,"title":"Roll-out-Strategien und Veränderung begleiten","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Die Umstellung passend aufteilen","body":"Big Bang stellt den betrachteten Bereich gleichzeitig um; Pilot und stufenweiser Roll-out begrenzen zunächst den Umfang. Parallelbetrieb ermöglicht Vergleiche, verursacht jedoch zusätzlichen Abstimmungs- und Datenaufwand.","example":"Ein Team startet das Serviceportal in einer kleinen, repräsentativen Niederlassung und wertet Erfahrungen vor weiteren Standorten aus."},{"title":"Menschen und Abhängigkeiten einplanen","body":"Eine Einführung verändert Arbeitsabläufe. Informiere Zielgruppen früh, kläre Datenmigration und angrenzende Systeme und organisiere erreichbare Unterstützung während der Umstellung.","example":"Vor dem Start erhalten Servicekräfte einen konkreten Ablaufplan und wissen, wie sie eine nicht übernommene Buchung melden."}],"questions":[{"id":"public-M06-04-Q1","module":6,"lesson_id":"6.4","lesson_title":"Roll-out-Strategien und Veränderung begleiten","type":"single_choice","question":"Welche Strategie ermöglicht frühes Lernen mit begrenzter Nutzergruppe?","options":["Ein dauerhafter Parallelbetrieb ohne Datenabgleich.","Ein Pilot mit klaren Erfolgskriterien.","Eine gleichzeitige Umstellung aller Standorte ohne Rückmeldung.","Ein ungeplanter Wechsel bei der nächsten Störung."],"correct_index":1,"explanation":"Ein Pilot begrenzt Auswirkungen und liefert Erfahrungen für die weitere Einführung.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M06-04-Q2","module":6,"lesson_id":"6.4","lesson_title":"Roll-out-Strategien und Veränderung begleiten","type":"single_choice","question":"Welche zusätzliche Aufgabe entsteht häufig im Parallelbetrieb?","options":["Daten und Arbeitsabläufe zwischen beiden Systemen abstimmen.","Sämtliche Schnittstellentests können entfallen.","Alle Nutzer benötigen automatisch keine Schulung mehr.","Es gibt grundsätzlich keine doppelten Bearbeitungen."],"correct_index":0,"explanation":"Zwei gleichzeitig genutzte Systeme können widersprüchliche Bestände und Doppelarbeit erzeugen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M06-04-Q3","module":6,"lesson_id":"6.4","lesson_title":"Roll-out-Strategien und Veränderung begleiten","type":"single_choice","question":"Was unterstützt die Akzeptanz einer Einführung?","options":["Änderungen erst nach dem Abschalten des Altsystems erklären.","Rückmeldungen bis zum Projektende zurückhalten.","Den Informationsbedarf allein aus der Zahl der Server ableiten.","Aufgabenbezogene Information und erreichbare Unterstützung."],"correct_index":3,"explanation":"Betroffene müssen verstehen, was sich für ihre Arbeit ändert und wo Hilfe verfügbar ist.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M06-04-P1","module":6,"lesson_id":"6.4","lesson_title":"Roll-out-Strategien und Veränderung begleiten","type":"practice","question":"Empfiehl einen Roll-out für ein Portal mit fünf Niederlassungen und begründe zwei Vorbereitungen.","model_answer":"Mit einer repräsentativen Niederlassung beginnen und anhand vereinbarter Kriterien auswerten, danach in Stufen erweitern. Datenübernahme und angeschlossene Systeme vorher testen, damit Vorgänge konsistent bleiben. Schulung und Support für jede Umstellungsgruppe organisieren, damit Fragen und Fehler zeitnah bearbeitet werden.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]},{"id":"6.5","module":6,"title":"Go/No-Go, Rückfallplan und Startkontrolle","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Eine bewusste Startentscheidung treffen","body":"Go/No-Go-Kriterien werden vor dem Termin festgelegt. Dazu können erfolgreiche Migrationstests, betriebsbereiter Support und akzeptierte Restrisiken gehören. Ein Startdatum allein beweist keine Bereitschaft.","example":"Die Einführung beginnt nur, wenn eine Wiederherstellung erprobt wurde und keine ungelöste kritische Buchungsstörung vorliegt."},{"title":"Den Rückweg und die Beobachtung planen","body":"Ein Rückfallplan nennt Auslöser, Entscheidung und Schritte für Anwendung und Daten. Überwache nach dem Start fachliche Fehler und technische Signale; eine alte Programmversion allein stellt geänderte Daten nicht zurück.","example":"Bei einer erhöhten Fehlerquote prüft das Team die festgelegte Abbruchschwelle und verhindert, dass neu erfasste Aufträge verloren gehen."}],"questions":[{"id":"public-M06-05-Q1","module":6,"lesson_id":"6.5","lesson_title":"Go/No-Go, Rückfallplan und Startkontrolle","type":"single_choice","question":"Wann werden sinnvolle Go/No-Go-Kriterien vereinbart?","options":["Vor der Entscheidung und anhand überprüfbarer Voraussetzungen.","Erst nachdem alle produktiven Daten gelöscht wurden.","Ausschließlich nach der Stimmung im letzten Meeting.","Nur wenn der Release bereits fehlgeschlagen ist."],"correct_index":0,"explanation":"Vorab vereinbarte Kriterien verhindern nachträgliche beliebige Bewertungen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M06-05-Q2","module":6,"lesson_id":"6.5","lesson_title":"Go/No-Go, Rückfallplan und Startkontrolle","type":"single_choice","question":"Was ist bei einem Rollback mit Datenänderungen besonders wichtig?","options":["Nur das alte Anwendungslogo wiederherstellen.","Davon ausgehen, dass jede Schemaänderung automatisch umkehrbar ist.","Protokolle vor der Rückkehr zum alten Stand entfernen.","Kompatibilität und Behandlung bereits geänderter Daten prüfen."],"correct_index":3,"explanation":"Anwendungsstand und Daten müssen auch nach einer Rückkehr zusammenpassen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M06-05-Q3","module":6,"lesson_id":"6.5","lesson_title":"Go/No-Go, Rückfallplan und Startkontrolle","type":"single_choice","question":"Welches Signal passt zur Startkontrolle eines Buchungsportals?","options":["Länge des Release-Namens ohne Bezug zum Betrieb.","Zahl der gelesenen Schulungsfolien allein.","Anteil fehlgeschlagener Buchungen mit einem vereinbarten Schwellenwert.","Anzahl der Glückwünsche im Teamchat."],"correct_index":2,"explanation":"Fachliche Fehlerraten zeigen, ob die wesentliche Nutzung tatsächlich funktioniert.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M06-05-P1","module":6,"lesson_id":"6.5","lesson_title":"Go/No-Go, Rückfallplan und Startkontrolle","type":"practice","question":"Formuliere einen kurzen Rückfallplan für einen fehlerhaften Portalstart.","model_answer":"Auslöser wie eine anhaltend überschrittene Buchungsfehlerquote festlegen. Eine entscheidungsbefugte Person benennen und Nutzer informieren. Neue Schreibvorgänge kontrollieren, Datenänderungen sichern und einen vorher getesteten kompatiblen Stand herstellen. Anschließend Konsistenz und Kernabläufe prüfen und die Entscheidung dokumentieren.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[]},{"id":"6.6","module":6,"title":"Qualifizierung und Wirksamkeit der Einführung","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Ein Lernziel in Handlungen übersetzen","body":"Schulungsbedarf entsteht aus Aufgaben, Vorkenntnissen und der Veränderung. Wähle Übung, Format und Unterstützung so, dass die Zielgruppe die benötigte Handlung selbst ausführen kann.","example":"Eine Disponentin übt eine Umbuchung mit einem Konfliktfall, statt nur eine Funktionsliste anzusehen."},{"title":"Mehr als Zufriedenheit messen","body":"Kirkpatrick unterscheidet Reaktion, Lernen, Verhalten und Ergebnisse. Ein positiver Rückmeldebogen belegt weder sichere Anwendung im Alltag noch betriebliche Wirkung. Plane passende Beobachtungen bereits mit dem Lernziel.","example":"Nach einer Übung wird die korrekte Bearbeitung geprüft; später untersucht das Team die tatsächliche Anwendung und Entwicklung von Nacharbeiten."}],"questions":[{"id":"public-M06-06-Q1","module":6,"lesson_id":"6.6","lesson_title":"Qualifizierung und Wirksamkeit der Einführung","type":"single_choice","question":"Was ist ein überprüfbares Schulungsziel?","options":["Teilnehmende haben eine beliebige Präsentation geöffnet.","Das Team hat möglichst viele Fachbegriffe vorgelesen.","Die Schulung dauerte genau so lange wie der Videofilm.","Teilnehmende können eine Umbuchung samt Konfliktfall korrekt bearbeiten."],"correct_index":3,"explanation":"Ein Lernziel beschreibt eine beobachtbare Fähigkeit.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M06-06-Q2","module":6,"lesson_id":"6.6","lesson_title":"Qualifizierung und Wirksamkeit der Einführung","type":"single_choice","question":"Welche Kirkpatrick-Perspektive untersucht Anwendung im Arbeitsalltag?","options":["Nur der unmittelbare Wissenstest.","Anzahl der vorhandenen Schulungsräume.","Verhalten.","Reaktion."],"correct_index":2,"explanation":"Diese Perspektive betrachtet den Transfer in die tatsächliche Arbeit.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M06-06-Q3","module":6,"lesson_id":"6.6","lesson_title":"Qualifizierung und Wirksamkeit der Einführung","type":"single_choice","question":"Welche Schlussfolgerung erlaubt hohe Schulungszufriedenheit allein?","options":["Der betriebliche Nutzen ist damit vollständig bewiesen.","Die Reaktion war positiv; weitere Wirkungen müssen gesondert geprüft werden.","Alle Arbeitsfehler sind nachweislich beseitigt.","Jede Person wendet den Ablauf dauerhaft richtig an."],"correct_index":1,"explanation":"Reaktion, Können, Anwendung und Wirkung sind verschiedene Beobachtungen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M06-06-P1","module":6,"lesson_id":"6.6","lesson_title":"Qualifizierung und Wirksamkeit der Einführung","type":"practice","question":"Plane eine kurze Qualifizierung für den Support und zwei passende Erfolgskontrollen.","model_answer":"Ein konkretes Ziel wählen, etwa eine fehlerhafte Buchung sicher einordnen und weiterleiten. Einen typischen Fall vormachen und selbst bearbeiten lassen. Direkt die korrekte Fallbearbeitung prüfen; später den Transfer anhand realer, geeignet geschützter Supportfälle beobachten. Unterstützung und Nachschulung aus erkannten Lücken ableiten.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}],"references":[{"title":"Kirkpatrick · Evaluationsmodell","url":"https://www.kirkpatrickpartners.com/the-kirkpatrick-model/"}]},{"id":"7.1","module":7,"title":"Ist-Zustand, Kennzahlen und PDCA","trainingMinutes":6,"trainingSection":true,"concepts":[{"title":"Mit einer klaren Frage beginnen","body":"Evaluation vergleicht beobachtete Ergebnisse mit einem Zweck. Lege Messgröße, Zeitraum und Ausgangswert fest. Eine Zahl ohne Kontext sagt noch nicht, ob eine Veränderung nützlich ist.","example":"Das Team misst die Zeit vom angenommenen Supportfall bis zur Lösung und beschreibt, welche Fälle in die Auswertung eingehen."},{"title":"Verbesserung als überprüfbaren Versuch führen","body":"PDCA verbindet Planen, Erproben, Prüfen und Anpassen. Definiere eine Hypothese und überprüfe neben der gewünschten Wirkung auch unerwünschte Nebenwirkungen.","example":"Ein fester Termin für Falltriage soll Wartezeiten senken; zugleich wird geprüft, ob mehr Fälle wieder geöffnet werden."}],"questions":[{"id":"public-M07-01-Q1","module":7,"lesson_id":"7.1","lesson_title":"Ist-Zustand, Kennzahlen und PDCA","type":"single_choice","question":"Was braucht ein aussagekräftiger Vorher-Nachher-Vergleich?","options":["Nur zwei Screenshots mit unterschiedlichen Farben.","Für jeden Zeitraum eine neue Definition derselben Kennzahl.","Ausschließlich den besten Einzelfall aus jedem Monat.","Vergleichbare Definitionen, Zeiträume und einen Ausgangswert."],"correct_index":3,"explanation":"Vergleichbarkeit verhindert, dass veränderte Messung mit Verbesserung verwechselt wird.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M07-01-Q2","module":7,"lesson_id":"7.1","lesson_title":"Ist-Zustand, Kennzahlen und PDCA","type":"single_choice","question":"Was gehört bei PDCA zur Prüfphase?","options":["Alle offenen Fragen erst nach Jahren dokumentieren.","Nur weitere Aufgaben planen, ohne Ergebnisse anzusehen.","Die beobachtete Wirkung mit der geplanten Erwartung vergleichen.","Eine Maßnahme ohne Daten dauerhaft festschreiben."],"correct_index":2,"explanation":"Check bewertet, was der Versuch unter den festgelegten Bedingungen bewirkt hat.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"public-M07-01-Q3","module":7,"lesson_id":"7.1","lesson_title":"Ist-Zustand, Kennzahlen und PDCA","type":"single_choice","question":"Warum wird neben Durchlaufzeit auch Nacharbeit beobachtet?","options":["Weil Qualitätsdaten die Zielbeschreibung vollständig ersetzen.","Damit Beschleunigung zulasten der Qualität sichtbar wird.","Weil jede zusätzliche Kennzahl automatisch richtig ist.","Damit Ergebnisse aus unterschiedlichen Produkten beliebig vermischt werden."],"correct_index":1,"explanation":"Eine gewünschte Wirkung sollte nicht durch unerkannte Folgeschäden erkauft werden.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"public-M07-01-P1","module":7,"lesson_id":"7.1","lesson_title":"Ist-Zustand, Kennzahlen und PDCA","type":"practice","question":"Plane einen PDCA-Versuch, der die Wartezeit vor einem Review reduzieren soll.","model_answer":"Ausgangswert und Beginn sowie Ende der Wartezeit festlegen. Eine zeitlich begrenzte Änderung erproben, etwa einen täglichen Review-Slot. Durchlaufzeit und Fehler beziehungsweise Nacharbeit vergleichbar erfassen. Ergebnisse besprec
