],"questions":[{"id":"SKY-089","module":3,"lesson_id":"3.6","lesson_title":"Objektorientierung, Entwurfsmuster und UML","type":"single_choice","question":"Wann passt das Strategy-Muster besonders?","options":["Wenn austauschbare Varianten eines Algorithmus benötigt werden","Wenn jede Klasse dieselbe globale Variable verändern soll","Wenn alle Algorithmen unveränderlich sein müssen","Wenn ausschließlich Daten verschlüsselt werden sollen"],"correct_index":0,"explanation":"Die Strategie kapselt Varianten hinter einer gemeinsamen Schnittstelle.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-090","module":3,"lesson_id":"3.6","lesson_title":"Objektorientierung, Entwurfsmuster und UML","type":"single_choice","question":"Welche Beziehung beschreibt das Observer-Muster?","options":["Abonnenten werden über Zustandsänderungen eines beobachteten Objekts informiert","Ein Objekt muss stets allein existieren","Jede Tabelle erbt von jeder anderen","Eine Funktion darf keine Rückgabe haben"],"correct_index":0,"explanation":"Observer unterstützt ereignisbezogene Benachrichtigungen.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-091","module":3,"lesson_id":"3.6","lesson_title":"Objektorientierung, Entwurfsmuster und UML","type":"single_choice","question":"Welche Information zeigt ein UML-Klassendiagramm besonders gut?","options":["Ausschließlich den Projektkalender","Nur die zeitliche Reihenfolge aller Requests","Nur die aktuellen Stromkosten","Klassen, Attribute, Operationen und Beziehungen"],"correct_index":3,"explanation":"Statische Struktur ist das Hauptanliegen des Klassendiagramms.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"SKY-092","module":3,"lesson_id":"3.6","lesson_title":"Objektorientierung, Entwurfsmuster und UML","type":"practice","question":"Für Mengenabweichungen gelten je Kunde verschiedene Bewertungsregeln. Entwirf eine Erweiterung.","model_answer":"Eine gemeinsame Schnittstelle für die Bewertung definieren. Jede Kundenregel als eigene Strategie implementieren. Die passende Strategie abhängig von der Konfiguration auswählen und je Regel Tests erstellen. Neue Varianten erfordern keine große zentrale Fallunterscheidung.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"3.7","module":3,"title":"Versionsmanagement und CI/CD-Pipeline","trainingMinutes":6,"minutes":0,"slide_count":0,"concepts":[{"title":"Änderungen nachvollziehbar integrieren","body":"Kleine Branches, Reviews und vereinbarte Integrationsregeln erleichtern gemeinsame Arbeit. Das Umschreiben gemeinsam verwendeter Historie braucht Abstimmung.","example":"Ein Pull Request enthält einen begrenzten fachlichen Schritt und passende Prüfungen. Ein Rebase wird mit den Beteiligten abgesprochen."},{"title":"Automatisierung braucht klare Freigaben","body":"Continuous Integration prüft integrierte Änderungen früh. Continuous Delivery hält eine auslieferbare Fassung bereit; Continuous Deployment automatisiert auch den Produktionsschritt.","example":"Eine Pipeline testet, baut ein versioniertes Artefakt und stellt es zunächst auf einer Testumgebung bereit. Geheimnisse kommen aus einer geschützten Verwaltung."}],"questions":[{"id":"SKY-093","module":3,"lesson_id":"3.7","lesson_title":"Versionsmanagement und CI/CD-Pipeline","type":"single_choice","question":"Warum ist ein Rebase eines gemeinsam genutzten Branches abzustimmen?","options":["Weil Rebase nur Datenbanktabellen betrifft","Weil dabei zwangsläufig das Passwort geändert wird","Weil Rebase jede Datei automatisch löscht","Weil Commit-Historie umgeschrieben und andere Arbeit dadurch betroffen werden kann"],"correct_index":3,"explanation":"Die geänderten Commit-Identitäten können bei anderen Arbeitskopien Konflikte verursachen.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-094","module":3,"lesson_id":"3.7","lesson_title":"Versionsmanagement und CI/CD-Pipeline","type":"single_choice","question":"Was unterscheidet Continuous Deployment von Continuous Delivery?","options":["Es werden keine Tests ausgeführt","Die Software wird ausschließlich lokal gespeichert","Es gibt keine Versionsverwaltung","Produktionsbereitstellung erfolgt automatisiert ohne manuelle Freigabestufe"],"correct_index":3,"explanation":"Continuous Delivery hält auslieferbare Änderungen bereit, kann aber eine manuelle Freigabe vor Produktion enthalten.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"SKY-095","module":3,"lesson_id":"3.7","lesson_title":"Versionsmanagement und CI/CD-Pipeline","type":"single_choice","question":"Wie sollten Pipeline-Secrets bereitgestellt werden?","options":["In allen Build-Logs vollständig ausgeben","Über dafür vorgesehene geschützte Secret-Verwaltung","Klartext im öffentlichen Repository","Im Titel jedes Commits"],"correct_index":1,"explanation":"Secrets müssen vor unbefugtem Zugriff und unbeabsichtigter Ausgabe geschützt werden.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"SKY-096","module":3,"lesson_id":"3.7","lesson_title":"Versionsmanagement und CI/CD-Pipeline","type":"practice","question":"Plane fünf Stufen einer Pipeline für eine API.","model_answer":"Abhängigkeiten reproduzierbar installieren; statische Prüfungen ausführen; Unit- und Integrationstests ausführen; versioniertes Artefakt bauen und prüfen; auf einer Testumgebung bereitstellen und nach definierter Freigabe ausrollen. Secrets und Rollback getrennt berücksichtigen.","max_points":5,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"3.8","module":3,"title":"Release-Management und Software-Paketierung","trainingMinutes":6,"minutes":0,"slide_count":0,"concepts":[{"title":"Ein Release ist mehr als neuer Code","body":"Eine Auslieferung braucht eine nachvollziehbare Version, ein überprüftes Artefakt und Hinweise zu Änderungen. Bei SemVer signalisiert eine inkompatible Änderung der öffentlichen API eine neue Major-Version.","example":"Vor einem Roll-out prüft das Team, ob die bisherige Client-Version das neue Antwortformat weiterhin verarbeiten kann."},{"title":"Den Rückweg vor dem Roll-out klären","body":"Ein Rollback muss zu Anwendung und bereits geänderten Daten passen. Zwei Bereitstellungsumgebungen können einen schnellen Verkehrswechsel ermöglichen, ersetzen aber keine Kompatibilitätsprüfung.","example":"Eine neue Datenbankspalte wird zuerst kompatibel eingeführt. Erst nach erfolgreicher Umstellung darf die alte Zugriffsmöglichkeit entfallen."}],"questions":[{"id":"SKY-097","module":3,"lesson_id":"3.8","lesson_title":"Release-Management und Software-Paketierung","type":"single_choice","question":"Welche Versionserhöhung signalisiert bei SemVer eine inkompatible Änderung der öffentlichen API?","options":["Nur Build-Metadaten","Keine Änderung der Versionsnummer","Major","Patch"],"correct_index":2,"explanation":"Eine inkompatible Änderung wird im MAJOR-Anteil sichtbar gemacht.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"SKY-098","module":3,"lesson_id":"3.8","lesson_title":"Release-Management und Software-Paketierung","type":"single_choice","question":"Was ist der Hauptzweck von Release Notes?","options":["Anwender über Änderungen und relevante Folgen eines Releases informieren","Nur die Zahl der Entwickler nennen","Alle geheimen Zugangsdaten veröffentlichen","Jede Quellcodezeile wiedergeben"],"correct_index":0,"explanation":"Release Notes beschreiben neue Funktionen, Änderungen, bekannte Probleme und gegebenenfalls Umstellungshinweise.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-099","module":3,"lesson_id":"3.8","lesson_title":"Release-Management und Software-Paketierung","type":"single_choice","question":"Wie unterstützt Blue-Green Deployment einen schnellen Wechsel?","options":["Durch manuelles Ändern jeder Clientdatei","Durch Verzicht auf eine zweite Umgebung","Durch Löschen aller alten Daten vor dem Test","Durch zwei Umgebungen, zwischen denen Verkehr umgeschaltet wird"],"correct_index":3,"explanation":"Eine Umgebung kann geprüft werden, während die andere weiterhin bedient; Datenkompatibilität bleibt zu planen.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"SKY-100","module":3,"lesson_id":"3.8","lesson_title":"Release-Management und Software-Paketierung","type":"practice","question":"Ein Release verursacht Fehler bei Buchungen. Skizziere einen Hotfix- und Rückfallablauf.","model_answer":"Fehler eingrenzen und betroffene Änderungen bewerten; gegebenenfalls Verkehr zur geprüften alten Version zurückschalten; Datenkompatibilität und bereits erfolgte Buchungen prüfen; Fix mit Regressionstest bauen; versionieren und kontrolliert ausrollen; Ursache und Maßnahmen dokumentieren.","max_points":5,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"3.9","module":3,"title":"Sicherheitsmaßnahmen in der Entwicklung","trainingMinutes":6,"minutes":0,"slide_count":0,"concepts":[{"title":"Eingaben und Berechtigungen getrennt behandeln","body":"Validierung prüft, ob Daten zum erwarteten Format und zur Fachregel passen. Autorisierung prüft, ob die anfragende Identität auf eine konkrete Ressource zugreifen darf.","example":"Eine syntaktisch gültige Rechnungsnummer berechtigt noch nicht dazu, die Rechnung einer anderen Person zu lesen."},{"title":"Geheimnisse und Daten schützen","body":"Parametrisierte Abfragen trennen SQL-Struktur von Eingabewerten. Passwörter brauchen ein geeignetes Passwort-Hashverfahren; API-Schlüssel gehören in eine geschützte serverseitige Verwaltung.","example":"Der Server kontrolliert einen Datenzugriff und setzt eine parametrisierte Abfrage ein. In Browser-Code oder Logs stehen keine geheimen Zugangsdaten."}],"questions":[{"id":"SKY-101","module":3,"lesson_id":"3.9","lesson_title":"Sicherheitsmaßnahmen in der Entwicklung","type":"single_choice","question":"Welche Maßnahme schützt SQL-Abfragen vor der Interpretation von Nutzereingaben als SQL-Code?","options":["Passwörter nur länger machen","Parametrisierte Abfragen","Alle Fehler ignorieren","Nutzereingaben direkt in SQL-Strings einsetzen"],"correct_index":1,"explanation":"Daten werden getrennt von der SQL-Struktur übergeben; ergänzend bleiben Rechte und Validierung wichtig.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-102","module":3,"lesson_id":"3.9","lesson_title":"Sicherheitsmaßnahmen in der Entwicklung","type":"single_choice","question":"Welche Speicherung ist für Benutzerpasswörter vorgesehen?","options":["Reversible Verschlüsselung ohne weitere Begründung","Klartext in einer Datenbank","Ein geeignetes langsames Passwort-Hashverfahren mit individuellem Salt","Nur Base64-Codierung"],"correct_index":2,"explanation":"Ein Passwort-Hashverfahren erschwert das massenhafte Durchprobieren; ein Salt verhindert identische Hashes bei gleichen Passwörtern.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-103","module":3,"lesson_id":"3.9","lesson_title":"Sicherheitsmaßnahmen in der Entwicklung","type":"single_choice","question":"Was muss vor dem Zugriff auf eine konkrete Lieferung geprüft werden?","options":["Ob die anfragende Identität für genau diese Ressource berechtigt ist","Nur ob die Anfrage eine Zahl enthält","Nur ob die URL bekannt ist","Nur ob der Browser modern ist"],"correct_index":0,"explanation":"Authentifizierung allein ersetzt keine ressourcenbezogene Autorisierung.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"SKY-104","module":3,"lesson_id":"3.9","lesson_title":"Sicherheitsmaßnahmen in der Entwicklung","type":"practice","question":"Ein Nutzer ändert eine Lieferungs-ID in der URL und sieht fremde Daten. Benenne Ursache, Maßnahme und Test.","model_answer":"Ursache ist fehlende beziehungsweise fehlerhafte objektbezogene Autorisierung. Berechtigung serverseitig für jede Ressource prüfen. Ein Test mit einem berechtigten und einem unberechtigten Konto muss zeigen, dass fremde Ressourcen auch bei manipulierter ID nicht gelesen oder geändert werden können.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"3.10","module":3,"title":"Integrationsprojekt: Vom Entwurf zur sicheren Anwendung","trainingMinutes":6,"minutes":0,"slide_count":0,"concepts":[{"title":"Eine durchgängige Lösung bauen","body":"Anforderung, API-Vertrag, Datenmodell, Umsetzung und Test sollen dieselbe fachliche Aufgabe abdecken. Ein kleiner vollständiger Ablauf zeigt mehr als viele voneinander getrennte Fragmente.","example":"Eine Reservierung wird vom Formular bis zum gespeicherten Datensatz demonstriert, einschließlich eines verständlichen Konfliktfalls."},{"title":"Zwischenstände überprüfbar machen","body":"Checkpoints brauchen sichtbare Ergebnisse und Kriterien. Risiken, offene Annahmen und begründete Entscheidungen werden dabei früh besprochen.","example":"Zuerst werden Vertrag und Modell geprüft, danach ein funktionierender Ablauf und zum Schluss Betrieb, Dokumentation und Fehlerfälle."}],"questions":[{"id":"SKY-105","module":3,"lesson_id":"3.10","lesson_title":"Integrationsprojekt: Vom Entwurf zur sicheren Anwendung","type":"single_choice","question":"Was sollte in einem Integrationsprojekt durchgängig verbunden sein?","options":["Nur Dateien ohne fachlichen Bezug","Anforderungen, Entwurf, Umsetzung und Tests","Nur die letzte Präsentationsfolie","Nur der Projektname und die Farbe"],"correct_index":1,"explanation":"Die Verbindung zeigt, dass die technische Lösung das fachliche Ziel erfüllt.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-106","module":3,"lesson_id":"3.10","lesson_title":"Integrationsprojekt: Vom Entwurf zur sicheren Anwendung","type":"single_choice","question":"Wozu dienen Checkpoints in einem Projekt?","options":["Nur Arbeitszeit zählen","Tests vollständig ersetzen","Entscheidungen bis zum Ende vermeiden","Ergebnisse früh prüfen und Abweichungen rechtzeitig erkennen"],"correct_index":3,"explanation":"Kurze Überprüfungen verhindern, dass große Fehler erst bei der Abschlusspräsentation auffallen.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"SKY-107","module":3,"lesson_id":"3.10","lesson_title":"Integrationsprojekt: Vom Entwurf zur sicheren Anwendung","type":"single_choice","question":"Welche Aussage ist eine belastbare technische Begründung?","options":["Der Name klingt modern","Ein anderer Kurs benutzt sie","Die Technologie ist gerade beliebt","Die Entscheidung erfüllt eine benannte Anforderung und ihre Nachteile werden bewertet"],"correct_index":3,"explanation":"Eine gute Begründung enthält fachlichen Bezug und eine Abwägung.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"SKY-108","module":3,"lesson_id":"3.10","lesson_title":"Integrationsprojekt: Vom Entwurf zur sicheren Anwendung","type":"practice","question":"Plane ein kleines Wareneingangsprojekt mit drei überprüfbaren Zwischenständen.","model_answer":"Stand 1: Anforderungen, API-Vertrag und Datenmodell abgestimmt. Stand 2: Eine gültige Buchung und wichtige Fehlerfälle implementiert und getestet. Stand 3: CI, Zugriffsprüfung, Dokumentation und reproduzierbare Bereitstellung gezeigt. Jeden Stand anhand vorab definierter Kriterien prüfen.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"3.11","module":3,"title":"Prüfungsvorbereitung und Modulabschluss","trainingMinutes":6,"minutes":0,"slide_count":0,"concepts":[{"title":"Den Arbeitsauftrag genau lesen","body":"Operator, verlangte Anzahl und Situationsbezug bestimmen die Antwort. Eine Empfehlung braucht eine nachvollziehbare Begründung, nicht nur einen bekannten Produktnamen.","example":"Bei „Begründen Sie zwei Maßnahmen“ nennt die Antwort zwei passende Maßnahmen und erklärt für beide die Wirkung im beschriebenen Fall."},{"title":"Die Lösung aus mehreren Blickwinkeln prüfen","body":"Eine technische Entscheidung lässt sich mit Anforderungen, Datenkonsistenz, Sicherheit und Tests verbinden. Eine angemessene Zeitverteilung lässt Raum für alle Teilaufgaben.","example":"Nach einer Antwort zur API überprüfst du, ob Fehlerfälle, Berechtigungen und der Bezug zum Beispiel tatsächlich enthalten sind."}],"questions":[{"id":"SKY-109","module":3,"lesson_id":"3.11","lesson_title":"Prüfungsvorbereitung und Modulabschluss","type":"single_choice","question":"Was solltest du vor dem Schreiben einer Prüfungsantwort klären?","options":["Die Produktfarbe","Operator, verlangte Anzahl und Fallbezug","Nur die Länge der eigenen Antwort","Die Lieblingssprache des Prüfers"],"correct_index":1,"explanation":"Diese Vorgaben bestimmen Form und Tiefe der Antwort.","difficulty":"Verständnis","origin":"Eigene Trainingsfrage"},{"id":"SKY-110","module":3,"lesson_id":"3.11","lesson_title":"Prüfungsvorbereitung und Modulabschluss","type":"single_choice","question":"Welche Struktur eignet sich für eine begründete Empfehlung?","options":["Anforderung, Entscheidung, Nutzen und Nachteil beziehungsweise Gegenmaßnahme","Eine Lösung ohne Bezug zur Situation","Produktname ohne Erklärung","Ausschließlich eine Abkürzungsliste"],"correct_index":0,"explanation":"Die Struktur macht die fachliche Herleitung nachvollziehbar.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"},{"id":"SKY-111","module":3,"lesson_id":"3.11","lesson_title":"Prüfungsvorbereitung und Modulabschluss","type":"single_choice","question":"Wie hilft eine Zeitplanung bei mehreren Teilaufgaben?","options":["Sie ersetzt jede fachliche Vorbereitung","Sie macht alle Aufgaben gleich schwer","Sie erlaubt, alle Operatoren zu ignorieren","Sie verteilt Zeit angemessen und verhindert das Festhalten an einer einzelnen Aufgabe"],"correct_index":3,"explanation":"Arbeitszeit sollte sich an Umfang und erwarteter Bewertung orientieren.","difficulty":"Grundlagen","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"SKY-112","module":3,"lesson_id":"3.11","lesson_title":"Prüfungsvorbereitung und Modulabschluss","type":"practice","question":"Begründe für eine Wareneingangs-API die Kombination aus Transaktionen, Autorisierung und Integrationstests.","model_answer":"Transaktionen verhindern unvollständige Buchungen. Autorisierung schützt fremde Lieferungen und Standorte. Integrationstests prüfen, ob API und Datenbank gemeinsam gültige und fehlerhafte Fälle korrekt behandeln. Alle drei Maßnahmen beziehen sich auf Konsistenz und Schutz der konkreten Buchungsprozesse.","max_points":4,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"4.1","module":4,"title":"Qualitätsziele und Qualitätssicherung","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Qualität in beobachtbare Ziele übersetzen","body":"Ein Qualitätswunsch wird überprüfbar, wenn Situation, Messgröße und Zielwert zusammenpassen. Funktionalität, Zuverlässigkeit, Bedienbarkeit und Wartbarkeit betreffen unterschiedliche Blickwinkel.","example":"Statt „Die Suche ist schnell“ wird eine maximale Antwortzeit für eine festgelegte Last vereinbart."},{"title":"Vorbeugen und untersuchen","body":"Konstruktive Maßnahmen helfen, Fehler zu vermeiden. Analytische Maßnahmen suchen Fehler oder bewerten Ergebnisse; beide ergänzen sich.","example":"Ein Coding-Standard unterstützt die Umsetzung. Ein Review und ein Test untersuchen das entstandene Ergebnis."}],"questions":[{"id":"M04-01-Q1","module":4,"lesson_id":"4.1","lesson_title":"Qualitätsziele und Qualitätssicherung","type":"single_choice","question":"Welches Qualitätsziel lässt sich am besten prüfen?","options":["Die Anwendung wirkt zeitgemäß.","Bei definierter Last antworten 95 % der Suchanfragen in höchstens zwei Sekunden.","Die Anwendung ist perfekt.","Jede Person findet die Software schön."],"correct_index":1,"explanation":"Die Aussage nennt einen überprüfbaren Zielwert und eine Bedingung.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-01-Q2","module":4,"lesson_id":"4.1","lesson_title":"Qualitätsziele und Qualitätssicherung","type":"single_choice","question":"Welche Maßnahme ist vor allem konstruktive Qualitätssicherung?","options":["Ein Fehlerprotokoll nach dem Systemtest lesen.","Einen aufgetretenen Absturz nachstellen.","Verbindliche Implementierungsregeln für das Team vereinbaren.","Eine fertige Oberfläche auf Bedienfehler untersuchen."],"correct_index":2,"explanation":"Gemeinsame Regeln sollen Fehler bereits während der Entstehung vermeiden.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-01-Q3","module":4,"lesson_id":"4.1","lesson_title":"Qualitätsziele und Qualitätssicherung","type":"single_choice","question":"Warum reichen viele fehlerfreie Unit-Tests allein nicht für eine Qualitätsaussage?","options":["Weitere Qualitätsziele und das Zusammenspiel des Systems müssen ebenfalls betrachtet werden.","Unit-Tests dürfen nie verwendet werden.","Qualität hängt ausschließlich vom Projektnamen ab.","Jeder Test beweist automatisch vollständige Fehlerfreiheit."],"correct_index":0,"explanation":"Ein einzelner Testtyp deckt nicht alle Anforderungen und Nutzungssituationen ab.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M04-01-P1","module":4,"lesson_id":"4.1","lesson_title":"Qualitätsziele und Qualitätssicherung","type":"practice","question":"Formuliere für eine Termin-App ein messbares Qualitätsziel und zwei passende QS-Maßnahmen.","model_answer":"Beispiel: Unter festgelegter Last müssen 95 % der Terminabfragen innerhalb von zwei Sekunden beantwortet werden. Eine verbindliche Abfragestruktur und ein Review wirken vorbeugend; ein Lasttest überprüft den Zielwert unter dokumentierten Bedingungen.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"4.2","module":4,"title":"Testplanung und Nachverfolgbarkeit","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Tests auf Anforderungen zurückführen","body":"Ein Testziel beschreibt, welche Eigenschaft untersucht wird. Die Verbindung zwischen Anforderung und Test hilft, fehlende Abdeckung und Änderungen sichtbar zu machen.","example":"Die Anforderung „Nur eigene Rechnungen lesen“ erhält Tests für ein berechtigtes und ein fremdes Konto."},{"title":"Die passende Teststufe wählen","body":"Unit-, Integrations-, System- und Abnahmetests betrachten unterschiedliche Grenzen. Ein Testplan legt Umfang, Risiken, Umgebung und Entscheidungsregeln fest.","example":"Das Zusammenspiel von API und Datenbank wird integriert getestet; eine fachliche Nutzerreise wird am Gesamtsystem bewertet."}],"questions":[{"id":"M04-02-Q1","module":4,"lesson_id":"4.2","lesson_title":"Testplanung und Nachverfolgbarkeit","type":"single_choice","question":"Wozu dient eine Nachverfolgbarkeitsmatrix?","options":["Sie ersetzt die Anforderungen.","Sie zählt nur die Dateien.","Sie verbindet Anforderungen mit zugehörigen Tests und Ergebnissen.","Sie speichert geheime Zugangsdaten."],"correct_index":2,"explanation":"So werden Abdeckung und Auswirkungen von Änderungen nachvollziehbar.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-02-Q2","module":4,"lesson_id":"4.2","lesson_title":"Testplanung und Nachverfolgbarkeit","type":"single_choice","question":"Was ist ein sinnvoller Schwerpunkt eines Integrationstests?","options":["Nur den Namen einer Funktion lesen.","Die Zusammenarbeit von API und Testdatenbank prüfen.","Die Schriftfarbe einer Präsentation ändern.","Projektbudgets freigeben."],"correct_index":1,"explanation":"Integrationstests betrachten Schnittstellen und Zusammenarbeit mehrerer Komponenten.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-02-Q3","module":4,"lesson_id":"4.2","lesson_title":"Testplanung und Nachverfolgbarkeit","type":"single_choice","question":"Welche Information gehört in einen Testplan?","options":["Nur die Lieblingssprache des Teams.","Eine Garantie, dass nie Fehler auftreten.","Alle privaten Passwörter.","Testumfang, Risiken, Testumgebung und Abschlusskriterien."],"correct_index":3,"explanation":"Ein Plan macht Durchführung und Bewertung der Tests nachvollziehbar.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M04-02-P1","module":4,"lesson_id":"4.2","lesson_title":"Testplanung und Nachverfolgbarkeit","type":"practice","question":"Eine Freigabe darf nur durch die zuständige Rolle erfolgen. Leite zwei Tests und ein Abnahmekriterium ab.","model_answer":"Ein berechtigtes Konto kann den passenden Vorgang freigeben. Ein nicht berechtigtes Konto erhält auch bei direktem API-Aufruf keinen Zugriff. Ein mögliches Kriterium ist, dass beide Fälle in der vereinbarten Testumgebung nachweislich wie beschrieben funktionieren.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"4.3","module":4,"title":"Testfälle, Grenzwerte und Methoden","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Eingabebereiche sinnvoll aufteilen","body":"Äquivalenzklassen bündeln Eingaben mit erwartet ähnlichem Verhalten. Grenzwerte verdienen besondere Aufmerksamkeit, weil sich das erlaubte Verhalten dort ändert.","example":"Bei einer erlaubten Menge von 1 bis 20 prüft das Team unter anderem 0, 1, 20 und 21."},{"title":"Erwartungen vor dem Test festhalten","body":"Ein Testfall beschreibt Voraussetzungen, Eingabe oder Aktion und erwartetes Ergebnis. Black-Box-Tests leiten Fälle aus sichtbarem Verhalten ab; White-Box-Tests nutzen zusätzlich die innere Struktur.","example":"Eine Entscheidungstabelle macht Kombinationen aus Kundentyp und Bestellwert nachvollziehbar."}],"questions":[{"id":"M04-03-Q1","module":4,"lesson_id":"4.3","lesson_title":"Testfälle, Grenzwerte und Methoden","type":"single_choice","question":"Welche Werte passen besonders zur Grenzwertanalyse für eine erlaubte Menge von 1 bis 20?","options":["0, 1, 20 und 21","Nur 10 und 11","Ausschließlich 100","Immer die leere Liste"],"correct_index":0,"explanation":"Die Werte liegen an den Grenzen oder direkt außerhalb des erlaubten Bereichs.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-03-Q2","module":4,"lesson_id":"4.3","lesson_title":"Testfälle, Grenzwerte und Methoden","type":"single_choice","question":"Welche Angabe macht einen Testfall auswertbar?","options":["Nur der Zeitpunkt des Mittagessens.","Ein erwartetes, beobachtbares Ergebnis.","Eine beliebige Dateifarbe.","Der Satz „Es wird schon funktionieren“."],"correct_index":1,"explanation":"Erst ein vorab beschriebenes Soll-Ergebnis ermöglicht einen belastbaren Vergleich.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-03-Q3","module":4,"lesson_id":"4.3","lesson_title":"Testfälle, Grenzwerte und Methoden","type":"single_choice","question":"Wann ist eine Entscheidungstabelle besonders hilfreich?","options":["Wenn keine Regeln bekannt sind und keine geklärt werden sollen.","Nur beim Umbenennen von Dateien.","Wenn mehrere Bedingungen gemeinsam ein fachliches Ergebnis bestimmen.","Wenn alle Kombinationen grundsätzlich verboten sind."],"correct_index":2,"explanation":"Tabellen helfen, Kombinationen systematisch und lückenbewusst zu betrachten.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M04-03-P1","module":4,"lesson_id":"4.3","lesson_title":"Testfälle, Grenzwerte und Methoden","type":"practice","question":"Ein Rabatt gilt nur für Mitglieder mit einem Warenwert von mindestens 100 Euro. Skizziere passende Testfälle.","model_answer":"Prüfe Mitglieder unter 100 Euro, genau bei 100 Euro und darüber. Ergänze Nichtmitglieder bei denselben relevanten Werten. Halte für jeden Fall fest, ob ein Rabatt erwartet wird, und grenze die betrachtete Berechnungsregel klar ab.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"4.4","module":4,"title":"Testumgebung, Testdaten und Automatisierung","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Tests reproduzierbar aufbauen","body":"Eine definierte Umgebung und bekannte Daten machen Ergebnisse vergleichbar. Testdaten müssen den vorgesehenen Zugriff und die betrachteten Fälle abbilden, ohne unnötige echte personenbezogene Daten zu übernehmen.","example":"Ein Skript erzeugt synthetische Bestellungen und setzt die Testdatenbank vor einem Lauf in einen bekannten Zustand."},{"title":"Automatisierung gezielt einsetzen","body":"Häufig wiederholte, stabil prüfbare Abläufe sind gute Kandidaten. Die Testpyramide hilft beim Abwägen vieler schneller Prüfungen und ausgewählter aufwendiger Systemabläufe.","example":"Ein Mengenvalidator wird mit vielen Unit-Fällen geprüft; wenige UI-Tests decken kritische Nutzerreisen ab."}],"questions":[{"id":"M04-04-Q1","module":4,"lesson_id":"4.4","lesson_title":"Testumgebung, Testdaten und Automatisierung","type":"single_choice","question":"Welche Eigenschaft unterstützt reproduzierbare Tests?","options":["Unbekannte Startdaten bei jedem Lauf.","Gemeinsam genutzte Produktionskonten für alle Tests.","Ein dokumentierter Aufbau mit definiertem Ausgangszustand.","Das Ignorieren von Versionsständen."],"correct_index":2,"explanation":"Ein kontrollierter Ausgangszustand macht Unterschiede und Fehler leichter erklärbar.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-04-Q2","module":4,"lesson_id":"4.4","lesson_title":"Testumgebung, Testdaten und Automatisierung","type":"single_choice","question":"Welche Testdaten sind für eine allgemeine Testumgebung oft ein geeigneter Ausgangspunkt?","options":["Ungeprüft kopierte vollständige Kundendaten.","Passende synthetische Daten mit bekannten Eigenschaften.","Nur geheime Administratorpasswörter.","Zufällige Daten ohne erwartetes Ergebnis."],"correct_index":1,"explanation":"Synthetische Daten können gezielt Fälle abdecken und unnötige Offenlegung echter Daten vermeiden.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-04-Q3","module":4,"lesson_id":"4.4","lesson_title":"Testumgebung, Testdaten und Automatisierung","type":"single_choice","question":"Welcher Ablauf eignet sich besonders für Automatisierung?","options":["Eine einmalige unklare Produktidee ohne Prüfkriterium.","Das persönliche Bauchgefühl zum Design.","Jede spontane Besprechung.","Ein regelmäßig wiederholter, eindeutig auswertbarer Regressionstest."],"correct_index":3,"explanation":"Wiederholung und klare Erwartungen machen den Nutzen von Automatisierung gut erkennbar.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M04-04-P1","module":4,"lesson_id":"4.4","lesson_title":"Testumgebung, Testdaten und Automatisierung","type":"practice","question":"Plane eine Testumgebung für eine Buchungs-API mit Datenbank.","model_answer":"Verwende eine getrennte Testdatenbank mit bekanntem Schema und synthetischen Fällen. Beschreibe das Zurücksetzen der Daten, benötigte Dienste und Versionsstände. Automatisiere wichtige API- und Integrationstests und protokolliere die Ergebnisse nachvollziehbar.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"4.5","module":4,"title":"Fehlerberichte und Priorisierung","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Einen Fehler nachvollziehbar beschreiben","body":"Ein guter Bericht enthält Umgebung, Schritte, erwartetes und tatsächliches Ergebnis. Passende Belege helfen bei der Reproduktion, sollten aber keine unnötigen Geheimnisse enthalten.","example":"Ein fehlgeschlagener Export wird mit Version, Beispielschritten und bereinigter Fehlermeldung dokumentiert."},{"title":"Wirkung und Bearbeitungsreihenfolge unterscheiden","body":"Schweregrad beschreibt die Auswirkung eines Fehlers. Priorität beschreibt, wann er bearbeitet werden soll; Risiko und Nutzungssituation beeinflussen diese Entscheidung.","example":"Ein selten genutzter Prozess kann einen schweren Fehler haben. Ein kleiner Darstellungsfehler kann vor einer unmittelbar bevorstehenden Vorführung dennoch dringend sein."}],"questions":[{"id":"M04-05-Q1","module":4,"lesson_id":"4.5","lesson_title":"Fehlerberichte und Priorisierung","type":"single_choice","question":"Welche Information hilft besonders beim Nachstellen eines Fehlers?","options":["Nur „geht nicht“.","Eine genaue Schrittfolge mit Soll- und Ist-Ergebnis.","Ein beliebiger Projektname.","Eine Liste aller privaten Kontakte."],"correct_index":1,"explanation":"Reproduzierbare Schritte ermöglichen die gezielte Untersuchung.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-05-Q2","module":4,"lesson_id":"4.5","lesson_title":"Fehlerberichte und Priorisierung","type":"single_choice","question":"Was beschreibt die Priorität eines Fehlers?","options":["Ausschließlich die Zahl der Codezeilen.","Immer denselben Wert wie der Schweregrad.","Die Farbe des Tickets.","Die vereinbarte Dringlichkeit und Bearbeitungsreihenfolge."],"correct_index":3,"explanation":"Priorität berücksichtigt neben Auswirkungen auch zeitlichen und fachlichen Kontext.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-05-Q3","module":4,"lesson_id":"4.5","lesson_title":"Fehlerberichte und Priorisierung","type":"single_choice","question":"Wozu dient eine Triage?","options":["Fehler bewerten, klären und einer passenden Bearbeitung zuordnen.","Jede Fehlermeldung ungeprüft löschen.","Tests dauerhaft abschalten.","Alle Tickets automatisch als gelöst markieren."],"correct_index":0,"explanation":"Gemeinsame Einordnung unterstützt eine begründete Bearbeitungsreihenfolge.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M04-05-P1","module":4,"lesson_id":"4.5","lesson_title":"Fehlerberichte und Priorisierung","type":"practice","question":"Schreibe einen kurzen Fehlerbericht für einen Export, der bei einer leeren Ergebnisliste abstürzt.","model_answer":"Umgebung und Version nennen. Schritte: Suche ohne Treffer ausführen und Export wählen. Erwartet: eine verständliche Rückmeldung oder ein definierter leerer Export. Tatsächlich: Abbruch mit bereinigter Fehlermeldung. Reproduzierbarkeit, Auswirkungen und geeignete Belege ergänzen.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"4.6","module":4,"title":"Testergebnisse und Verbesserung","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Ergebnisse im Kontext bewerten","body":"Ein Testbericht verbindet Befunde mit Umfang, Umgebung und offenen Risiken. Eine Kennzahl kann Orientierung geben, ersetzt aber keine fachliche Bewertung.","example":"Eine hohe Anzahl erfolgreicher Tests sagt wenig über eine kritische Berechtigungsprüfung aus, wenn für sie kein Test vorhanden ist."},{"title":"Aus Ursachen lernen","body":"Ursachenanalyse betrachtet, warum ein Problem entstehen und unentdeckt bleiben konnte. Eine Verbesserungsmaßnahme wird geplant, umgesetzt und anschließend auf Wirkung geprüft.","example":"Nach einem wiederkehrenden Validierungsfehler ergänzt das Team einen gemeinsamen Validator, passende Tests und einen späteren Wirksamkeitscheck."}],"questions":[{"id":"M04-06-Q1","module":4,"lesson_id":"4.6","lesson_title":"Testergebnisse und Verbesserung","type":"single_choice","question":"Warum beweist eine hohe Codeabdeckung allein keine Fehlerfreiheit?","options":["Weil ausgeführte Zeilen noch keine vollständigen Erwartungen und Fälle garantieren.","Weil Tests keine Ergebnisse liefern dürfen.","Weil nur die Länge des Codes zählt.","Weil alle ungetesteten Funktionen automatisch korrekt sind."],"correct_index":0,"explanation":"Abdeckung zeigt Ausführung, nicht automatisch die Güte aller Prüfungen.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-06-Q2","module":4,"lesson_id":"4.6","lesson_title":"Testergebnisse und Verbesserung","type":"single_choice","question":"Was gehört zu einer nachvollziehbaren Testempfehlung?","options":["Nur ein grünes Symbol.","Der Name des Testwerkzeugs ohne Befunde.","Ergebnisse, offener Umfang und verbleibende Risiken.","Eine geheime Zugangsliste."],"correct_index":2,"explanation":"Die Entscheidung braucht den Kontext dessen, was geprüft wurde und was offen bleibt.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M04-06-Q3","module":4,"lesson_id":"4.6","lesson_title":"Testergebnisse und Verbesserung","type":"single_choice","question":"Wann ist eine Verbesserung überzeugend abgeschlossen?","options":["Sobald jemand eine Idee erwähnt.","Wenn ihre Wirkung anhand eines passenden Kriteriums überprüft wurde.","Sobald das Ticket anders eingefärbt ist.","Wenn sämtliche Rückmeldungen ignoriert werden."],"correct_index":1,"explanation":"Eine überprüfte Wirkung schließt den Lernkreislauf besser als eine bloße Aufgabenliste.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M04-06-P1","module":4,"lesson_id":"4.6","lesson_title":"Testergebnisse und Verbesserung","type":"practice","question":"Mehrere Fehler werden erst kurz vor der Freigabe entdeckt. Leite eine Verbesserung mit Wirksamkeitsprüfung ab.","model_answer":"Untersuche zuerst, welche frühen Prüfungen fehlen oder unzuverlässig sind. Ergänze gezielte Reviews oder automatisierte Tests für die betroffenen Risiken. Vergleiche in folgenden Auslieferungen beispielsweise den Anteil spät gefundener kritischer Fehler und bewerte den Befund im Projektkontext.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"5.1","module":5,"title":"Zielgruppen und Dokumentationsarten","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Die Leserfrage bestimmt die Erklärung","body":"Nutzende, Entwickler und Betrieb benötigen unterschiedliche Informationen. Eine hilfreiche Dokumentation beginnt mit Aufgabe, Vorwissen und Nutzungssituation.","example":"Eine Kurzanleitung erklärt das Abschließen eines Vorgangs; der Betrieb benötigt zusätzlich Hinweise zu Überwachung und Störungen."},{"title":"Lernen, Handeln, Nachschlagen und Verstehen trennen","body":"Ein Tutorial führt beim Lernen, eine Anleitung unterstützt eine konkrete Aufgabe, eine Referenz beschreibt Details und eine Erklärung vermittelt Zusammenhänge.","example":"Eine API-Feldliste ist eine Referenz. Eine geführte erste Beispielintegration ist ein Tutorial."}],"questions":[{"id":"M05-01-Q1","module":5,"lesson_id":"5.1","lesson_title":"Zielgruppen und Dokumentationsarten","type":"single_choice","question":"Was sollte die Auswahl von Tiefe und Sprache einer Dokumentation besonders bestimmen?","options":["Nur die Lieblingsfarbe der Autorin.","Zielgruppe, Vorwissen und konkrete Aufgabe.","Die maximale Dateigröße.","Immer die Anzahl aller internen Klassen."],"correct_index":1,"explanation":"Informationen werden nützlich, wenn sie zur Leseraufgabe passen.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-01-Q2","module":5,"lesson_id":"5.1","lesson_title":"Zielgruppen und Dokumentationsarten","type":"single_choice","question":"Welche Form passt zum schnellen Nachschlagen erlaubter API-Felder?","options":["Ein Projekttagebuch ohne Struktur.","Eine beliebige Werbeanzeige.","Ein persönlicher Kalender.","Eine strukturierte Referenz."],"correct_index":3,"explanation":"Eine Referenz stellt definierte Details zum gezielten Nachschlagen bereit.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-01-Q3","module":5,"lesson_id":"5.1","lesson_title":"Zielgruppen und Dokumentationsarten","type":"single_choice","question":"Was ist ein typisches Ziel eines Tutorials?","options":["Einen geführten ersten Lernerfolg ermöglichen.","Nur unbekannte Fachwörter sammeln.","Jede Rückfrage vermeiden, indem alles weggelassen wird.","Ausschließlich eine Versionsnummer anzeigen."],"correct_index":0,"explanation":"Ein Tutorial unterstützt Lernen durch einen nachvollziehbaren Ablauf.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M05-01-P1","module":5,"lesson_id":"5.1","lesson_title":"Zielgruppen und Dokumentationsarten","type":"practice","question":"Plane je ein Dokument für neue Nutzende und für den technischen Betrieb einer Termin-App.","model_answer":"Für neue Nutzende eine kurze Anleitung zu Anmeldung, Terminanlage und typischen Rückmeldungen erstellen. Für den Betrieb Aufbau, Konfiguration, Überwachung und Störungsbehandlung beschreiben. Beide Dokumente erhalten einen klaren Versionsbezug und eine verantwortliche Stelle.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"5.2","module":5,"title":"Docs-as-Code und Architekturentscheidungen","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Dokumentation wie eine Änderung pflegen","body":"Docs-as-Code verbindet versionierte Texte mit Reviews und automatisierten Prüfungen. Die Werkzeugkette hilft, benötigt aber weiterhin fachliche Verantwortung.","example":"Ein Pull Request ändert Funktion und Anleitung gemeinsam; eine Prüfung kontrolliert Links und den Bau der Dokumentation."},{"title":"Entscheidungen mit Gründen festhalten","body":"Ein ADR erklärt Kontext, Entscheidung, Alternativen und Folgen einer wesentlichen Architekturwahl. So bleibt verständlich, warum ein Team eine Lösung gewählt hat.","example":"Ein ADR nennt die Gründe für einen modularen Monolithen und beschreibt, wann die Entscheidung erneut geprüft wird."}],"questions":[{"id":"M05-02-Q1","module":5,"lesson_id":"5.2","lesson_title":"Docs-as-Code und Architekturentscheidungen","type":"single_choice","question":"Was gehört zum Docs-as-Code-Ansatz?","options":["Dokumentation nur auf einem privaten Desktop behalten.","Reviews grundsätzlich überspringen.","Dokumentation versionieren, prüfen und gemeinsam ändern.","Geheime Schlüssel in jeder Anleitung abdrucken."],"correct_index":2,"explanation":"Der Ansatz nutzt bewährte Änderungs- und Prüfabläufe auch für Texte.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-02-Q2","module":5,"lesson_id":"5.2","lesson_title":"Docs-as-Code und Architekturentscheidungen","type":"single_choice","question":"Welche Frage beantwortet ein guter ADR besonders?","options":["Welche Tastatur wird verwendet?","Warum wurde diese Architekturentscheidung im gegebenen Kontext getroffen?","Wie viele E-Mails gibt es im Postfach?","Wer hat die längste Datei geschrieben?"],"correct_index":1,"explanation":"Der Entscheidungsgrund ist für spätere Änderungen oft wichtiger als nur das Ergebnis.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-02-Q3","module":5,"lesson_id":"5.2","lesson_title":"Docs-as-Code und Architekturentscheidungen","type":"single_choice","question":"Wann sollte eine relevante Dokumentationsänderung geprüft werden?","options":["Erst nach dem Löschen der Anwendung.","Nur wenn der Dateiname lang ist.","Nie, weil Texte keine Fehler enthalten.","Im passenden Änderungsprozess zusammen mit der betroffenen Funktion."],"correct_index":3,"explanation":"Gemeinsame Prüfung reduziert veraltete oder widersprüchliche Beschreibungen.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M05-02-P1","module":5,"lesson_id":"5.2","lesson_title":"Docs-as-Code und Architekturentscheidungen","type":"practice","question":"Skizziere einen ADR zur Entscheidung für eine gemeinsam ausgelieferte Web-Anwendung.","model_answer":"Kontext: kleines Team und überschaubare Last. Entscheidung: zunächst eine gemeinsam ausgelieferte, klar gegliederte Anwendung. Alternativen: getrennte Dienste. Gründe und Nachteile benennen; etwa einfacherer Betrieb bei gemeinsamer Auslieferung. Einen Prüfanlass für spätere Änderungen festhalten.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"5.3","module":5,"title":"Code-, API- und Prozessdokumentation","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Erklären, was nicht offensichtlich ist","body":"Code-Dokumentation beschreibt Absicht, Verträge und überraschende Randbedingungen. Kommentare, die sichtbaren Code nur wiederholen, liefern wenig zusätzlichen Nutzen.","example":"Ein Kommentar erklärt, weshalb ein Rundungsverfahren verwendet wird, statt nur „Betrag runden“ zu wiederholen."},{"title":"Schnittstellen und Abläufe überprüfbar beschreiben","body":"Eine API-Beschreibung umfasst Daten, Verhalten und Fehler. Eine Prozessbeschreibung klärt Schritte, Rollen und Übergaben. Beide brauchen einen Bezug zur tatsächlichen Umsetzung.","example":"Ein Freigabeprozess nennt die zuständige Rolle und den Umgang mit Ablehnungen; die API beschreibt dazu die erlaubten Eingaben und Antworten."}],"questions":[{"id":"M05-03-Q1","module":5,"lesson_id":"5.3","lesson_title":"Code-, API- und Prozessdokumentation","type":"single_choice","question":"Welcher Kommentar liefert typischerweise zusätzlichen Nutzen?","options":["Er erklärt eine nicht offensichtliche fachliche Entscheidung.","Er kopiert nur den Namen der nächsten Variablen.","Er enthält ein geheimes Passwort.","Er widerspricht absichtlich dem Code."],"correct_index":0,"explanation":"Ein guter Kommentar macht Absicht oder besondere Bedingungen verständlich.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-03-Q2","module":5,"lesson_id":"5.3","lesson_title":"Code-, API- und Prozessdokumentation","type":"single_choice","question":"Welche Information gehört in eine API-Beschreibung?","options":["Nur das Teamlogo.","Ausschließlich eine Bildschirmfarbe.","Eingaben, Antworten und relevante Fehlerfälle.","Die private Urlaubsplanung."],"correct_index":2,"explanation":"Clients benötigen einen vollständigen, nachvollziehbaren Vertrag.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-03-Q3","module":5,"lesson_id":"5.3","lesson_title":"Code-, API- und Prozessdokumentation","type":"single_choice","question":"Was macht eine Prozessbeschreibung besonders hilfreich?","options":["Die Arbeitsschritte werden ohne Zusammenhang vermischt.","Rollen, Schritte und Übergaben sind nachvollziehbar.","Zuständigkeiten bleiben absichtlich unbekannt.","Jeder Ablauf wird nur als Bild ohne Erklärung abgelegt."],"correct_index":1,"explanation":"Die Beschreibung soll Zusammenarbeit und Verantwortlichkeiten erklären.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M05-03-P1","module":5,"lesson_id":"5.3","lesson_title":"Code-, API- und Prozessdokumentation","type":"practice","question":"Beschreibe die Dokumentation für einen Endpunkt, der eine Reservierung anlegt.","model_answer":"Methode und Adresse, erforderliche Felder, Bedingungen und Beispielanfrage nennen. Erfolgsantwort sowie ungültige Eingaben und fachliche Konflikte beschreiben. Berechtigungen, Versionsbezug und ein überprüfbares Beispiel ergänzen, ohne Geheimnisse zu veröffentlichen.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"5.4","module":5,"title":"Verständliche Anwenderanleitungen","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Vom Nutzerziel zum Handlungsschritt","body":"Eine Anleitung beschreibt, was eine Person erreichen möchte und welche Voraussetzungen gelten. Kurze eindeutige Schritte sind leichter anwendbar als lange Listen interner Details.","example":"Die Anleitung „Termin verschieben“ beginnt bei einem vorhandenen Termin und endet bei einer sichtbaren Bestätigung."},{"title":"Ergebnisse und Fehlerwege sichtbar machen","body":"Nach wichtigen Schritten soll erkennbar sein, was passieren müsste. Häufige Fehlermeldungen brauchen verständliche Ursachen und passende nächste Handlungen.","example":"Bei einer bereits vergebenen Uhrzeit erklärt die Anleitung, wie eine freie Alternative gewählt werden kann."}],"questions":[{"id":"M05-04-Q1","module":5,"lesson_id":"5.4","lesson_title":"Verständliche Anwenderanleitungen","type":"single_choice","question":"Welche Formulierung eignet sich für einen konkreten Handlungsschritt?","options":["Benutzerfreundlichkeit ist ein komplexes Thema.","Eventuell sollte irgendetwas passieren.","Der Prozess kann vielleicht konfiguriert werden.","Wähle den Termin und tippe auf „Verschieben“."],"correct_index":3,"explanation":"Die Formulierung benennt eine beobachtbare, konkrete Handlung.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-04-Q2","module":5,"lesson_id":"5.4","lesson_title":"Verständliche Anwenderanleitungen","type":"single_choice","question":"Was sollte eine Anleitung neben den Schritten erklären?","options":["Voraussetzungen und das erwartete Ergebnis.","Nur den Geburtstag des Entwicklungsteams.","Sämtliche internen Datenbanktabellen.","Eine zufällige Auswahl fremder Funktionen."],"correct_index":0,"explanation":"Voraussetzungen und Ergebnis helfen, den Ablauf richtig einzuordnen.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-04-Q3","module":5,"lesson_id":"5.4","lesson_title":"Verständliche Anwenderanleitungen","type":"single_choice","question":"Was ist bei einem Screenshot besonders sinnvoll?","options":["Unlesbare Details und geheime Daten zeigen.","Eine passende Ansicht mit erforderlicher Erklärung und Versionsbezug verwenden.","Immer den gesamten Desktop mit privaten Nachrichten zeigen.","Den Screenshot unabhängig von Änderungen nie prüfen."],"correct_index":1,"explanation":"Bilder ergänzen eine Anleitung nur, wenn sie zum beschriebenen Zustand passen.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M05-04-P1","module":5,"lesson_id":"5.4","lesson_title":"Verständliche Anwenderanleitungen","type":"practice","question":"Schreibe eine kurze Anleitung zum Verschieben eines Termins mit einem möglichen Fehlerfall.","model_answer":"Voraussetzung: angemeldet sein und einen bearbeitbaren Termin besitzen. Termin öffnen, Verschieben wählen, neue Zeit eintragen und bestätigen. Die neue Zeit muss anschließend sichtbar sein. Ist die Zeit vergeben, eine andere freie Zeit auswählen oder den Vorgang abbrechen.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"5.5","module":5,"title":"Schulung und lebendige Wissenssammlung","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Lernen aktiv gestalten","body":"Schulungsunterlagen unterstützen ein Lernziel und eine Aufgabe. Eine eigene Übung mit Rückmeldung macht eher sichtbar, ob der Ablauf verstanden wurde.","example":"Neue Mitarbeitende legen einen Testvorgang an und erklären anschließend einen typischen Fehlerfall."},{"title":"Wissen braucht Pflege","body":"Eine Wissenssammlung benötigt auffindbare Einträge, Verantwortliche und Prüfanlässe. Veraltete oder doppelte Seiten können ebenso schaden wie fehlende Informationen.","example":"Ein Eintrag zur Störungsbehandlung wird einer verantwortlichen Person zugeordnet und nach relevanten Systemänderungen erneut geprüft."}],"questions":[{"id":"M05-05-Q1","module":5,"lesson_id":"5.5","lesson_title":"Schulung und lebendige Wissenssammlung","type":"single_choice","question":"Welche Schulungsaktivität unterstützt das Überprüfen des Verständnisses?","options":["Nur Folien im Hintergrund laufen lassen.","Aufgaben ohne Ziel verteilen.","Einen Ablauf selbst durchführen und das Ergebnis besprechen.","Fragen grundsätzlich verbieten."],"correct_index":2,"explanation":"Aktive Anwendung und Rückmeldung zeigen praktische Lücken.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-05-Q2","module":5,"lesson_id":"5.5","lesson_title":"Schulung und lebendige Wissenssammlung","type":"single_choice","question":"Was hilft gegen eine veraltete Wissenssammlung?","options":["Einträge ohne Zuständigkeit immer weiter kopieren.","Verantwortliche und regelmäßige oder ereignisbezogene Prüfung festlegen.","Alle Links ungeprüft dauerhaft übernehmen.","Informationen ausschließlich in privaten Chats behalten."],"correct_index":1,"explanation":"Pflege benötigt klare Verantwortung und erkennbare Auslöser.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-05-Q3","module":5,"lesson_id":"5.5","lesson_title":"Schulung und lebendige Wissenssammlung","type":"single_choice","question":"Worin unterscheiden sich Unterlagen für Endnutzende und Multiplikatoren oft?","options":["Sie müssen immer vollständig identisch sein.","Endnutzende benötigen sämtliche Trainerhinweise.","Multiplikatoren dürfen keine Beispiele sehen.","Multiplikatoren benötigen zusätzlich Hinweise zum Erklären und Begleiten von Übungen."],"correct_index":3,"explanation":"Die Rolle bestimmt, ob neben der Bedienung auch die Vermittlung unterstützt werden soll.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M05-05-P1","module":5,"lesson_id":"5.5","lesson_title":"Schulung und lebendige Wissenssammlung","type":"practice","question":"Plane eine zehnminütige Schulungsübung und die Pflege des zugehörigen Wissenseintrags.","model_answer":"Ein klares Ziel setzen, etwa einen Termin korrekt verschieben. Kurz vorführen, selbst durchführen lassen und einen Fehlerfall besprechen. Den Wissenseintrag mit Voraussetzungen, Schritten und Verantwortlichkeit versehen; nach einer Änderung des Ablaufs erneut prüfen.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]},{"id":"5.6","module":5,"title":"Review, Versionierung und Bereitstellung","trainingMinutes":6,"minutes":0,"slide_count":0,"trainingSection":true,"concepts":[{"title":"Die Anleitung an der Anwendung prüfen","body":"Ein Review untersucht fachliche Richtigkeit, Verständlichkeit und Vollständigkeit. Besonders aussagekräftig ist es, wenn eine passende Person den Ablauf tatsächlich anhand der Anleitung ausführt.","example":"Eine neue Kollegin folgt der Kurzanleitung und markiert fehlende Voraussetzungen oder unklare Begriffe."},{"title":"Dokumentation passend ausliefern","body":"Eine Dokumentation braucht einen erkennbaren Versionsbezug und einen geeigneten Ablageort. Automatisierte Prüfungen können Links und Beispiele prüfen, ersetzen aber kein Verständnis der Leseraufgabe.","example":"Mit einer neuen API-Version wird die passende Referenz veröffentlicht; ältere Versionen bleiben eindeutig gekennzeichnet."}],"questions":[{"id":"M05-06-Q1","module":5,"lesson_id":"5.6","lesson_title":"Review, Versionierung und Bereitstellung","type":"single_choice","question":"Welche Prüfung bewertet eine Anleitung besonders praxisnah?","options":["Eine passende Person führt die beschriebene Aufgabe damit aus.","Nur die Wortanzahl wird maximiert.","Alle Rückmeldungen werden gelöscht.","Der Text wird ausschließlich nach Dateigröße sortiert."],"correct_index":0,"explanation":"Die tatsächliche Nutzung zeigt Lücken, die beim reinen Lesen leicht übersehen werden.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-06-Q2","module":5,"lesson_id":"5.6","lesson_title":"Review, Versionierung und Bereitstellung","type":"single_choice","question":"Warum ist ein Versionsbezug wichtig?","options":["Er ersetzt jede fachliche Erklärung.","Er schützt automatisch alle Konten.","Er zeigt, zu welchem Anwendungsstand die Beschreibung gehört.","Er macht jede spätere Prüfung unnötig."],"correct_index":2,"explanation":"Die Zuordnung verhindert, dass unterschiedliche Softwarestände verwechselt werden.","difficulty":"Training","origin":"Eigene Trainingsfrage"},{"id":"M05-06-Q3","module":5,"lesson_id":"5.6","lesson_title":"Review, Versionierung und Bereitstellung","type":"single_choice","question":"Welche automatisierte Dokumentationsprüfung ist sinnvoll?","options":["Geheime Zugangsdaten in den Bericht schreiben.","Links und ausführbare Beispiele auf erwartetes Verhalten prüfen.","Alle Absätze zufällig vertauschen.","Jede fehlende Seite als Erfolg werten."],"correct_index":1,"explanation":"Automatische Prüfungen können konkrete technische Fehler zuverlässig sichtbar machen.","difficulty":"Training","origin":"Eigene Trainingsfrage"}],"practice":[{"id":"M05-06-P1","module":5,"lesson_id":"5.6","lesson_title":"Review, Versionierung und Bereitstellung","type":"practice","question":"Eine neue Version verändert den Anmeldeablauf. Plane die Aktualisierung der Dokumentation.","model_answer":"Betroffene Anleitungen, Referenzen und Schulungsunterlagen identifizieren. Schritte und Bilder anpassen und durch eine passende Person prüfen lassen. Den Versionsbezug aktualisieren, Links und Beispiele prüfen und die Dokumentation gemeinsam mit der neuen Anwendung bereitstellen.","max_points":3,"difficulty":"Anwendung","origin":"Eigene Praxisaufgabe"}]}],"cards":[{"id":"train-SKY-017","lesson_id":"2.0","number":1,"type":"Übungskarte","displayFront":"Welches Altsystem wird im durchgängigen Kursfall abgelöst?","answer":"PALOS — PALOS bildet den Ausgangszustand; Lagerkompass ist das neue Projekt."},{"id":"train-SKY-018","lesson_id":"2.0","number":2,"type":"Übungskarte","displayFront":"Welche Person kennt als Key-Userin die Lagerabläufe besonders gut?","answer":"Heike Schulz — Heike Schulz ist Lagerleiterin und fachliche Ansprechpartnerin für die tatsächlichen Abläufe."},{"id":"train-SKY-019","lesson_id":"2.0","number":3,"type":"Übungskarte","displayFront":"Warum ist ein nächtlicher Batch-Abgleich für aktuelle Bestände problematisch?","answer":"Änderungen sind zwischen den Abgleichen nicht überall aktuell — Die verzögerte Synchronisation kann veraltete Bestandsinformationen verursachen."},{"id":"train-SKY-021","lesson_id":"2.1","number":4,"type":"Übungskarte","displayFront":"Was unterscheidet einen Bedarf von einem Lösungswunsch?","answer":"Der Bedarf beschreibt das zugrunde liegende Problem oder Ziel — Der Wunsch nach einer bestimmten App kann beispielsweise auf dem Bedarf nach weniger Erfassungsfehlern beruhen."},{"id":"train-SKY-022","lesson_id":"2.1","number":5,"type":"Übungskarte","displayFront":"Wer zählt als Stakeholder eines Softwareprojekts?","answer":"Eine Person oder Gruppe, die das Projekt beeinflusst oder davon betroffen ist — Auch Anwender, Betrieb, Datenschutz und angrenzende Fachbereiche können beteiligt sein."},{"id":"train-SKY-023","lesson_id":"2.1","number":6,"type":"Übungskarte","displayFront":"Was beschreibt eine Persona?","answer":"Ein auf Erkenntnissen beruhendes Beispiel einer Nutzergruppe — Personas machen Ziele, Arbeitsumfeld und Schwierigkeiten typischer Nutzer greifbar."},{"id":"train-SKY-025","lesson_id":"2.2","number":7,"type":"Übungskarte","displayFront":"Welche Methode zeigt besonders gut den tatsächlichen Arbeitsablauf?","answer":"Beobachtung am Arbeitsplatz — Beobachtung macht Medienbrüche, Umwege und implizites Wissen sichtbar."},{"id":"train-SKY-026","lesson_id":"2.2","number":8,"type":"Übungskarte","displayFront":"Welche Aussage ist eine funktionale Anforderung?","answer":"Das System muss eine Lieferung erfassen können — Funktionale Anforderungen beschreiben eine Fähigkeit des Systems."},{"id":"train-SKY-027","lesson_id":"2.2","number":9,"type":"Übungskarte","displayFront":"Welche Formulierung ist am besten überprüfbar?","answer":"95 Prozent der Bestandsabfragen antworten unter definierter Testlast innerhalb von zwei Sekunden — Messgröße, Grenzwert und Bedingungen ermöglichen eine objektive Prüfung."},{"id":"train-SKY-029","lesson_id":"2.3","number":10,"type":"Übungskarte","displayFront":"Wer beschreibt im klassischen Lastenheft vor allem die Anforderungen?","answer":"Der Auftraggeber — Das Lastenheft beschreibt aus Auftraggebersicht, was erreicht werden soll."},{"id":"train-SKY-030","lesson_id":"2.3","number":11,"type":"Übungskarte","displayFront":"Welche Form folgt einer typischen User Story?","answer":"Als Rolle möchte ich Funktion, damit Nutzen — Die Story verknüpft Nutzerrolle, gewünschte Fähigkeit und Nutzen."},{"id":"train-SKY-031","lesson_id":"2.3","number":12,"type":"Übungskarte","displayFront":"Was ist der Zweck von Traceability?","answer":"Anforderungen mit Umsetzung und Nachweisen verknüpfen — Verknüpfungen unterstützen Änderungsfolgenanalyse und den Nachweis der Erfüllung."},{"id":"train-SKY-033","lesson_id":"2.4","number":13,"type":"Übungskarte","displayFront":"Was bedeutet Won't Have this time?","answer":"Bewusst außerhalb des aktuellen Umfangs — Won't beschreibt eine Entscheidung für den betrachteten Zeitraum oder Release."},{"id":"train-SKY-034","lesson_id":"2.4","number":14,"type":"Übungskarte","displayFront":"Was kennzeichnet ein Basismerkmal im Kano-Modell?","answer":"Fehlen erzeugt Unzufriedenheit, Erfüllung wird erwartet — Basismerkmale werden häufig als selbstverständlich vorausgesetzt."},{"id":"train-SKY-035","lesson_id":"2.4","number":15,"type":"Übungskarte","displayFront":"Wie entsteht ein gewichteter Gesamtnutzwert?","answer":"Bewertungen je Kriterium mit den Gewichten multiplizieren und summieren — Vorab definierte Kriterien und eine konsistente Skala machen die Auswahl nachvollziehbar."},{"id":"train-SKY-037","lesson_id":"2.5","number":16,"type":"Übungskarte","displayFront":"Welche Kosten gehören zur TCO-Betrachtung?","answer":"Anschaffung, Einführung, Betrieb, Wartung und weitere Lebenszykluskosten — Eine günstige Anschaffung kann durch hohen Betriebs- oder Anpassungsaufwand teuer werden."},{"id":"train-SKY-038","lesson_id":"2.5","number":17,"type":"Übungskarte","displayFront":"Welches Ziel hat ein Proof of Concept vor allem?","answer":"Eine technische Machbarkeit prüfen — Ein PoC beantwortet eine begrenzte Machbarkeitsfrage."},{"id":"train-SKY-039","lesson_id":"2.5","number":18,"type":"Übungskarte","displayFront":"Welche Situation spricht eher für eine Eigenentwicklung?","answer":"Sehr spezifische Kernprozesse, die Standardprodukte schlecht abdecken — Die Entscheidung berücksichtigt fachliche Passung, Kosten, Risiken und vorhandene Fähigkeiten."},{"id":"train-SKY-041","lesson_id":"2.6","number":19,"type":"Übungskarte","displayFront":"Welche Frage beantwortet die Kontextabgrenzung?","answer":"Welche Nutzer und Nachbarsysteme mit dem System interagieren — Die Kontextsicht zeigt die Systemgrenze und externe Beziehungen."},{"id":"train-SKY-042","lesson_id":"2.6","number":20,"type":"Übungskarte","displayFront":"Was dokumentiert ein Architecture Decision Record?","answer":"Eine Architekturentscheidung mit Kontext, Alternativen und Folgen — Ein ADR macht Gründe und Konsequenzen einer Entscheidung später nachvollziehbar."},{"id":"train-SKY-043","lesson_id":"2.6","number":21,"type":"Übungskarte","displayFront":"Welche C4-Sicht zeigt Anwendungen und Datenspeicher innerhalb des betrachteten Systems?","answer":"Container-Sicht — Container bezeichnet im C4-Modell eigenständig ausführbare oder speichernde Einheiten und nicht ausschließlich Docker-Container."},{"id":"train-SKY-045","lesson_id":"2.7","number":22,"type":"Übungskarte","displayFront":"Was eignet sich zur frühen Prüfung eines Bildschirmablaufs?","answer":"Ein einfacher Papierprototyp — Niedrige Fidelity ermöglicht frühes Feedback bei geringem Änderungsaufwand."},{"id":"train-SKY-046","lesson_id":"2.7","number":23,"type":"Übungskarte","displayFront":"Was ist im Usability-Test besonders wichtig?","answer":"Nutzer reale Aufgaben bearbeiten lassen und ihr Verhalten beobachten — Beobachtet wird, ob Zielnutzer ihre Aufgabe unter passenden Bedingungen bewältigen."},{"id":"train-SKY-047","lesson_id":"2.7","number":24,"type":"Übungskarte","displayFront":"Wer betreibt bei SaaS typischerweise die Anwendung?","answer":"Der Anbieter — SaaS liefert eine nutzbare Anwendung; der Kunde bleibt für seinen angemessenen Umgang und seine Konfiguration verantwortlich."},{"id":"train-SKY-049","lesson_id":"2.8","number":25,"type":"Übungskarte","displayFront":"Was gehört typischerweise zum Grob-Design?","answer":"Hauptkomponenten und ihre Verantwortlichkeiten — Das Grob-Design beschreibt die Gesamtstruktur; das Fein-Design konkretisiert Details."},{"id":"train-SKY-050","lesson_id":"2.8","number":26,"type":"Übungskarte","displayFront":"Welche Kombination ist als Entwurfsziel meist sinnvoll?","answer":"Hohe Kohäsion und geringe Kopplung — Zusammengehöriges liegt im selben Modul, während Abhängigkeiten zwischen Modulen begrenzt werden."},{"id":"train-SKY-051","lesson_id":"2.8","number":27,"type":"Übungskarte","displayFront":"Was zeigt ein Sequenzdiagramm besonders gut?","answer":"Die zeitliche Folge von Nachrichten zwischen Beteiligten — Es eignet sich beispielsweise zur Darstellung eines API-Aufrufs über Controller, Service und Repository."},{"id":"train-SKY-053","lesson_id":"2.9","number":28,"type":"Übungskarte","displayFront":"Wie wird eine m:n-Beziehung im relationalen Modell typischerweise umgesetzt?","answer":"Durch eine Zwischentabelle mit Fremdschlüsseln — Die Zwischentabelle kann zusätzlich Attribute der Beziehung enthalten."},{"id":"train-SKY-054","lesson_id":"2.9","number":29,"type":"Übungskarte","displayFront":"Was verletzt die zweite Normalform bei zusammengesetztem Schlüssel?","answer":"Ein Nicht-Schlüsselattribut hängt nur von einem Teil des Schlüssels ab — Partielle Abhängigkeiten werden in eigene Tabellen ausgelagert."},{"id":"train-SKY-055","lesson_id":"2.9","number":30,"type":"Übungskarte","displayFront":"Welche Abhängigkeit soll bei der dritten Normalform vermieden werden?","answer":"Eine transitive Abhängigkeit eines Nicht-Schlüsselattributs vom Schlüssel über ein anderes Nicht-Schlüsselattribut — Die Auslagerung transitiv abhängiger Daten verringert Änderungsanomalien."},{"id":"train-M02-ZUSATZ-01","lesson_id":"2.9","number":31,"type":"Übungskarte","displayFront":"Ein Kunde hat mehrere Bestellungen. Jede Bestellung gehört genau einem Kunden. Welche Kardinalität gilt?","answer":"1:n — Ein Kunde steht mit vielen Bestellungen in Beziehung: 1:n."},{"id":"train-M02-ZUSATZ-02","lesson_id":"2.9","number":32,"type":"Übungskarte","displayFront":"Ein Artikel kann in vielen Bestellungen vorkommen, eine Bestellung enthält mehrere Artikel. Welche Beziehung besteht zunächst?","answer":"m:n — Beide Seiten können mehrere Beziehungen haben. Relational löst man das über Bestellpositionen."},{"id":"train-M02-ZUSATZ-03","lesson_id":"2.9","number":33,"type":"Übungskarte","displayFront":"Wofür wird ein Fremdschlüssel verwendet?","answer":"Eine andere Tabelle referenzieren — Ein Fremdschlüssel stellt die Verbindung zu einem Primär- oder eindeutigen Schlüssel her."},{"id":"train-M02-ZUSATZ-04","lesson_id":"2.9","number":34,"type":"Übungskarte","displayFront":"Welche Spalte eignet sich als Primärschlüssel für eine Kundentabelle?","answer":"Eine eindeutige Kunden-ID — Ein Primärschlüssel muss jede Zeile eindeutig identifizieren."},{"id":"train-M02-ZUSATZ-05","lesson_id":"2.9","number":35,"type":"Übungskarte","displayFront":"Ein Feld enthält „Rot, Blau, Grün“ als Liste. Welche Normalform ist dadurch verletzt?","answer":"1NF — Die 1NF verlangt atomare Werte statt mehrwertiger Listen in einem Feld."},{"id":"train-M02-ZUSATZ-06","lesson_id":"2.9","number":36,"type":"Übungskarte","displayFront":"Bei einer m:n-Beziehung zwischen Artikel und Bestellung: Wohin gehören die Fremdschlüssel?","answer":"In eine Zwischentabelle — Eine Tabelle Bestellposition kann Bestellung_ID und Artikel_ID enthalten."},{"id":"train-M02-ZUSATZ-07","lesson_id":"2.9","number":37,"type":"Übungskarte","displayFront":"Eine Mitarbeiterin hat genau einen Spind, jeder Spind genau eine Mitarbeiterin. Welche Kardinalität?","answer":"1:1 — Beide Seiten können sich jeweils nur einem Datensatz zuordnen: 1:1."},{"id":"train-M02-ZUSATZ-08","lesson_id":"2.9","number":38,"type":"Übungskarte","displayFront":"Wozu dient die Normalisierung hauptsächlich?","answer":"Redundanzen und Änderungsfehler reduzieren — Sauber getrennte Daten verringern Inkonsistenzen bei Änderungen."},{"id":"train-M02-ZUSATZ-09","lesson_id":"2.9","number":39,"type":"Übungskarte","displayFront":"In einer Bestellposition steht der Artikelname zusätzlich zur Artikel-ID. Wo sollte der Name normalerweise liegen?","answer":"In der Artikeltabelle — Artikelinformationen gehören zur Artikelentität; Positionen verweisen darauf."},{"id":"train-M02-ZUSATZ-10","lesson_id":"2.9","number":40,"type":"Übungskarte","displayFront":"Eine Bestellung besitzt mehrere Positionen. Jede Position gehört zu genau einer Bestellung. Was gilt?","answer":"Bestellung zu Position ist 1:n — Eine Bestellung hat viele Positionen, eine Position verweist auf eine Bestellung."},{"id":"train-SKY-057","lesson_id":"2.10","number":41,"type":"Übungskarte","displayFront":"Welchen wesentlichen Vorteil hat ein Parallelbetrieb?","answer":"Alt- und Neusystem können während der Umstellung verglichen werden — Parallelbetrieb verringert bestimmte Umstellungsrisiken, verursacht aber zusätzlichen Betrieb und Abstimmungsaufwand."},{"id":"train-SKY-058","lesson_id":"2.10","number":42,"type":"Übungskarte","displayFront":"Wofür steht ETL?","answer":"Extract, Transform, Load — Daten werden ausgelesen, an das Zielschema angepasst und geladen."},{"id":"train-SKY-059","lesson_id":"2.10","number":43,"type":"Übungskarte","displayFront":"Was ist korrektive Wartung?","answer":"Fehler beheben — Korrektive Wartung reagiert auf bestehende Fehler."},{"id":"train-SKY-061","lesson_id":"2.11","number":44,"type":"Übungskarte","displayFront":"Woran erkennt man eine gute Architekturbegründung in einer Fallaufgabe?","answer":"Sie verbindet Anforderung, Entscheidung und konkrete Folgen — Begründungen müssen auf die Ausgangssituation eingehen und Abwägungen sichtbar machen."},{"id":"train-SKY-062","lesson_id":"2.11","number":45,"type":"Übungskarte","displayFront":"Was gehört in eine nachvollziehbare Softwareauswahl?","answer":"Kriterien, Gewichtung, Bewertung und begründete Empfehlung — Die Entscheidung muss aus den Anforderungen und den Vergleichsergebnissen ableitbar sein."},{"id":"train-SKY-063","lesson_id":"2.11","number":46,"type":"Übungskarte","displayFront":"Warum müssen Migration und Wartung schon in der Planung berücksichtigt werden?","answer":"Weil Einführung und Betrieb die Architektur und Kosten beeinflussen — Eine technisch passende Entwicklung muss auch sicher eingeführt und betreut werden können."},{"id":"train-SKY-065","lesson_id":"2.12","number":47,"type":"Übungskarte","displayFront":"Was sollte vor einem Anforderungsinterview vorbereitet werden?","answer":"Ziel, Gesprächspartner und ein offener Leitfaden — Die Vorbereitung richtet das Interview auf relevante Informationen aus."},{"id":"train-SKY-066","lesson_id":"2.12","number":48,"type":"Übungskarte","displayFront":"Wie gehst du mit widersprüchlichen Aussagen zweier Stakeholder um?","answer":"Widerspruch dokumentieren und mit den Beteiligten klären — Widersprüche müssen transparent geklärt und Entscheidungen nachvollziehbar festgehalten werden."},{"id":"train-SKY-067","lesson_id":"2.12","number":49,"type":"Übungskarte","displayFront":"Was macht eine ermittelte Anforderung besser nachverfolgbar?","answer":"Eindeutige Kennung, Quelle und prüfbare Beschreibung — Kennung und Quelle erleichtern Rückfragen sowie spätere Verknüpfungen zu Umsetzung und Tests."},{"id":"train-SKY-005","lesson_id":"1.1","number":1,"type":"Übungskarte","displayFront":"Welche Reihenfolge gehört zur SQ3R-Methode?","answer":"Survey, Question, Read, Recite, Review — Erst verschafft man sich einen Überblick und formuliert Fragen, danach liest, erinnert und wiederholt man."},{"id":"train-SKY-006","lesson_id":"1.1","number":2,"type":"Übungskarte","displayFront":"Was ist das Grundprinzip von Spaced Repetition?","answer":"Wissen in zeitlich verteilten Abständen wiederholen — Zeitlich verteiltes Abrufen unterstützt langfristiges Behalten."},{"id":"train-SKY-007","lesson_id":"1.1","number":3,"type":"Übungskarte","displayFront":"Wozu dient die Zusammenfassung in Cornell-Notizen?","answer":"Die Kernaussagen in eigenen Worten verdichten — Cornell verbindet Notizen, Stichworte beziehungsweise Fragen und eine kurze Zusammenfassung."},{"id":"train-SKY-009","lesson_id":"1.2","number":1,"type":"Übungskarte","displayFront":"Wofür steht das P in der ALPEN-Methode?","answer":"Pufferzeiten einplanen — Ungeplante Aufgaben brauchen realistische Zeitreserven."},{"id":"train-SKY-010","lesson_id":"1.2","number":2,"type":"Übungskarte","displayFront":"Wie behandelt man eine wichtige, aber nicht dringende Lernaufgabe?","answer":"Einen festen Termin dafür planen — Wichtige Aufgaben ohne Zeitdruck gehören in die bewusste Planung."},{"id":"train-SKY-011","lesson_id":"1.2","number":3,"type":"Übungskarte","displayFront":"Welche Tuckman-Phase beschreibt Konflikte und Rollenklärung?","answer":"Storming — Im Storming werden Spannungen sichtbar und die Zusammenarbeit muss geklärt werden."},{"id":"train-SKY-013","lesson_id":"1.3","number":1,"type":"Übungskarte","displayFront":"Wie wählst du Lernmedien sinnvoll aus?","answer":"Nach Lernziel, Aufgabe und eigener Nutzbarkeit — Ein Diagramm, ein Text und eine praktische Aufgabe erfüllen unterschiedliche Lernzwecke."},{"id":"train-SKY-014","lesson_id":"1.3","number":2,"type":"Übungskarte","displayFront":"Welche Aktivität zeigt eher, ob du einen Begriff verstanden hast?","answer":"Ihn ohne Vorlage mit einem eigenen Beispiel erklären — Eigenständiges Erklären prüft das Abrufen und den Transfer."},{"id":"train-SKY-015","lesson_id":"1.3","number":3,"type":"Übungskarte","displayFront":"Was ist nach dem Lesen eines Fachtexts besonders lernwirksam?","answer":"Die Kernaussagen ohne Vorlage rekonstruieren — Aktives Abrufen macht Wissenslücken sichtbar."},{"id":"train-SKY-069","lesson_id":"3.1","number":1,"type":"Übungskarte","displayFront":"Welche HTTP-Methode ist üblicherweise für das Anlegen einer Ressource vorgesehen?","answer":"POST — POST wird häufig für das Erstellen verwendet; der genaue Vertrag wird dokumentiert."},{"id":"train-SKY-070","lesson_id":"3.1","number":2,"type":"Übungskarte","displayFront":"Welcher Status passt üblicherweise zu einer erfolgreich neu angelegten Ressource?","answer":"201 Created — 201 zeigt eine erfolgreiche Erstellung an und kann um die Adresse der Ressource ergänzt werden."},{"id":"train-SKY-071","lesson_id":"3.1","number":3,"type":"Übungskarte","displayFront":"Was bedeutet Contract-First?","answer":"Den Schnittstellenvertrag vor der Implementierung festlegen — Ein abgestimmter API-Vertrag erlaubt unabhängige Implementierung und frühe Vertragstests."},{"id":"train-SKY-073","lesson_id":"3.2","number":1,"type":"Übungskarte","displayFront":"Welche Aufgabe passt typischerweise in Middleware?","answer":"Querschnittliche Verarbeitung wie Authentifizierung oder Request-Logging — Middleware bearbeitet wiederkehrende Aspekte des Anfragewegs."},{"id":"train-SKY-074","lesson_id":"3.2","number":2,"type":"Übungskarte","displayFront":"Was unterscheidet einen Mock besonders von einem einfachen Stub?","answer":"Mit einem Mock können erwartete Interaktionen geprüft werden — Ein Stub liefert vordefinierte Antworten, während ein Mock auch Erwartungen an Aufrufe überprüft."},{"id":"train-SKY-075","lesson_id":"3.2","number":3,"type":"Übungskarte","displayFront":"Was überprüft ein Integrationstest vor allem?","answer":"Das Zusammenspiel mehrerer realer Komponenten — Ein Beispiel ist das Zusammenspiel von Repository und Testdatenbank."},{"id":"train-SKY-077","lesson_id":"3.3","number":1,"type":"Übungskarte","displayFront":"Wofür steht Atomicity bei einer Transaktion?","answer":"Alle zugehörigen Änderungen erfolgen gemeinsam oder gar nicht — Atomicity verhindert unvollständige Buchungen bei einem Abbruch."},{"id":"train-SKY-078","lesson_id":"3.3","number":2,"type":"Übungskarte","displayFront":"Welche Rechte sollte ein Anwendungskonto erhalten?","answer":"Nur die für seine Aufgaben benötigten Rechte — Minimale Rechte begrenzen die Folgen von Fehlern und kompromittierten Konten."},{"id":"train-SKY-079","lesson_id":"3.3","number":3,"type":"Übungskarte","displayFront":"Was hilft ein Ausführungsplan zu erkennen?","answer":"Wie das DBMS eine Abfrage ausführt und wo Aufwand entsteht — Pläne zeigen beispielsweise Scans, Indexnutzung und Join-Verfahren."},{"id":"train-SKY-081","lesson_id":"3.4","number":1,"type":"Übungskarte","displayFront":"Was beschreibt das N+1-Problem?","answer":"Eine Grundabfrage löst für N Datensätze jeweils weitere Einzelabfragen aus — Batch-Abfragen, gezieltes Laden oder passende Joins können die Anzahl der Abfragen reduzieren."},{"id":"train-SKY-082","lesson_id":"3.4","number":2,"type":"Übungskarte","displayFront":"Warum trennt man ein DTO vom Datenbankmodell?","answer":"API-Vertrag und Persistenzmodell können unabhängig gestaltet werden — Die Trennung verhindert unter anderem unbeabsichtigtes Offenlegen interner Daten."},{"id":"train-SKY-083","lesson_id":"3.4","number":3,"type":"Übungskarte","displayFront":"Welchen Zweck hat Connection Pooling?","answer":"Datenbankverbindungen begrenzt wiederverwenden — Ein Pool reduziert Verbindungsaufbau und begrenzt gleichzeitig Ressourcenverbrauch."},{"id":"train-SKY-085","lesson_id":"3.5","number":1,"type":"Übungskarte","displayFront":"Was fordert das Single Responsibility Principle?","answer":"Eine klar abgegrenzte Verantwortung beziehungsweise einen maßgeblichen Änderungsgrund — Verantwortlichkeiten werden getrennt, damit unabhängige Änderungen nicht unnötig gekoppelt sind."},{"id":"train-SKY-086","lesson_id":"3.5","number":2,"type":"Übungskarte","displayFront":"Welche Reihenfolge beschreibt TDD?","answer":"Red, Green, Refactor — Zuerst ein fehlschlagender Test, dann die minimale Umsetzung, danach Verbesserung bei grünen Tests."},{"id":"train-SKY-087","lesson_id":"3.5","number":3,"type":"Übungskarte","displayFront":"Wofür steht Then in Given-When-Then?","answer":"Das erwartete Ergebnis — Given beschreibt Voraussetzungen, When die Aktion und Then die erwartete Beobachtung."},{"id":"train-SKY-089","lesson_id":"3.6","number":1,"type":"Übungskarte","displayFront":"Wann passt das Strategy-Muster besonders?","answer":"Wenn austauschbare Varianten eines Algorithmus benötigt werden — Die Strategie kapselt Varianten hinter einer gemeinsamen Schnittstelle."},{"id":"train-SKY-090","lesson_id":"3.6","number":2,"type":"Übungskarte","displayFront":"Welche Beziehung beschreibt das Observer-Muster?","answer":"Abonnenten werden über Zustandsänderungen eines beobachteten Objekts informiert — Observer unterstützt ereignisbezogene Benachrichtigungen."},{"id":"train-SKY-091","lesson_id":"3.6","number":3,"type":"Übungskarte","displayFront":"Welche Information zeigt ein UML-Klassendiagramm besonders gut?","answer":"Klassen, Attribute, Operationen und Beziehungen — Statische Struktur ist das Hauptanliegen des Klassendiagramms."},{"id":"train-SKY-093","lesson_id":"3.7","number":1,"type":"Übungskarte","displayFront":"Warum ist ein Rebase eines gemeinsam genutzten Branches abzustimmen?","answer":"Weil Commit-Historie umgeschrieben und andere Arbeit dadurch betroffen werden kann — Die geänderten Commit-Identitäten können bei anderen Arbeitskopien Konflikte verursachen."},{"id":"train-SKY-094","lesson_id":"3.7","number":2,"type":"Übungskarte","displayFront":"Was unterscheidet Continuous Deployment von Continuous Delivery?","answer":"Produktionsbereitstellung erfolgt automatisiert ohne manuelle Freigabestufe — Continuous Delivery hält auslieferbare Änderungen bereit, kann aber eine manuelle Freigabe vor Produktion enthalten."},{"id":"train-SKY-095","lesson_id":"3.7","number":3,"type":"Übungskarte","displayFront":"Wie sollten Pipeline-Secrets bereitgestellt werden?","answer":"Über dafür vorgesehene geschützte Secret-Verwaltung — Secrets müssen vor unbefugtem Zugriff und unbeabsichtigter Ausgabe geschützt werden."},{"id":"train-SKY-097","lesson_id":"3.8","number":1,"type":"Übungskarte","displayFront":"Welche Versionserhöhung signalisiert bei SemVer eine inkompatible Änderung der öffentlichen API?","answer":"Major — Eine inkompatible Änderung wird im MAJOR-Anteil sichtbar gemacht."},{"id":"train-SKY-098","lesson_id":"3.8","number":2,"type":"Übungskarte","displayFront":"Was ist der Hauptzweck von Release Notes?","answer":"Anwender über Änderungen und relevante Folgen eines Releases informieren — Release Notes beschreiben neue Funktione
