n multiplizieren und summieren — Vorab definierte Kriterien und eine konsistente Skala machen die Auswahl nachvollziehbar."},{"id":"train-SKY-037","lesson_id":"2.5","number":16,"type":"Übungskarte","displayFront":"Welche Kosten gehören zur TCO-Betrachtung?","answer":"Anschaffung, Einführung, Betrieb, Wartung und weitere Lebenszykluskosten — Eine günstige Anschaffung kann durch hohen Betriebs- oder Anpassungsaufwand teuer werden."},{"id":"train-SKY-038","lesson_id":"2.5","number":17,"type":"Übungskarte","displayFront":"Welches Ziel hat ein Proof of Concept vor allem?","answer":"Eine technische Machbarkeit prüfen — Ein PoC beantwortet eine begrenzte Machbarkeitsfrage."},{"id":"train-SKY-039","lesson_id":"2.5","number":18,"type":"Übungskarte","displayFront":"Welche Situation spricht eher für eine Eigenentwicklung?","answer":"Sehr spezifische Kernprozesse, die Standardprodukte schlecht abdecken — Die Entscheidung berücksichtigt fachliche Passung, Kosten, Risiken und vorhandene Fähigkeiten."},{"id":"train-SKY-041","lesson_id":"2.6","number":19,"type":"Übungskarte","displayFront":"Welche Frage beantwortet die Kontextabgrenzung?","answer":"Welche Nutzer und Nachbarsysteme mit dem System interagieren — Die Kontextsicht zeigt die Systemgrenze und externe Beziehungen."},{"id":"train-SKY-042","lesson_id":"2.6","number":20,"type":"Übungskarte","displayFront":"Was dokumentiert ein Architecture Decision Record?","answer":"Eine Architekturentscheidung mit Kontext, Alternativen und Folgen — Ein ADR macht Gründe und Konsequenzen einer Entscheidung später nachvollziehbar."},{"id":"train-SKY-043","lesson_id":"2.6","number":21,"type":"Übungskarte","displayFront":"Welche C4-Sicht zeigt Anwendungen und Datenspeicher innerhalb des betrachteten Systems?","answer":"Container-Sicht — Container bezeichnet im C4-Modell eigenständig ausführbare oder speichernde Einheiten und nicht ausschließlich Docker-Container."},{"id":"train-SKY-045","lesson_id":"2.7","number":22,"type":"Übungskarte","displayFront":"Was eignet sich zur frühen Prüfung eines Bildschirmablaufs?","answer":"Ein einfacher Papierprototyp — Niedrige Fidelity ermöglicht frühes Feedback bei geringem Änderungsaufwand."},{"id":"train-SKY-046","lesson_id":"2.7","number":23,"type":"Übungskarte","displayFront":"Was ist im Usability-Test besonders wichtig?","answer":"Nutzer reale Aufgaben bearbeiten lassen und ihr Verhalten beobachten — Beobachtet wird, ob Zielnutzer ihre Aufgabe unter passenden Bedingungen bewältigen."},{"id":"train-SKY-047","lesson_id":"2.7","number":24,"type":"Übungskarte","displayFront":"Wer betreibt bei SaaS typischerweise die Anwendung?","answer":"Der Anbieter — SaaS liefert eine nutzbare Anwendung; der Kunde bleibt für seinen angemessenen Umgang und seine Konfiguration verantwortlich."},{"id":"train-SKY-049","lesson_id":"2.8","number":25,"type":"Übungskarte","displayFront":"Was gehört typischerweise zum Grob-Design?","answer":"Hauptkomponenten und ihre Verantwortlichkeiten — Das Grob-Design beschreibt die Gesamtstruktur; das Fein-Design konkretisiert Details."},{"id":"train-SKY-050","lesson_id":"2.8","number":26,"type":"Übungskarte","displayFront":"Welche Kombination ist als Entwurfsziel meist sinnvoll?","answer":"Hohe Kohäsion und geringe Kopplung — Zusammengehöriges liegt im selben Modul, während Abhängigkeiten zwischen Modulen begrenzt werden."},{"id":"train-SKY-051","lesson_id":"2.8","number":27,"type":"Übungskarte","displayFront":"Was zeigt ein Sequenzdiagramm besonders gut?","answer":"Die zeitliche Folge von Nachrichten zwischen Beteiligten — Es eignet sich beispielsweise zur Darstellung eines API-Aufrufs über Controller, Service und Repository."},{"id":"train-SKY-053","lesson_id":"2.9","number":28,"type":"Übungskarte","displayFront":"Wie wird eine m:n-Beziehung im relationalen Modell typischerweise umgesetzt?","answer":"Durch eine Zwischentabelle mit Fremdschlüsseln — Die Zwischentabelle kann zusätzlich Attribute der Beziehung enthalten."},{"id":"train-SKY-054","lesson_id":"2.9","number":29,"type":"Übungskarte","displayFront":"Was verletzt die zweite Normalform bei zusammengesetztem Schlüssel?","answer":"Ein Nicht-Schlüsselattribut hängt nur von einem Teil des Schlüssels ab — Partielle Abhängigkeiten werden in eigene Tabellen ausgelagert."},{"id":"train-SKY-055","lesson_id":"2.9","number":30,"type":"Übungskarte","displayFront":"Welche Abhängigkeit soll bei der dritten Normalform vermieden werden?","answer":"Eine transitive Abhängigkeit eines Nicht-Schlüsselattributs vom Schlüssel über ein anderes Nicht-Schlüsselattribut — Die Auslagerung transitiv abhängiger Daten verringert Änderungsanomalien."},{"id":"train-M02-ZUSATZ-01","lesson_id":"2.9","number":31,"type":"Übungskarte","displayFront":"Ein Kunde hat mehrere Bestellungen. Jede Bestellung gehört genau einem Kunden. Welche Kardinalität gilt?","answer":"1:n — Ein Kunde steht mit vielen Bestellungen in Beziehung: 1:n."},{"id":"train-M02-ZUSATZ-02","lesson_id":"2.9","number":32,"type":"Übungskarte","displayFront":"Ein Artikel kann in vielen Bestellungen vorkommen, eine Bestellung enthält mehrere Artikel. Welche Beziehung besteht zunächst?","answer":"m:n — Beide Seiten können mehrere Beziehungen haben. Relational löst man das über Bestellpositionen."},{"id":"train-M02-ZUSATZ-03","lesson_id":"2.9","number":33,"type":"Übungskarte","displayFront":"Wofür wird ein Fremdschlüssel verwendet?","answer":"Eine andere Tabelle referenzieren — Ein Fremdschlüssel stellt die Verbindung zu einem Primär- oder eindeutigen Schlüssel her."},{"id":"train-M02-ZUSATZ-04","lesson_id":"2.9","number":34,"type":"Übungskarte","displayFront":"Welche Spalte eignet sich als Primärschlüssel für eine Kundentabelle?","answer":"Eine eindeutige Kunden-ID — Ein Primärschlüssel muss jede Zeile eindeutig identifizieren."},{"id":"train-M02-ZUSATZ-05","lesson_id":"2.9","number":35,"type":"Übungskarte","displayFront":"Ein Feld enthält „Rot, Blau, Grün“ als Liste. Welche Normalform ist dadurch verletzt?","answer":"1NF — Die 1NF verlangt atomare Werte statt mehrwertiger Listen in einem Feld."},{"id":"train-M02-ZUSATZ-06","lesson_id":"2.9","number":36,"type":"Übungskarte","displayFront":"Bei einer m:n-Beziehung zwischen Artikel und Bestellung: Wohin gehören die Fremdschlüssel?","answer":"In eine Zwischentabelle — Eine Tabelle Bestellposition kann Bestellung_ID und Artikel_ID enthalten."},{"id":"train-M02-ZUSATZ-07","lesson_id":"2.9","number":37,"type":"Übungskarte","displayFront":"Eine Mitarbeiterin hat genau einen Spind, jeder Spind genau eine Mitarbeiterin. Welche Kardinalität?","answer":"1:1 — Beide Seiten können sich jeweils nur einem Datensatz zuordnen: 1:1."},{"id":"train-M02-ZUSATZ-08","lesson_id":"2.9","number":38,"type":"Übungskarte","displayFront":"Wozu dient die Normalisierung hauptsächlich?","answer":"Redundanzen und Änderungsfehler reduzieren — Sauber getrennte Daten verringern Inkonsistenzen bei Änderungen."},{"id":"train-M02-ZUSATZ-09","lesson_id":"2.9","number":39,"type":"Übungskarte","displayFront":"In einer Bestellposition steht der Artikelname zusätzlich zur Artikel-ID. Wo sollte der Name normalerweise liegen?","answer":"In der Artikeltabelle — Artikelinformationen gehören zur Artikelentität; Positionen verweisen darauf."},{"id":"train-M02-ZUSATZ-10","lesson_id":"2.9","number":40,"type":"Übungskarte","displayFront":"Eine Bestellung besitzt mehrere Positionen. Jede Position gehört zu genau einer Bestellung. Was gilt?","answer":"Bestellung zu Position ist 1:n — Eine Bestellung hat viele Positionen, eine Position verweist auf eine Bestellung."},{"id":"train-SKY-057","lesson_id":"2.10","number":41,"type":"Übungskarte","displayFront":"Welchen wesentlichen Vorteil hat ein Parallelbetrieb?","answer":"Alt- und Neusystem können während der Umstellung verglichen werden — Parallelbetrieb verringert bestimmte Umstellungsrisiken, verursacht aber zusätzlichen Betrieb und Abstimmungsaufwand."},{"id":"train-SKY-058","lesson_id":"2.10","number":42,"type":"Übungskarte","displayFront":"Wofür steht ETL?","answer":"Extract, Transform, Load — Daten werden ausgelesen, an das Zielschema angepasst und geladen."},{"id":"train-SKY-059","lesson_id":"2.10","number":43,"type":"Übungskarte","displayFront":"Was ist korrektive Wartung?","answer":"Fehler beheben — Korrektive Wartung reagiert auf bestehende Fehler."},{"id":"train-SKY-061","lesson_id":"2.11","number":44,"type":"Übungskarte","displayFront":"Woran erkennt man eine gute Architekturbegründung in einer Fallaufgabe?","answer":"Sie verbindet Anforderung, Entscheidung und konkrete Folgen — Begründungen müssen auf die Ausgangssituation eingehen und Abwägungen sichtbar machen."},{"id":"train-SKY-062","lesson_id":"2.11","number":45,"type":"Übungskarte","displayFront":"Was gehört in eine nachvollziehbare Softwareauswahl?","answer":"Kriterien, Gewichtung, Bewertung und begründete Empfehlung — Die Entscheidung muss aus den Anforderungen und den Vergleichsergebnissen ableitbar sein."},{"id":"train-SKY-063","lesson_id":"2.11","number":46,"type":"Übungskarte","displayFront":"Warum müssen Migration und Wartung schon in der Planung berücksichtigt werden?","answer":"Weil Einführung und Betrieb die Architektur und Kosten beeinflussen — Eine technisch passende Entwicklung muss auch sicher eingeführt und betreut werden können."},{"id":"train-SKY-065","lesson_id":"2.12","number":47,"type":"Übungskarte","displayFront":"Was sollte vor einem Anforderungsinterview vorbereitet werden?","answer":"Ziel, Gesprächspartner und ein offener Leitfaden — Die Vorbereitung richtet das Interview auf relevante Informationen aus."},{"id":"train-SKY-066","lesson_id":"2.12","number":48,"type":"Übungskarte","displayFront":"Wie gehst du mit widersprüchlichen Aussagen zweier Stakeholder um?","answer":"Widerspruch dokumentieren und mit den Beteiligten klären — Widersprüche müssen transparent geklärt und Entscheidungen nachvollziehbar festgehalten werden."},{"id":"train-SKY-067","lesson_id":"2.12","number":49,"type":"Übungskarte","displayFront":"Was macht eine ermittelte Anforderung besser nachverfolgbar?","answer":"Eindeutige Kennung, Quelle und prüfbare Beschreibung — Kennung und Quelle erleichtern Rückfragen sowie spätere Verknüpfungen zu Umsetzung und Tests."},{"id":"train-SKY-005","lesson_id":"1.1","number":1,"type":"Übungskarte","displayFront":"Welche Reihenfolge gehört zur SQ3R-Methode?","answer":"Survey, Question, Read, Recite, Review — Erst verschafft man sich einen Überblick und formuliert Fragen, danach liest, erinnert und wiederholt man."},{"id":"train-SKY-006","lesson_id":"1.1","number":2,"type":"Übungskarte","displayFront":"Was ist das Grundprinzip von Spaced Repetition?","answer":"Wissen in zeitlich verteilten Abständen wiederholen — Zeitlich verteiltes Abrufen unterstützt langfristiges Behalten."},{"id":"train-SKY-007","lesson_id":"1.1","number":3,"type":"Übungskarte","displayFront":"Wozu dient die Zusammenfassung in Cornell-Notizen?","answer":"Die Kernaussagen in eigenen Worten verdichten — Cornell verbindet Notizen, Stichworte beziehungsweise Fragen und eine kurze Zusammenfassung."},{"id":"train-SKY-009","lesson_id":"1.2","number":1,"type":"Übungskarte","displayFront":"Wofür steht das P in der ALPEN-Methode?","answer":"Pufferzeiten einplanen — Ungeplante Aufgaben brauchen realistische Zeitreserven."},{"id":"train-SKY-010","lesson_id":"1.2","number":2,"type":"Übungskarte","displayFront":"Wie behandelt man eine wichtige, aber nicht dringende Lernaufgabe?","answer":"Einen festen Termin dafür planen — Wichtige Aufgaben ohne Zeitdruck gehören in die bewusste Planung."},{"id":"train-SKY-011","lesson_id":"1.2","number":3,"type":"Übungskarte","displayFront":"Welche Tuckman-Phase beschreibt Konflikte und Rollenklärung?","answer":"Storming — Im Storming werden Spannungen sichtbar und die Zusammenarbeit muss geklärt werden."},{"id":"train-SKY-013","lesson_id":"1.3","number":1,"type":"Übungskarte","displayFront":"Wie wählst du Lernmedien sinnvoll aus?","answer":"Nach Lernziel, Aufgabe und eigener Nutzbarkeit — Ein Diagramm, ein Text und eine praktische Aufgabe erfüllen unterschiedliche Lernzwecke."},{"id":"train-SKY-014","lesson_id":"1.3","number":2,"type":"Übungskarte","displayFront":"Welche Aktivität zeigt eher, ob du einen Begriff verstanden hast?","answer":"Ihn ohne Vorlage mit einem eigenen Beispiel erklären — Eigenständiges Erklären prüft das Abrufen und den Transfer."},{"id":"train-SKY-015","lesson_id":"1.3","number":3,"type":"Übungskarte","displayFront":"Was ist nach dem Lesen eines Fachtexts besonders lernwirksam?","answer":"Die Kernaussagen ohne Vorlage rekonstruieren — Aktives Abrufen macht Wissenslücken sichtbar."},{"id":"train-SKY-069","lesson_id":"3.1","number":1,"type":"Übungskarte","displayFront":"Welche HTTP-Methode ist üblicherweise für das Anlegen einer Ressource vorgesehen?","answer":"POST — POST wird häufig für das Erstellen verwendet; der genaue Vertrag wird dokumentiert."},{"id":"train-SKY-070","lesson_id":"3.1","number":2,"type":"Übungskarte","displayFront":"Welcher Status passt üblicherweise zu einer erfolgreich neu angelegten Ressource?","answer":"201 Created — 201 zeigt eine erfolgreiche Erstellung an und kann um die Adresse der Ressource ergänzt werden."},{"id":"train-SKY-071","lesson_id":"3.1","number":3,"type":"Übungskarte","displayFront":"Was bedeutet Contract-First?","answer":"Den Schnittstellenvertrag vor der Implementierung festlegen — Ein abgestimmter API-Vertrag erlaubt unabhängige Implementierung und frühe Vertragstests."},{"id":"train-SKY-073","lesson_id":"3.2","number":1,"type":"Übungskarte","displayFront":"Welche Aufgabe passt typischerweise in Middleware?","answer":"Querschnittliche Verarbeitung wie Authentifizierung oder Request-Logging — Middleware bearbeitet wiederkehrende Aspekte des Anfragewegs."},{"id":"train-SKY-074","lesson_id":"3.2","number":2,"type":"Übungskarte","displayFront":"Was unterscheidet einen Mock besonders von einem einfachen Stub?","answer":"Mit einem Mock können erwartete Interaktionen geprüft werden — Ein Stub liefert vordefinierte Antworten, während ein Mock auch Erwartungen an Aufrufe überprüft."},{"id":"train-SKY-075","lesson_id":"3.2","number":3,"type":"Übungskarte","displayFront":"Was überprüft ein Integrationstest vor allem?","answer":"Das Zusammenspiel mehrerer realer Komponenten — Ein Beispiel ist das Zusammenspiel von Repository und Testdatenbank."},{"id":"train-SKY-077","lesson_id":"3.3","number":1,"type":"Übungskarte","displayFront":"Wofür steht Atomicity bei einer Transaktion?","answer":"Alle zugehörigen Änderungen erfolgen gemeinsam oder gar nicht — Atomicity verhindert unvollständige Buchungen bei einem Abbruch."},{"id":"train-SKY-078","lesson_id":"3.3","number":2,"type":"Übungskarte","displayFront":"Welche Rechte sollte ein Anwendungskonto erhalten?","answer":"Nur die für seine Aufgaben benötigten Rechte — Minimale Rechte begrenzen die Folgen von Fehlern und kompromittierten Konten."},{"id":"train-SKY-079","lesson_id":"3.3","number":3,"type":"Übungskarte","displayFront":"Was hilft ein Ausführungsplan zu erkennen?","answer":"Wie das DBMS eine Abfrage ausführt und wo Aufwand entsteht — Pläne zeigen beispielsweise Scans, Indexnutzung und Join-Verfahren."},{"id":"train-SKY-081","lesson_id":"3.4","number":1,"type":"Übungskarte","displayFront":"Was beschreibt das N+1-Problem?","answer":"Eine Grundabfrage löst für N Datensätze jeweils weitere Einzelabfragen aus — Batch-Abfragen, gezieltes Laden oder passende Joins können die Anzahl der Abfragen reduzieren."},{"id":"train-SKY-082","lesson_id":"3.4","number":2,"type":"Übungskarte","displayFront":"Warum trennt man ein DTO vom Datenbankmodell?","answer":"API-Vertrag und Persistenzmodell können unabhängig gestaltet werden — Die Trennung verhindert unter anderem unbeabsichtigtes Offenlegen interner Daten."},{"id":"train-SKY-083","lesson_id":"3.4","number":3,"type":"Übungskarte","displayFront":"Welchen Zweck hat Connection Pooling?","answer":"Datenbankverbindungen begrenzt wiederverwenden — Ein Pool reduziert Verbindungsaufbau und begrenzt gleichzeitig Ressourcenverbrauch."},{"id":"train-SKY-085","lesson_id":"3.5","number":1,"type":"Übungskarte","displayFront":"Was fordert das Single Responsibility Principle?","answer":"Eine klar abgegrenzte Verantwortung beziehungsweise einen maßgeblichen Änderungsgrund — Verantwortlichkeiten werden getrennt, damit unabhängige Änderungen nicht unnötig gekoppelt sind."},{"id":"train-SKY-086","lesson_id":"3.5","number":2,"type":"Übungskarte","displayFront":"Welche Reihenfolge beschreibt TDD?","answer":"Red, Green, Refactor — Zuerst ein fehlschlagender Test, dann die minimale Umsetzung, danach Verbesserung bei grünen Tests."},{"id":"train-SKY-087","lesson_id":"3.5","number":3,"type":"Übungskarte","displayFront":"Wofür steht Then in Given-When-Then?","answer":"Das erwartete Ergebnis — Given beschreibt Voraussetzungen, When die Aktion und Then die erwartete Beobachtung."},{"id":"train-SKY-089","lesson_id":"3.6","number":1,"type":"Übungskarte","displayFront":"Wann passt das Strategy-Muster besonders?","answer":"Wenn austauschbare Varianten eines Algorithmus benötigt werden — Die Strategie kapselt Varianten hinter einer gemeinsamen Schnittstelle."},{"id":"train-SKY-090","lesson_id":"3.6","number":2,"type":"Übungskarte","displayFront":"Welche Beziehung beschreibt das Observer-Muster?","answer":"Abonnenten werden über Zustandsänderungen eines beobachteten Objekts informiert — Observer unterstützt ereignisbezogene Benachrichtigungen."},{"id":"train-SKY-091","lesson_id":"3.6","number":3,"type":"Übungskarte","displayFront":"Welche Information zeigt ein UML-Klassendiagramm besonders gut?","answer":"Klassen, Attribute, Operationen und Beziehungen — Statische Struktur ist das Hauptanliegen des Klassendiagramms."},{"id":"train-SKY-093","lesson_id":"3.7","number":1,"type":"Übungskarte","displayFront":"Warum ist ein Rebase eines gemeinsam genutzten Branches abzustimmen?","answer":"Weil Commit-Historie umgeschrieben und andere Arbeit dadurch betroffen werden kann — Die geänderten Commit-Identitäten können bei anderen Arbeitskopien Konflikte verursachen."},{"id":"train-SKY-094","lesson_id":"3.7","number":2,"type":"Übungskarte","displayFront":"Was unterscheidet Continuous Deployment von Continuous Delivery?","answer":"Produktionsbereitstellung erfolgt automatisiert ohne manuelle Freigabestufe — Continuous Delivery hält auslieferbare Änderungen bereit, kann aber eine manuelle Freigabe vor Produktion enthalten."},{"id":"train-SKY-095","lesson_id":"3.7","number":3,"type":"Übungskarte","displayFront":"Wie sollten Pipeline-Secrets bereitgestellt werden?","answer":"Über dafür vorgesehene geschützte Secret-Verwaltung — Secrets müssen vor unbefugtem Zugriff und unbeabsichtigter Ausgabe geschützt werden."},{"id":"train-SKY-097","lesson_id":"3.8","number":1,"type":"Übungskarte","displayFront":"Welche Versionserhöhung signalisiert bei SemVer eine inkompatible Änderung der öffentlichen API?","answer":"Major — Eine inkompatible Änderung wird im MAJOR-Anteil sichtbar gemacht."},{"id":"train-SKY-098","lesson_id":"3.8","number":2,"type":"Übungskarte","displayFront":"Was ist der Hauptzweck von Release Notes?","answer":"Anwender über Änderungen und relevante Folgen eines Releases informieren — Release Notes beschreiben neue Funktionen, Änderungen, bekannte Probleme und gegebenenfalls Umstellungshinweise."},{"id":"train-SKY-099","lesson_id":"3.8","number":3,"type":"Übungskarte","displayFront":"Wie unterstützt Blue-Green Deployment einen schnellen Wechsel?","answer":"Durch zwei Umgebungen, zwischen denen Verkehr umgeschaltet wird — Eine Umgebung kann geprüft werden, während die andere weiterhin bedient; Datenkompatibilität bleibt zu planen."},{"id":"train-SKY-101","lesson_id":"3.9","number":1,"type":"Übungskarte","displayFront":"Welche Maßnahme schützt SQL-Abfragen vor der Interpretation von Nutzereingaben als SQL-Code?","answer":"Parametrisierte Abfragen — Daten werden getrennt von der SQL-Struktur übergeben; ergänzend bleiben Rechte und Validierung wichtig."},{"id":"train-SKY-102","lesson_id":"3.9","number":2,"type":"Übungskarte","displayFront":"Welche Speicherung ist für Benutzerpasswörter vorgesehen?","answer":"Ein geeignetes langsames Passwort-Hashverfahren mit individuellem Salt — Ein Passwort-Hashverfahren erschwert das massenhafte Durchprobieren; ein Salt verhindert identische Hashes bei gleichen Passwörtern."},{"id":"train-SKY-103","lesson_id":"3.9","number":3,"type":"Übungskarte","displayFront":"Was muss vor dem Zugriff auf eine konkrete Lieferung geprüft werden?","answer":"Ob die anfragende Identität für genau diese Ressource berechtigt ist — Authentifizierung allein ersetzt keine ressourcenbezogene Autorisierung."},{"id":"train-SKY-105","lesson_id":"3.10","number":1,"type":"Übungskarte","displayFront":"Was sollte in einem Integrationsprojekt durchgängig verbunden sein?","answer":"Anforderungen, Entwurf, Umsetzung und Tests — Die Verbindung zeigt, dass die technische Lösung das fachliche Ziel erfüllt."},{"id":"train-SKY-106","lesson_id":"3.10","number":2,"type":"Übungskarte","displayFront":"Wozu dienen Checkpoints in einem Projekt?","answer":"Ergebnisse früh prüfen und Abweichungen rechtzeitig erkennen — Kurze Überprüfungen verhindern, dass große Fehler erst bei der Abschlusspräsentation auffallen."},{"id":"train-SKY-107","lesson_id":"3.10","number":3,"type":"Übungskarte","displayFront":"Welche Aussage ist eine belastbare technische Begründung?","answer":"Die Entscheidung erfüllt eine benannte Anforderung und ihre Nachteile werden bewertet — Eine gute Begründung enthält fachlichen Bezug und eine Abwägung."},{"id":"train-SKY-109","lesson_id":"3.11","number":1,"type":"Übungskarte","displayFront":"Was solltest du vor dem Schreiben einer Prüfungsantwort klären?","answer":"Operator, verlangte Anzahl und Fallbezug — Diese Vorgaben bestimmen Form und Tiefe der Antwort."},{"id":"train-SKY-110","lesson_id":"3.11","number":2,"type":"Übungskarte","displayFront":"Welche Struktur eignet sich für eine begründete Empfehlung?","answer":"Anforderung, Entscheidung, Nutzen und Nachteil beziehungsweise Gegenmaßnahme — Die Struktur macht die fachliche Herleitung nachvollziehbar."},{"id":"train-SKY-111","lesson_id":"3.11","number":3,"type":"Übungskarte","displayFront":"Wie hilft eine Zeitplanung bei mehreren Teilaufgaben?","answer":"Sie verteilt Zeit angemessen und verhindert das Festhalten an einer einzelnen Aufgabe — Arbeitszeit sollte sich an Umfang und erwarteter Bewertung orientieren."},{"id":"train-M04-01-Q1","lesson_id":"4.1","number":1,"type":"Übungskarte","displayFront":"Welches Qualitätsziel lässt sich am besten prüfen?","answer":"Bei definierter Last antworten 95 % der Suchanfragen in höchstens zwei Sekunden. — Die Aussage nennt einen überprüfbaren Zielwert und eine Bedingung."},{"id":"train-M04-01-Q2","lesson_id":"4.1","number":2,"type":"Übungskarte","displayFront":"Welche Maßnahme ist vor allem konstruktive Qualitätssicherung?","answer":"Verbindliche Implementierungsregeln für das Team vereinbaren. — Gemeinsame Regeln sollen Fehler bereits während der Entstehung vermeiden."},{"id":"train-M04-01-Q3","lesson_id":"4.1","number":3,"type":"Übungskarte","displayFront":"Warum reichen viele fehlerfreie Unit-Tests allein nicht für eine Qualitätsaussage?","answer":"Weitere Qualitätsziele und das Zusammenspiel des Systems müssen ebenfalls betrachtet werden. — Ein einzelner Testtyp deckt nicht alle Anforderungen und Nutzungssituationen ab."},{"id":"train-M04-02-Q1","lesson_id":"4.2","number":1,"type":"Übungskarte","displayFront":"Wozu dient eine Nachverfolgbarkeitsmatrix?","answer":"Sie verbindet Anforderungen mit zugehörigen Tests und Ergebnissen. — So werden Abdeckung und Auswirkungen von Änderungen nachvollziehbar."},{"id":"train-M04-02-Q2","lesson_id":"4.2","number":2,"type":"Übungskarte","displayFront":"Was ist ein sinnvoller Schwerpunkt eines Integrationstests?","answer":"Die Zusammenarbeit von API und Testdatenbank prüfen. — Integrationstests betrachten Schnittstellen und Zusammenarbeit mehrerer Komponenten."},{"id":"train-M04-02-Q3","lesson_id":"4.2","number":3,"type":"Übungskarte","displayFront":"Welche Information gehört in einen Testplan?","answer":"Testumfang, Risiken, Testumgebung und Abschlusskriterien. — Ein Plan macht Durchführung und Bewertung der Tests nachvollziehbar."},{"id":"train-M04-03-Q1","lesson_id":"4.3","number":1,"type":"Übungskarte","displayFront":"Welche Werte passen besonders zur Grenzwertanalyse für eine erlaubte Menge von 1 bis 20?","answer":"0, 1, 20 und 21 — Die Werte liegen an den Grenzen oder direkt außerhalb des erlaubten Bereichs."},{"id":"train-M04-03-Q2","lesson_id":"4.3","number":2,"type":"Übungskarte","displayFront":"Welche Angabe macht einen Testfall auswertbar?","answer":"Ein erwartetes, beobachtbares Ergebnis. — Erst ein vorab beschriebenes Soll-Ergebnis ermöglicht einen belastbaren Vergleich."},{"id":"train-M04-03-Q3","lesson_id":"4.3","number":3,"type":"Übungskarte","displayFront":"Wann ist eine Entscheidungstabelle besonders hilfreich?","answer":"Wenn mehrere Bedingungen gemeinsam ein fachliches Ergebnis bestimmen. — Tabellen helfen, Kombinationen systematisch und lückenbewusst zu betrachten."},{"id":"train-M04-04-Q1","lesson_id":"4.4","number":1,"type":"Übungskarte","displayFront":"Welche Eigenschaft unterstützt reproduzierbare Tests?","answer":"Ein dokumentierter Aufbau mit definiertem Ausgangszustand. — Ein kontrollierter Ausgangszustand macht Unterschiede und Fehler leichter erklärbar."},{"id":"train-M04-04-Q2","lesson_id":"4.4","number":2,"type":"Übungskarte","displayFront":"Welche Testdaten sind für eine allgemeine Testumgebung oft ein geeigneter Ausgangspunkt?","answer":"Passende synthetische Daten mit bekannten Eigenschaften. — Synthetische Daten können gezielt Fälle abdecken und unnötige Offenlegung echter Daten vermeiden."},{"id":"train-M04-04-Q3","lesson_id":"4.4","number":3,"type":"Übungskarte","displayFront":"Welcher Ablauf eignet sich besonders für Automatisierung?","answer":"Ein regelmäßig wiederholter, eindeutig auswertbarer Regressionstest. — Wiederholung und klare Erwartungen machen den Nutzen von Automatisierung gut erkennbar."},{"id":"train-M04-05-Q1","lesson_id":"4.5","number":1,"type":"Übungskarte","displayFront":"Welche Information hilft besonders beim Nachstellen eines Fehlers?","answer":"Eine genaue Schrittfolge mit Soll- und Ist-Ergebnis. — Reproduzierbare Schritte ermöglichen die gezielte Untersuchung."},{"id":"train-M04-05-Q2","lesson_id":"4.5","number":2,"type":"Übungskarte","displayFront":"Was beschreibt die Priorität eines Fehlers?","answer":"Die vereinbarte Dringlichkeit und Bearbeitungsreihenfolge. — Priorität berücksichtigt neben Auswirkungen auch zeitlichen und fachlichen Kontext."},{"id":"train-M04-05-Q3","lesson_id":"4.5","number":3,"type":"Übungskarte","displayFront":"Wozu dient eine Triage?","answer":"Fehler bewerten, klären und einer passenden Bearbeitung zuordnen. — Gemeinsame Einordnung unterstützt eine begründete Bearbeitungsreihenfolge."},{"id":"train-M04-06-Q1","lesson_id":"4.6","number":1,"type":"Übungskarte","displayFront":"Warum beweist eine hohe Codeabdeckung allein keine Fehlerfreiheit?","answer":"Weil ausgeführte Zeilen noch keine vollständigen Erwartungen und Fälle garantieren. — Abdeckung zeigt Ausführung, nicht automatisch die Güte aller Prüfungen."},{"id":"train-M04-06-Q2","lesson_id":"4.6","number":2,"type":"Übungskarte","displayFront":"Was gehört zu einer nachvollziehbaren Testempfehlung?","answer":"Ergebnisse, offener Umfang und verbleibende Risiken. — Die Entscheidung braucht den Kontext dessen, was geprüft wurde und was offen bleibt."},{"id":"train-M04-06-Q3","lesson_id":"4.6","number":3,"type":"Übungskarte","displayFront":"Wann ist eine Verbesserung überzeugend abgeschlossen?","answer":"Wenn ihre Wirkung anhand eines passenden Kriteriums überprüft wurde. — Eine überprüfte Wirkung schließt den Lernkreislauf besser als eine bloße Aufgabenliste."},{"id":"train-M05-01-Q1","lesson_id":"5.1","number":1,"type":"Übungskarte","displayFront":"Was sollte die Auswahl von Tiefe und Sprache einer Dokumentation besonders bestimmen?","answer":"Zielgruppe, Vorwissen und konkrete Aufgabe. — Informationen werden nützlich, wenn sie zur Leseraufgabe passen."},{"id":"train-M05-01-Q2","lesson_id":"5.1","number":2,"type":"Übungskarte","displayFront":"Welche Form passt zum schnellen Nachschlagen erlaubter API-Felder?","answer":"Eine strukturierte Referenz. — Eine Referenz stellt definierte Details zum gezielten Nachschlagen bereit."},{"id":"train-M05-01-Q3","lesson_id":"5.1","number":3,"type":"Übungskarte","displayFront":"Was ist ein typisches Ziel eines Tutorials?","answer":"Einen geführten ersten Lernerfolg ermöglichen. — Ein Tutorial unterstützt Lernen durch einen nachvollziehbaren Ablauf."},{"id":"train-M05-02-Q1","lesson_id":"5.2","number":1,"type":"Übungskarte","displayFront":"Was gehört zum Docs-as-Code-Ansatz?","answer":"Dokumentation versionieren, prüfen und gemeinsam ändern. — Der Ansatz nutzt bewährte Änderungs- und Prüfabläufe auch für Texte."},{"id":"train-M05-02-Q2","lesson_id":"5.2","number":2,"type":"Übungskarte","displayFront":"Welche Frage beantwortet ein guter ADR besonders?","answer":"Warum wurde diese Architekturentscheidung im gegebenen Kontext getroffen? — Der Entscheidungsgrund ist für spätere Änderungen oft wichtiger als nur das Ergebnis."},{"id":"train-M05-02-Q3","lesson_id":"5.2","number":3,"type":"Übungskarte","displayFront":"Wann sollte eine relevante Dokumentationsänderung geprüft werden?","answer":"Im passenden Änderungsprozess zusammen mit der betroffenen Funktion. — Gemeinsame Prüfung reduziert veraltete oder widersprüchliche Beschreibungen."},{"id":"train-M05-03-Q1","lesson_id":"5.3","number":1,"type":"Übungskarte","displayFront":"Welcher Kommentar liefert typischerweise zusätzlichen Nutzen?","answer":"Er erklärt eine nicht offensichtliche fachliche Entscheidung. — Ein guter Kommentar macht Absicht oder besondere Bedingungen verständlich."},{"id":"train-M05-03-Q2","lesson_id":"5.3","number":2,"type":"Übungskarte","displayFront":"Welche Information gehört in eine API-Beschreibung?","answer":"Eingaben, Antworten und relevante Fehlerfälle. — Clients benötigen einen vollständigen, nachvollziehbaren Vertrag."},{"id":"train-M05-03-Q3","lesson_id":"5.3","number":3,"type":"Übungskarte","displayFront":"Was macht eine Prozessbeschreibung besonders hilfreich?","answer":"Rollen, Schritte und Übergaben sind nachvollziehbar. — Die Beschreibung soll Zusammenarbeit und Verantwortlichkeiten erklären."},{"id":"train-M05-04-Q1","lesson_id":"5.4","number":1,"type":"Übungskarte","displayFront":"Welche Formulierung eignet sich für einen konkreten Handlungsschritt?","answer":"Wähle den Termin und tippe auf „Verschieben“. — Die Formulierung benennt eine beobachtbare, konkrete Handlung."},{"id":"train-M05-04-Q2","lesson_id":"5.4","number":2,"type":"Übungskarte","displayFront":"Was sollte eine Anleitung neben den Schritten erklären?","answer":"Voraussetzungen und das erwartete Ergebnis. — Voraussetzungen und Ergebnis helfen, den Ablauf richtig einzuordnen."},{"id":"train-M05-04-Q3","lesson_id":"5.4","number":3,"type":"Übungskarte","displayFront":"Was ist bei einem Screenshot besonders sinnvoll?","answer":"Eine passende Ansicht mit erforderlicher Erklärung und Versionsbezug verwenden. — Bilder ergänzen eine Anleitung nur, wenn sie zum beschriebenen Zustand passen."},{"id":"train-M05-05-Q1","lesson_id":"5.5","number":1,"type":"Übungskarte","displayFront":"Welche Schulungsaktivität unterstützt das Überprüfen des Verständnisses?","answer":"Einen Ablauf selbst durchführen und das Ergebnis besprechen. — Aktive Anwendung und Rückmeldung zeigen praktische Lücken."},{"id":"train-M05-05-Q2","lesson_id":"5.5","number":2,"type":"Übungskarte","displayFront":"Was hilft gegen eine veraltete Wissenssammlung?","answer":"Verantwortliche und regelmäßige oder ereignisbezogene Prüfung festlegen. — Pflege benötigt klare Verantwortung und erkennbare Auslöser."},{"id":"train-M05-05-Q3","lesson_id":"5.5","number":3,"type":"Übungskarte","displayFront":"Worin unterscheiden sich Unterlagen für Endnutzende und Multiplikatoren oft?","answer":"Multiplikatoren benötigen zusätzlich Hinweise zum Erklären und Begleiten von Übungen. — Die Rolle bestimmt, ob neben der Bedienung auch die Vermittlung unterstützt werden soll."},{"id":"train-M05-06-Q1","lesson_id":"5.6","number":1,"type":"Übungskarte","displayFront":"Welche Prüfung bewertet eine Anleitung besonders praxisnah?","answer":"Eine passende Person führt die beschriebene Aufgabe damit aus. — Die tatsächliche Nutzung zeigt Lücken, die beim reinen Lesen leicht übersehen werden."},{"id":"train-M05-06-Q2","lesson_id":"5.6","number":2,"type":"Übungskarte","displayFront":"Warum ist ein Versionsbezug wichtig?","answer":"Er zeigt, zu welchem Anwendungsstand die Beschreibung gehört. — Die Zuordnung verhindert, dass unterschiedliche Softwarestände verwechselt werden."},{"id":"train-M05-06-Q3","lesson_id":"5.6","number":3,"type":"Übungskarte","displayFront":"Welche automatisierte Dokumentationsprüfung ist sinnvoll?","answer":"Links und ausführbare Beispiele auf erwartetes Verhalten prüfen. — Automatische Prüfungen können konkrete technische Fehler zuverlässig sichtbar machen."},{"id":"card-public-M06-01-Q1","lesson_id":"6.1","number":1,"type":"Übungskarte","displayFront":"Was macht ein Abnahmekriterium prüfbar?","answer":"Eine beobachtbare Bedingung mit eindeutigem erwarteten Ergebnis. — Prüfende müssen feststellen können, ob die vereinbarte Bedingung erfüllt ist."},{"id":"card-public-M06-01-Q2","lesson_id":"6.1","number":2,"type":"Übungskarte","displayFront":"Welche Angabe verbindet einen Testnachweis mit der ausgelieferten Fassung?","answer":"Die eindeutig identifizierte Softwareversion. — Ohne Versionsbezug kann ein Ergebnis zu einer anderen Fassung gehören."},{"id":"card-public-M06-01-Q3","lesson_id":"6.1","number":3,"type":"Übungskarte","displayFront":"Wer sollte vor dem Abnahmetermin geklärt sein?","answer":"Die für Prüfung und Entscheidung zuständigen Beteiligten. — Prüfaufgaben und die Befugnis zur Entscheidung sind unterschiedliche Verantwortungen."},{"id":"card-public-M06-02-Q1","lesson_id":"6.2","number":1,"type":"Übungskarte","displayFront":"Was beschreibt einen Mangel nachvollziehbar?","answer":"Abweichung, Reproduktionsschritte und fachliche Auswirkung. — Sachliche Angaben ermöglichen Bewertung und Nachprüfung."},{"id":"card-public-M06-02-Q2","lesson_id":"6.2","number":2,"type":"Übungskarte","displayFront":"Welche Aussage passt zu § 640 BGB bei einem Werkvertrag?","answer":"Ein unwesentlicher Mangel allein rechtfertigt keine Abnahmeverweigerung. — Wesentlichkeit und Vertragsrahmen müssen berücksichtigt werden."},{"id":"card-public-M06-02-Q3","lesson_id":"6.2","number":3,"type":"Übungskarte","displayFront":"Was sollte mit einem vereinbarten Nachbesserungspunkt geschehen?","answer":"Verantwortliche, Termin und Art der Nachprüfung festhalten. — Ein Befund braucht einen überprüfbaren weiteren Bearbeitungsweg."},{"id":"card-public-M06-03-Q1","lesson_id":"6.3","number":1,"type":"Übungskarte","displayFront":"Was hilft, die Vollständigkeit eines Übergabepakets zu prüfen?","answer":"Eine auf Empfänger und Betrieb abgestimmte Checkliste. — Eine Checkliste macht notwendige Bestandteile und Zuständigkeiten sichtbar."},{"id":"card-public-M06-03-Q2","lesson_id":"6.3","number":2,"type":"Übungskarte","displayFront":"Wie sollten produktive Zugangsdaten übergeben werden?","answer":"Über einen geschützten, berechtigten und nachvollziehbaren Weg. — Geheimnisse brauchen geeignete Zugriffsbeschränkungen und klare Verantwortlichkeit."},{"id":"card-public-M06-03-Q3","lesson_id":"6.3","number":3,"type":"Übungskarte","displayFront":"Was gehört zur Support-Transition?","answer":"Kontaktwege, Zuständigkeiten und bekannte offene Punkte abstimmen. — Eine geordnete Übergabe ermöglicht Bearbeitung und Eskalation nach dem Start."},{"id":"card-public-M06-04-Q1","lesson_id":"6.4","number":1,"type":"Übungskarte","displayFront":"Welche Strategie ermöglicht frühes Lernen mit begrenzter Nutzergruppe?","answer":"Ein Pilot mit klaren Erfolgskriterien. — Ein Pilot begrenzt Auswirkungen und liefert Erfahrungen für die weitere Einführung."},{"id":"card-public-M06-04-Q2","lesson_id":"6.4","number":2,"type":"Übungskarte","displayFront":"Welche zusätzliche Aufgabe entsteht häufig im Parallelbetrieb?","answer":"Daten und Arbeitsabläufe zwischen beiden Systemen abstimmen. — Zwei gleichzeitig genutzte Systeme können widersprüchliche Bestände und Doppelarbeit erzeugen."},{"id":"card-public-M06-04-Q3","lesson_id":"6.4","number":3,"type":"Übungskarte","displayFront":"Was unterstützt die Akzeptanz einer Einführung?","answer":"Aufgabenbezogene Information und erreichbare Unterstützung. — Betroffene müssen verstehen, was sich für ihre Arbeit ändert und wo Hilfe verfügbar ist."},{"id":"card-public-M06-05-Q1","lesson_id":"6.5","number":1,"type":"Übungskarte","displayFront":"Wann werden sinnvolle Go/No-Go-Kriterien vereinbart?","answer":"Vor der Entscheidung und anhand überprüfbarer Voraussetzungen. — Vorab vereinbarte Kriterien verhindern nachträgliche beliebige Bewertungen."},{"id":"card-public-M06-05-Q2","lesson_id":"6.5","number":2,"type":"Übungskarte","displayFront":"Was ist bei einem Rollback mit Datenänderungen besonders wichtig?","answer":"Kompatibilität und Behandlung bereits geänderter Daten prüfen. — Anwendungsstand und Daten müssen auch nach einer Rückkehr zusammenpassen."},{"id":"card-public-M06-05-Q3","lesson_id":"6.5","number":3,"type":"Übungskarte","displayFront":"Welches Signal passt zur Startkontrolle eines Buchungsportals?","answer":"Anteil fehlgeschlagener Buchungen mit einem vereinbarten Schwellenwert. — Fachliche Fehlerraten zeigen, ob die wesentliche Nutzung tatsächlich funktioniert."},{"id":"card-public-M06-06-Q1","lesson_id":"6.6","number":1,"type":"Übungskarte","displayFront":"Was ist ein überprüfbares Schulungsziel?","answer":"Teilnehmende können eine Umbuchung samt Konfliktfall korrekt bearbeiten. — Ein Lernziel beschreibt eine beobachtbare Fähigkeit."},{"id":"card-public-M06-06-Q2","lesson_id":"6.6","number":2,"type":"Übungskarte","displayFront":"Welche Kirkpatrick-Perspektive untersucht Anwendung im Arbeitsalltag?","answer":"Verhalten. — Diese Perspektive betrachtet den Transfer in die tatsächliche Arbeit."},{"id":"card-public-M06-06-Q3","lesson_id":"6.6","number":3,"type":"Übungskarte","displayFront":"Welche Schlussfolgerung erlaubt hohe Schulungszufriedenheit allein?","answer":"Die Reaktion war positiv; weitere Wirkungen müssen gesondert geprüft werden. — Reaktion, Können, Anwendung und Wirkung sind verschiedene Beobachtungen."},{"id":"card-public-M07-01-Q1","lesson_id":"7.1","number":1,"type":"Übungskarte","displayFront":"Was braucht ein aussagekräftiger Vorher-Nachher-Vergleich?","answer":"Vergleichbare Definitionen, Zeiträume und einen Ausgangswert. — Vergleichbarkeit verhindert, dass veränderte Messung mit Verbesserung verwechselt wird."},{"id":"card-public-M07-01-Q2","lesson_id":"7.1","number":2,"type":"Übungskarte","displayFront":"Was gehört bei PDCA zur Prüfphase?","answer":"Die beobachtete Wirkung mit der geplanten Erwartung vergleichen. — Check bewertet, was der Versuch unter den festgelegten Bedingungen bewirkt hat."},{"id":"card-public-M07-01-Q3","lesson_id":"7.1","number":3,"type":"Übungskarte","displayFront":"Warum wird neben Durchlaufzeit auch Nacharbeit beobachtet?","answer":"Damit Beschleunigung zulasten der Qualität sichtbar wird. — Eine gewünschte Wirkung sollte nicht durch unerkannte Folgeschäden erkauft werden."},{"id":"card-public-M07-02-Q1","lesson_id":"7.2","number":1,"type":"Übungskarte","displayFront":"Was ist ein sinnvoller Zweck wiederholter Warum-Fragen?","answer":"Beeinflussbare Ursachen hinter einer Beobachtung untersuchen. — Die Untersuchung soll Ursachen mit belastbaren Hinweisen verbinden."},{"id":"card-public-M07-02-Q2","lesson_id":"7.2","number":2,"type":"Übungskarte","displayFront":"Wozu eignet sich ein Ishikawa-Diagramm?","answer":"Mögliche Ursachen aus mehreren Bereichen strukturiert sammeln. — Ursachengruppen erweitern den Blick über die erste Vermutung hinaus."},{"id":"card-public-M07-02-Q3","lesson_id":"7.2","number":3,"type":"Übungskarte","displayFront":"Welche Maßnahme ist nachvollziehbar?","answer":"Alarmweiterleitung bis Freitag testen; zuständig ist die Betriebsleitung. — Verantwortung, Termin und überprüfbare Handlung machen eine Verbesserung bearbeitbar."},{"id":"card-public-M07-03-Q1","lesson_id":"7.3","number":1,"type":"Übungskarte","displayFront":"Was gehört zu einer tragfähigen Verbesserungsempfehlung?","answer":"Erwartete Wirkung, Aufwand, Risiken und eine begründete Alternative. — Eine Entscheidung braucht nachvollziehbare Kriterien und Unsicherheiten."},{"id":"card-public-M07-03-Q2","lesson_id":"7.3","number":2,"type":"Übungskarte","displayFront":"Was zeigt ein Eintrag mit hohem Nutzen und geringem Aufwand zunächst?","answer":"Einen interessanten Kandidaten, dessen Annahmen geprüft werden sollten. — Die Matrix unterstützt Priorisierung, garantiert aber keine tatsächliche Wirkung."},{"id":"card-public-M07-03-Q3","lesson_id":"7.3","number":3,"type":"Übungskarte","displayFront":"Worauf deutet eine Liste hin, in der alles als Must markiert ist?","answer":"Der notwendige Mindestumfang wurde noch nicht sinnvoll abgegrenzt. — Priorisieren verlangt nachvollziehbare Unterschiede und einen definierten Kontext."},{"id":"card-public-M07-04-Q1","lesson_id":"7.4","number":1,"type":"Übungskarte","displayFront":"Was ist vor einer Datenbankoptimierung besonders hilfreich?","answer":"Repräsentative Abfragen und gemessene Engstellen erfassen. — Optimierung sollte an einer nachgewiesenen Belastung ansetzen."},{"id":"card-public-M07-04-Q2","lesson_id":"7.4","number":2,"type":"Übungskarte","displayFront":"Was ist bei EXPLAIN ANALYZE wichtig?","answer":"Die Anweisung wird tatsächlich ausgeführt. — Die Ausführung kann Last und bei ändernden Anweisungen Datenänderungen erzeugen; ein geeigneter Testkontext ist nötig."},{"id":"card-public-M07-04-Q3","lesson_id":"7.4","number":3,"type":"Übungskarte","displayFront":"Welcher Zielkonflikt kann bei Denormalisierung entstehen?","answer":"Einfachere Lesezugriffe gegenüber aufwendigerer konsistenter Pflege. — Redundante Informationen müssen bei Änderungen übereinstimmend gehalten werden."},{"id":"card-public-M07-05-Q1","lesson_id":"7.5","number":1,"type":"Übungskarte","displayFront":"Was wird im Wertstrom neben Bearbeitungsschritten sichtbar?","answer":"Übergaben und Wartezeiten. — Gesamtdurchlaufzeit kann überwiegend durch Warten statt durch aktive Arbeit entstehen."},{"id":"card-public-M07-05-Q2","lesson_id":"7.5","number":2,"type":"Übungskarte","displayFront":"Wie sollten DORA-Werte besonders genutzt werden?","answer":"Entwicklung desselben Dienstes im passenden Kontext beurteilen. — Gemeinsame Verbesserung ist aussagekräftiger als unpassende Vergleiche."},{"id":"card-public-M07-05-Q3","lesson_id":"7.5","number":3,"type":"Übungskarte","displayFront":"Welche Verbesserung passt zu einer langen Wartezeit auf Freigaben?","answer":"Zuständigkeit, Kriterien und Reaktionszeit der Freigabe klären. — Die Maßnahme sollte an der beobachteten Verzögerung ansetzen."},{"id":"card-public-M07-06-Q1","lesson_id":"7.6","number":1,"type":"Übungskarte","displayFront":"Welche Information macht einen ADR langfristig hilfreich?","answer":"Begründung und Konsequenzen im damaligen Kontext. — Der Kontext ermöglicht spätere Überprüfung bei veränderten Bedingungen."},{"id":"card-public-M07-06-Q2","lesson_id":"7.6","number":2,"type":"Übungskarte","displayFront":"Was verbindet eine Erfahrung mit kontinuierlicher Verbesserung?","answer":"Eine konkrete Maßnahme mit Zuständigkeit und Wirkungskontrolle. — Eine Verbesserung muss bearbeitet und anhand ihrer Wirkung geprüft werden."},{"id":"card-public-M07-06-Q3","lesson_id":"7.6","number":3,"type":"Übungskarte","displayFront":"Wann ist ein sinnvoller Anlass zur erneuten Entscheidungsprüfung?","answer":"Wesentliche Annahmen oder Anforderungen haben sich geändert. — Entscheidungen bleiben nur unter passenden Voraussetzungen tragfähig."},{"id":"card-public-M08-01-Q1","lesson_id":"8.1","number":1,"type":"Übungskarte","displayFront":"Welche Angabe ist personenbezogen?","answer":"Eine Kundennummer, die einer Person zugeordnet werden kann. — Auch indirekte Identifizierbarkeit kann einen Personenbezug begründen."},{"id":"card-public-M08-01-Q2","lesson_id":"8.1","number":2,"type":"Übungskarte","displayFront":"Was verlangt Datenminimierung?","answer":"Nur für den festgelegten Zweck erforderliche Daten verarbeiten. — Der konkrete Zweck bestimmt den notwendigen Umfang."},{"id":"card-public-M08-01-Q3","lesson_id":"8.1","number":3,"type":"Übungskarte","displayFront":"Welche Aussage zur Einwilligung ist richtig?","answer":"Sie ist eine von mehreren möglichen Rechtsgrundlagen. — Die passende Grundlage hängt von der konkreten Verarbeitung ab."},{"id":"card-public-M08-02-Q1","lesson_id":"8.2","number":1,"type":"Übungskarte","displayFront":"Wer bestimmt bei einer Verarbeitung grundsätzlich Zwecke und wesentliche Mittel?","answer":"Der Verantwortliche. — Die Rolle folgt der tatsächlichen Entscheidung über die Verarbeitung."},{"id":"card-public-M08-02-Q2","lesson_id":"8.2","number":2,"type":"Übungskarte","displayFront":"Was ist bei einem Auskunftsersuchen sinnvoll?","answer":"Identität bei Bedarf angemessen prüfen und die Anfrage fristgerecht bearbeiten. — Rechte müssen ermöglicht werden, ohne fremde Daten offenzulegen."},{"id":"card-public-M08-02-Q3","lesson_id":"8.2","number":3,"type":"Übungskarte","displayFront":"Wann ist eine DSFA besonders zu prüfen?","answer":"Vor einer Verarbeitung mit voraussichtlich hohem Risiko für Betroffene. — Die Folgenabschätzung soll hohe Risiken vorab untersuchen und geeignete Maßnahmen unterstützen."},{"id":"card-public-M08-03-Q1","lesson_id":"8.3","number":1,"type":"Übungskarte","displayFront":"Welches Schutzziel betrifft eine unberechtigt geänderte Terminliste besonders?","answer":"Integrität. — Die Verlässlichkeit und Unverfälschtheit der Daten steht im Mittelpunkt."},{"id":"card-public-M08-03-Q2","lesson_id":"8.3","number":2,"type":"Übungskarte","displayFront":"Worauf stützt sich eine Schutzbedarfsbewertung?","answer":"Auf mögliche Schäden im betrachteten fachlichen Kontext. — Schutzbedarf ist aus den Auswirkungen eines Schadens abzuleiten."},{"id":"card-public-M08-03-Q3","lesson_id":"8.3","number":3,"type":"Übungskarte","displayFront":"Was ist ein ISMS?","answer":"Ein System zum organisierten Umgang mit Informationssicherheitsrisiken. — Informationssicherheit braucht Steuerung und kontinuierliche Überprüfung."},{"id":"card-public-M08-04-Q1","lesson_id":"8.4","number":1,"type":"Übungskarte","displayFront":"Was setzt das Prinzip minimaler Rechte um?","answer":"Eine Rolle erhält nur die für ihre Aufgabe benötigten Berechtigungen. — Begrenzte Rechte reduzieren die möglichen Folgen eines Missbrauchs oder Fehlers."},{"id":"card-public-M08-04-Q2","lesson_id":"8.4","number":2,"type":"Übungskarte","displayFront":"Welcher Nachweis prüft ein Backup besonders aussagekräftig?","answer":"Ein dokumentierter erfolgreicher Wiederherstellungstest. — Entscheidend ist die nutzbare Wiederherstellung, nicht allein das Vorhandensein einer Datei."},{"id":"card-public-M08-04-Q3","lesson_id":"8.4","number":3,"type":"Übungskarte","displayFront":"Was ist eine organisatorische Sicherheitsmaßnahme?","answer":"Ein geregelter Prozess zum Entziehen von Rechten bei Austritt. — Organisation legt Verantwortungen und verbindliche Bearbeitungsschritte fest."},{"id":"card-public-M08-05-Q1","lesson_id":"8.5","number":1,"type":"Übungskarte","displayFront":"Welche STRIDE-Kategorie betrifft unbefugte Datenveränderung?","answer":"Tampering. — Tampering beschreibt Manipulation und damit eine Bedrohung der Integrität."},{"id":"card-public-M08-05-Q2","lesson_id":"8.5","number":2,"type":"Übungskarte","displayFront":"Warum werden Vertrauensgrenzen im Modell markiert?","answer":"Weil dort Annahmen über Identität und Daten geprüft werden müssen. — Der Übergang zwischen unterschiedlich vertrauenswürdigen Bereichen braucht bewusste Kontrollen."},{"id":"card-public-M08-05-Q3","lesson_id":"8.5","number":3,"type":"Übungskarte","displayFront":"Was ist nach Einführung einer Risikomaßnahme zu tun?","answer":"Wirksamkeit und verbleibendes Risiko erneut beurteilen. — Eine Maßnahme verändert ein Risiko, beseitigt es aber nicht zwangsläufig vollständig."},{"id":"card-public-M08-06-Q1","lesson_id":"8.6","number":1,"type":"Übungskarte","displayFront":"Was beschreibt IT-Compliance am besten?","answer":"Das Einhalten einschlägiger Vorgaben mit geeigneten Nachweisen. — Compliance verbindet relevante Anforderungen mit ihrer Umsetzung."},{"id":"card-public-M08-06-Q2","lesson_id":"8.6","number":2,"type":"Übungskarte","displayFront":"Was ist ein belastbarer Kontrollnachweis?","answer":"Ein nachvollziehbares Ergebnis einer tatsächlich durchgeführten Prüfung. — Ein Nachweis muss erkennen lassen, was wann mit welchem Ergebnis geprüft wurde."},{"id":"card-public-M08-06-Q3","lesson_id":"8.6","number":3,"type":"Übungskarte","displayFront":"Wie wird eine Auditabweichung sinnvoll behandelt?","answer":"Ursache, Korrektur, Zuständigkeit und Wirksamkeitsprüfung festlegen. — Die Bearbeitung soll das konkrete Problem nachvollziehbar beheben."},{"id":"card-public-M08-07-Q1","lesson_id":"8.7","number":1,"type":"Übungskarte","displayFront":"Welcher Schwerpunkt kennzeichnet grundsätzlich einen Werkvertrag?","answer":"Die Herstellung des versprochenen Erfolgs. — § 631 BGB stellt auf das versprochene Werk beziehungsweise den herbeizuführenden Erfolg ab."},{"id":"card-public-M08-07-Q2","lesson_id":"8.7","number":2,"type":"Übungskarte","displayFront":"Welche Leistung steht beim Dienstvertrag grundsätzlich im Vordergrund?","answer":"Die vereinbarten Dienste. — § 611 BGB beschreibt die Leistung der zugesagten Dienste."},{"id":"card-public-M08-07-Q3","lesson_id":"8.7","number":3,"type":"Übungskarte","displayFront":"Was sollte vor der Freigabe eines Change Requests vorliegen?","answer":"Eine Bewertung von Umfang und Auswirkungen sowie eine zuständige Entscheidung. — Ein geregelter Änderungsprozess macht Folgen und Zustimmung nachvollziehbar."},{"id":"card-public-M08-08-Q1","lesson_id":"8.8","number":1,"type":"Übungskarte","displayFront":"Was hilft bei einer gemeldeten Schwachstelle in einer Abhängigkeit?","answer":"Verwendete Versionen und betroffene Anwendungen nachvollziehbar zuordnen. — Eine bekannte Komponentenbasis ermöglicht gezielte Bewertung und Behandlung."},{"id":"card-public-M08-08-Q2","lesson_id":"8.8","number":2,"type":"Übungskarte","displayFront":"Wie werden neue regulatorische Anforderungen sinnvoll behandelt?","answer":"Aktuellen Anwendungsbereich und Betroffenheit prüfen und Maßnahmen ableiten. — Relevanz und konkrete Pflichten müssen zum tatsächlichen Fall passen."},{"id":"card-public-M08-08-Q3","lesson_id":"8.8","number":3,"type":"Übungskarte","displayFront":"Was gehört nach einem sicherheitsrelevanten Update zur Freigabe?","answer":"Geeignete Funktionstests und nachvollziehbare Bewertung der Änderung. — Die Behebung eines Problems darf unerwünschte Auswirkungen auf die Anwendung nicht übersehen."},{"id":"card-public-M09-01-Q1","lesson_id":"9.1","number":1,"type":"Übungskarte","displayFront":"Was gehört zu einem gut überprüfbaren Teilprojektziel?","answer":"Konkretes Ergebnis, Erfolgskriterium und Termin. — Das Ziel muss einen erkennbaren, überprüfbaren Beitrag beschreiben."},{"id":"card-public-M09-01-Q2","lesson_id":"9.1","number":2,"type":"Übungskarte","displayFront":"Wofür steht Accountable in RACI?","answer":"Für die abschließende Ergebnisverantwortung. — Responsible und Accountable unterscheiden Bearbeitung und Ergebnisverantwortung."},{"id":"card-public-M09-01-Q3","lesson_id":"9.1","number":3,"type":"Übungskarte","displayFront":"Was liefert ein Projektstrukturplan vorrangig?","answer":"Eine Gliederung des Projektumfangs in Ergebnisse und Arbeitspakete. — Die Struktur beschreibt den Umfang; zeitliche Beziehungen werden anschließend geplant."},{"id":"card-public-M09-02-Q1","lesson_id":"9.2","number":1,"type":"Übungskarte","displayFront":"Was unterstützt frühe Rückmeldung bei unsicheren Anforderungen?","answer":"Kleine überprüfbare Ergebnisse mit regelmäßiger Anpassung. — Ein früher überprüfbarer Stand ermöglicht Lernen vor einer großen Gesamtlieferung."},{"id":"card-public-M09-02-Q2","lesson_id":"9.2","number":2,"type":"Übungskarte","displayFront":"Was beschreibt die Definition of Done in Scrum?","answer":"Die Qualitätsanforderungen an ein fertiges Increment. — Fertige Arbeit muss den gemeinsam geltenden Qualitätszustand erfüllen."},{"id":"card-public-M09-02-Q3","lesson_id":"9.2","number":3,"type":"Übungskarte","displayFront":"Welche Aussage zur Definition of Ready passt?","answer":"Sie kann eine ergänzende Teamvereinbarung zur Vorbereitung sein. — Vorbereitungshilfen dürfen nicht mit verbindlichen Elementen des Scrum Guide verwechselt werden."},{"id":"card-public-M09-03-Q1","lesson_id":"9.3","number":1,"type":"Übungskarte","displayFront":"Wer kann ein Stakeholder sein?","answer":"Eine vom Ergebnis betroffene Supportgruppe. — Betroffenheit und Einfluss reichen über das Kernprojektteam hinaus."},{"id":"card-public-M09-03-Q2","lesson_id":"9.3","number":2,"type":"Übungskarte","displayFront":"Was sollte aus einer Stakeholderanalyse folgen?","answer":"Ein abgestimmter Beteiligungs- und Kommunikationsbedarf. — Die Analyse soll angemessene Zusammenarbeit ermöglichen."},{"id":"card-public-M09-03-Q3","lesson_id":"9.3","number":3,"type":"Übungskarte","displayFront":"Welche Angabe macht einen Kommunikationsplan konkret?","answer":"Wer welche Information wann über welchen Weg verantwortet. — Verantwortete Kommunikationswege verhindern Lücken und Doppelarbeit."},{"id":"card-public-M09-04-Q1","lesson_id":"9.4","number":1,"type":"Übungskarte","displayFront":"Was unterscheidet ein Issue von einem Risiko?","answer":"Das Issue ist bereits eingetreten. — Mögliche und tatsächliche Probleme brauchen unterschiedliche unmittelbare Bearbeitung."},{"id":"card-public-M09-04-Q2","lesson_id":"9.4","number":2,"type":"Übungskarte","displayFront":"Was gehört in einen nachvollziehbaren Risikoeintrag?","answer":"Szenario, Bewertung, Verantwortlichkeit und Behandlung. — Ein Risiko muss verständlich und bearbeitbar beschrieben sein."},{"id":"card-public-M09-04-Q3","lesson_id":"9.4","number":3,"type":"Übungskarte","displayFront":"Was macht eine Eskalation entscheidbar?","answer":"Auswirkung, Optionen und eine klare benötigte Entscheidung. — Die zuständige Ebene braucht die nötigen Informationen zum Handeln."},{"id":"card-public-M09-05-Q1","lesson_id":"9.5","number":1,"type":"Übungskarte","displayFront":"Ein Test benötigt zwei Vorgänger, die an Tag 5 und Tag 8 fertig sind. Wann kann er frühestens starten?","answer":"An Tag 8, wenn keine weiteren Einschränkungen gelten. — Alle erforderlichen Vorgänger müssen für den gemeinsamen Start abgeschlossen sein."},{"id":"card-public-M09-05-Q2","lesson_id":"9.5","number":2,"type":"Übungskarte","displayFront":"Was bestimmt im einfachen Netzplan die frühestmögliche Projektdauer?","answer":"Der längste Pfad notwendiger Abhängigkeiten. — Die längste notwendige Kette begrenzt den frühestmöglichen Abschluss."},{"id":"card-public-M09-05-Q3","lesson_id":"9.5","number":3,"type":"Übungskarte","displayFront":"Was bedeutet Gesamtpuffer in einem einfachen Terminmodell?","answer":"Mögliche Verzögerung eines Vorgangs ohne Verschiebung des Projektendes. — Puffer beschreibt zeitlichen Spielraum im betrachteten Modell."},{"id":"card-public-M09-06-Q1","lesson_id":"9.6","number":1,"type":"Übungskarte","displayFront":"Warum unterscheiden sich Aufwand und Dauer?","answer":"Verfügbarkeit und Abhängigkeiten beeinflussen die zeitliche Verteilung. — Arbeitsmenge und Zeitspanne beschreiben unterschiedliche Sachverhalte."},{"id":"card-public-M09-06-Q2","lesson_id":"9.6","number":2,"type":"Übungskarte","displayFront":"Welcher PERT-Wert ergibt sich aus 1, 3 und 5 Tagen?","answer":"3 Tage. — (1 + 4 × 3 + 5) / 6 = 18 / 6 = 3."},{"id":"card-public-M09-06-Q3","lesson_id":"9.6","number":3,"type":"Übungskarte","displayFront":"Was gehört zu einer nachvollziehbaren Schätzung?","answer":"Dokumentierte Annahmen und erkennbare Unsicherheiten. — Eine Schätzung wird überprüfbar, wenn ihre Grundlagen bekannt sind."},{"id":"card-public-M09-07-Q1","lesson_id":"9.7","number":1,"type":"Übungskarte","displayFront":"Was bedeutet EV?","answer":"Der budgetierte Wert der tatsächlich erbrachten Leistung. — Earned Value bewertet erbrachte Arbeit mit ihrem geplanten Wert."},{"id":"card-public-M09-07-Q2","lesson_id":"9.7","number":2,"type":"Übungskarte","displayFront":"EV beträgt 9.000 Euro, AC 12.000 Euro. Wie hoch ist CPI?","answer":"0,75. — CPI = 9.000 / 12.000 = 0,75."},{"id":"card-public-M09-07-Q3","lesson_id":"9.7","number":3,"type":"Übungskarte","displayFront":"Wie wird SPI 0,8 angemessen beschrieben?","answer":"Der erreichte Leistungswert liegt unter dem zum Stichtag geplanten Wert. — Die Kennzahl bezieht sich auf den geplanten Leistungswert, nicht unmittelbar auf Kalenderdauer oder Gesamtfortschritt."},{"id":"card-public-M09-08-Q1","lesson_id":"9.8","number":1,"type":"Übungskarte","displayFront":"Welche Abstimmung gehört zur Roll-out-Koordination?","answer":"Freigabe, Betrieb, Kommunikation und Unterstützung miteinander verbinden. — Ein koordinierter Start braucht zusammenpassende Vorbereitungen."},{"id":"card-public-M09-08-Q2","lesson_id":"9.8","number":2,"type":"Übungskarte","displayFront":"Was sollte eine praktische Sicherheitsunterweisung trainieren?","answer":"Relevante sichere Handlungen und bekannte Meldewege. — Sicheres Verhalten muss in tatsächlichen Arbeitssituationen ausführbar sein."},{"id":"card-public-M09-08-Q3","lesson_id":"9.8","number":3,"type":"Übungskarte","displayFront":"Welche Beobachtung prüft den Wissenstransfer besonders direkt?","answer":"Eine relevante Aufgabe wird im Arbeitsalltag korrekt ausgeführt. — Teilnahme allein beweist keine sichere Anwendung des Gelernten."}],"sourceInfo":{"content":"Selbst formulierte Lern- und Übungsinhalte aus den bereits betrachteten Kursthemen","publicPreview":true,"originalCourseCardsPublished":0,"quizCount":211,"practiceCount":67,"cardCount":211,"coverageNote":"M01 und M03 folgen den vorhandenen Lektionen; M04 bis M09 sind kompakte, neu gegliederte Trainingseinheiten aus den vorhandenen Themenblöcken. M02 bleibt vollständig in seiner bisherigen Testfassung erhalten.","checkedAt":"2026-10-21"}};

let storageAvailable=true;
const LESSON_IDS=new Set(DATA.lessons.map(l=>l.id));
const QUESTION_IDS=new Set(DATA.lessons.flatMap(l=>[...l.questions,...l.practice]).map(q=>q.id));
const PRACTICE_IDS=new Set(DATA.lessons.flatMap(l=>l.practice).map(q=>q.id));
function normalizeProgress(value){
 if(!value||typeof value!=='object'||Array.isArray(value))return null;
 const out=blank();
 if(value.activeModule!==undefined){if(!Number.isInteger(value.activeModule)||!DATA.modules.some(m=>m.id===value.activeModule))return null;out.activeModule=value.activeModule;}
 for(const key of ['xp','attempts']){const n=value[key]??0;if(!Number.isSafeInteger(n)||n<0||n>100000000)return null;out[key]=n;}
 const record=(v,ids)=>{if(v===undefined)return {};if(!v||typeof v!=='object'||Array.isArray(v))throw Error();const r={};for(const [id,flag] of Object.entries(v)){if(!ids.has(id)||typeof flag!=='boolean')throw Error();if(flag)r[id]=true;}return r;};
 try{
  out.done=record(value.done,LESSON_IDS);out.correct=record(value.correct,QUESTION_IDS);out.wrong=record(value.wrong,QUESTION_IDS);

 if(e.target.id==='reviewModule'){current.reviewScope=e.target.value==='all'?'all':'module';if(current.reviewScope==='module'){current.module=Number(e.target.value);current.lesson=defaultLesson(current.module);progress.activeModule=current.module;save();}render(false)}
 if(e.target.id==='importProgress'){
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{if(f.size>1000000)throw Error('Die Sicherung ist zu groß.');const j=JSON.parse(await f.text());const clean=['skillyr-learn-m01-m09','skillyr-learn-m01-m05','skillyr-learn-m02'].includes(j.app)?normalizeProgress(j.progress):null;if(clean&&j.app==='skillyr-learn-m02')clean.activeModule=2;if(!clean)throw Error('Keine gültige Skillyr-Lernstandsicherung');
   if(confirm('Den aktuellen Lernstand aller neun Module durch diesen Export ersetzen?')){pendingCompletion=null;progress=clean;current.module=progress.activeModule;current.lesson=defaultLesson(current.module);save();render();}
  }catch(err){alert('Import nicht möglich: '+err.message)}
 }
});
render(false);
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline-Serviceworker:',e));
</script>
</body></html>
