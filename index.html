n, Änderungen, bekannte Probleme und gegebenenfalls Umstellungshinweise."},{"id":"train-SKY-099","lesson_id":"3.8","number":3,"type":"Übungskarte","displayFront":"Wie unterstützt Blue-Green Deployment einen schnellen Wechsel?","answer":"Durch zwei Umgebungen, zwischen denen Verkehr umgeschaltet wird — Eine Umgebung kann geprüft werden, während die andere weiterhin bedient; Datenkompatibilität bleibt zu planen."},{"id":"train-SKY-101","lesson_id":"3.9","number":1,"type":"Übungskarte","displayFront":"Welche Maßnahme schützt SQL-Abfragen vor der Interpretation von Nutzereingaben als SQL-Code?","answer":"Parametrisierte Abfragen — Daten werden getrennt von der SQL-Struktur übergeben; ergänzend bleiben Rechte und Validierung wichtig."},{"id":"train-SKY-102","lesson_id":"3.9","number":2,"type":"Übungskarte","displayFront":"Welche Speicherung ist für Benutzerpasswörter vorgesehen?","answer":"Ein geeignetes langsames Passwort-Hashverfahren mit individuellem Salt — Ein Passwort-Hashverfahren erschwert das massenhafte Durchprobieren; ein Salt verhindert identische Hashes bei gleichen Passwörtern."},{"id":"train-SKY-103","lesson_id":"3.9","number":3,"type":"Übungskarte","displayFront":"Was muss vor dem Zugriff auf eine konkrete Lieferung geprüft werden?","answer":"Ob die anfragende Identität für genau diese Ressource berechtigt ist — Authentifizierung allein ersetzt keine ressourcenbezogene Autorisierung."},{"id":"train-SKY-105","lesson_id":"3.10","number":1,"type":"Übungskarte","displayFront":"Was sollte in einem Integrationsprojekt durchgängig verbunden sein?","answer":"Anforderungen, Entwurf, Umsetzung und Tests — Die Verbindung zeigt, dass die technische Lösung das fachliche Ziel erfüllt."},{"id":"train-SKY-106","lesson_id":"3.10","number":2,"type":"Übungskarte","displayFront":"Wozu dienen Checkpoints in einem Projekt?","answer":"Ergebnisse früh prüfen und Abweichungen rechtzeitig erkennen — Kurze Überprüfungen verhindern, dass große Fehler erst bei der Abschlusspräsentation auffallen."},{"id":"train-SKY-107","lesson_id":"3.10","number":3,"type":"Übungskarte","displayFront":"Welche Aussage ist eine belastbare technische Begründung?","answer":"Die Entscheidung erfüllt eine benannte Anforderung und ihre Nachteile werden bewertet — Eine gute Begründung enthält fachlichen Bezug und eine Abwägung."},{"id":"train-SKY-109","lesson_id":"3.11","number":1,"type":"Übungskarte","displayFront":"Was solltest du vor dem Schreiben einer Prüfungsantwort klären?","answer":"Operator, verlangte Anzahl und Fallbezug — Diese Vorgaben bestimmen Form und Tiefe der Antwort."},{"id":"train-SKY-110","lesson_id":"3.11","number":2,"type":"Übungskarte","displayFront":"Welche Struktur eignet sich für eine begründete Empfehlung?","answer":"Anforderung, Entscheidung, Nutzen und Nachteil beziehungsweise Gegenmaßnahme — Die Struktur macht die fachliche Herleitung nachvollziehbar."},{"id":"train-SKY-111","lesson_id":"3.11","number":3,"type":"Übungskarte","displayFront":"Wie hilft eine Zeitplanung bei mehreren Teilaufgaben?","answer":"Sie verteilt Zeit angemessen und verhindert das Festhalten an einer einzelnen Aufgabe — Arbeitszeit sollte sich an Umfang und erwarteter Bewertung orientieren."},{"id":"train-M04-01-Q1","lesson_id":"4.1","number":1,"type":"Übungskarte","displayFront":"Welches Qualitätsziel lässt sich am besten prüfen?","answer":"Bei definierter Last antworten 95 % der Suchanfragen in höchstens zwei Sekunden. — Die Aussage nennt einen überprüfbaren Zielwert und eine Bedingung."},{"id":"train-M04-01-Q2","lesson_id":"4.1","number":2,"type":"Übungskarte","displayFront":"Welche Maßnahme ist vor allem konstruktive Qualitätssicherung?","answer":"Verbindliche Implementierungsregeln für das Team vereinbaren. — Gemeinsame Regeln sollen Fehler bereits während der Entstehung vermeiden."},{"id":"train-M04-01-Q3","lesson_id":"4.1","number":3,"type":"Übungskarte","displayFront":"Warum reichen viele fehlerfreie Unit-Tests allein nicht für eine Qualitätsaussage?","answer":"Weitere Qualitätsziele und das Zusammenspiel des Systems müssen ebenfalls betrachtet werden. — Ein einzelner Testtyp deckt nicht alle Anforderungen und Nutzungssituationen ab."},{"id":"train-M04-02-Q1","lesson_id":"4.2","number":1,"type":"Übungskarte","displayFront":"Wozu dient eine Nachverfolgbarkeitsmatrix?","answer":"Sie verbindet Anforderungen mit zugehörigen Tests und Ergebnissen. — So werden Abdeckung und Auswirkungen von Änderungen nachvollziehbar."},{"id":"train-M04-02-Q2","lesson_id":"4.2","number":2,"type":"Übungskarte","displayFront":"Was ist ein sinnvoller Schwerpunkt eines Integrationstests?","answer":"Die Zusammenarbeit von API und Testdatenbank prüfen. — Integrationstests betrachten Schnittstellen und Zusammenarbeit mehrerer Komponenten."},{"id":"train-M04-02-Q3","lesson_id":"4.2","number":3,"type":"Übungskarte","displayFront":"Welche Information gehört in einen Testplan?","answer":"Testumfang, Risiken, Testumgebung und Abschlusskriterien. — Ein Plan macht Durchführung und Bewertung der Tests nachvollziehbar."},{"id":"train-M04-03-Q1","lesson_id":"4.3","number":1,"type":"Übungskarte","displayFront":"Welche Werte passen besonders zur Grenzwertanalyse für eine erlaubte Menge von 1 bis 20?","answer":"0, 1, 20 und 21 — Die Werte liegen an den Grenzen oder direkt außerhalb des erlaubten Bereichs."},{"id":"train-M04-03-Q2","lesson_id":"4.3","number":2,"type":"Übungskarte","displayFront":"Welche Angabe macht einen Testfall auswertbar?","answer":"Ein erwartetes, beobachtbares Ergebnis. — Erst ein vorab beschriebenes Soll-Ergebnis ermöglicht einen belastbaren Vergleich."},{"id":"train-M04-03-Q3","lesson_id":"4.3","number":3,"type":"Übungskarte","displayFront":"Wann ist eine Entscheidungstabelle besonders hilfreich?","answer":"Wenn mehrere Bedingungen gemeinsam ein fachliches Ergebnis bestimmen. — Tabellen helfen, Kombinationen systematisch und lückenbewusst zu betrachten."},{"id":"train-M04-04-Q1","lesson_id":"4.4","number":1,"type":"Übungskarte","displayFront":"Welche Eigenschaft unterstützt reproduzierbare Tests?","answer":"Ein dokumentierter Aufbau mit definiertem Ausgangszustand. — Ein kontrollierter Ausgangszustand macht Unterschiede und Fehler leichter erklärbar."},{"id":"train-M04-04-Q2","lesson_id":"4.4","number":2,"type":"Übungskarte","displayFront":"Welche Testdaten sind für eine allgemeine Testumgebung oft ein geeigneter Ausgangspunkt?","answer":"Passende synthetische Daten mit bekannten Eigenschaften. — Synthetische Daten können gezielt Fälle abdecken und unnötige Offenlegung echter Daten vermeiden."},{"id":"train-M04-04-Q3","lesson_id":"4.4","number":3,"type":"Übungskarte","displayFront":"Welcher Ablauf eignet sich besonders für Automatisierung?","answer":"Ein regelmäßig wiederholter, eindeutig auswertbarer Regressionstest. — Wiederholung und klare Erwartungen machen den Nutzen von Automatisierung gut erkennbar."},{"id":"train-M04-05-Q1","lesson_id":"4.5","number":1,"type":"Übungskarte","displayFront":"Welche Information hilft besonders beim Nachstellen eines Fehlers?","answer":"Eine genaue Schrittfolge mit Soll- und Ist-Ergebnis. — Reproduzierbare Schritte ermöglichen die gezielte Untersuchung."},{"id":"train-M04-05-Q2","lesson_id":"4.5","number":2,"type":"Übungskarte","displayFront":"Was beschreibt die Priorität eines Fehlers?","answer":"Die vereinbarte Dringlichkeit und Bearbeitungsreihenfolge. — Priorität berücksichtigt neben Auswirkungen auch zeitlichen und fachlichen Kontext."},{"id":"train-M04-05-Q3","lesson_id":"4.5","number":3,"type":"Übungskarte","displayFront":"Wozu dient eine Triage?","answer":"Fehler bewerten, klären und einer passenden Bearbeitung zuordnen. — Gemeinsame Einordnung unterstützt eine begründete Bearbeitungsreihenfolge."},{"id":"train-M04-06-Q1","lesson_id":"4.6","number":1,"type":"Übungskarte","displayFront":"Warum beweist eine hohe Codeabdeckung allein keine Fehlerfreiheit?","answer":"Weil ausgeführte Zeilen noch keine vollständigen Erwartungen und Fälle garantieren. — Abdeckung zeigt Ausführung, nicht automatisch die Güte aller Prüfungen."},{"id":"train-M04-06-Q2","lesson_id":"4.6","number":2,"type":"Übungskarte","displayFront":"Was gehört zu einer nachvollziehbaren Testempfehlung?","answer":"Ergebnisse, offener Umfang und verbleibende Risiken. — Die Entscheidung braucht den Kontext dessen, was geprüft wurde und was offen bleibt."},{"id":"train-M04-06-Q3","lesson_id":"4.6","number":3,"type":"Übungskarte","displayFront":"Wann ist eine Verbesserung überzeugend abgeschlossen?","answer":"Wenn ihre Wirkung anhand eines passenden Kriteriums überprüft wurde. — Eine überprüfte Wirkung schließt den Lernkreislauf besser als eine bloße Aufgabenliste."},{"id":"train-M05-01-Q1","lesson_id":"5.1","number":1,"type":"Übungskarte","displayFront":"Was sollte die Auswahl von Tiefe und Sprache einer Dokumentation besonders bestimmen?","answer":"Zielgruppe, Vorwissen und konkrete Aufgabe. — Informationen werden nützlich, wenn sie zur Leseraufgabe passen."},{"id":"train-M05-01-Q2","lesson_id":"5.1","number":2,"type":"Übungskarte","displayFront":"Welche Form passt zum schnellen Nachschlagen erlaubter API-Felder?","answer":"Eine strukturierte Referenz. — Eine Referenz stellt definierte Details zum gezielten Nachschlagen bereit."},{"id":"train-M05-01-Q3","lesson_id":"5.1","number":3,"type":"Übungskarte","displayFront":"Was ist ein typisches Ziel eines Tutorials?","answer":"Einen geführten ersten Lernerfolg ermöglichen. — Ein Tutorial unterstützt Lernen durch einen nachvollziehbaren Ablauf."},{"id":"train-M05-02-Q1","lesson_id":"5.2","number":1,"type":"Übungskarte","displayFront":"Was gehört zum Docs-as-Code-Ansatz?","answer":"Dokumentation versionieren, prüfen und gemeinsam ändern. — Der Ansatz nutzt bewährte Änderungs- und Prüfabläufe auch für Texte."},{"id":"train-M05-02-Q2","lesson_id":"5.2","number":2,"type":"Übungskarte","displayFront":"Welche Frage beantwortet ein guter ADR besonders?","answer":"Warum wurde diese Architekturentscheidung im gegebenen Kontext getroffen? — Der Entscheidungsgrund ist für spätere Änderungen oft wichtiger als nur das Ergebnis."},{"id":"train-M05-02-Q3","lesson_id":"5.2","number":3,"type":"Übungskarte","displayFront":"Wann sollte eine relevante Dokumentationsänderung geprüft werden?","answer":"Im passenden Änderungsprozess zusammen mit der betroffenen Funktion. — Gemeinsame Prüfung reduziert veraltete oder widersprüchliche Beschreibungen."},{"id":"train-M05-03-Q1","lesson_id":"5.3","number":1,"type":"Übungskarte","displayFront":"Welcher Kommentar liefert typischerweise zusätzlichen Nutzen?","answer":"Er erklärt eine nicht offensichtliche fachliche Entscheidung. — Ein guter Kommentar macht Absicht oder besondere Bedingungen verständlich."},{"id":"train-M05-03-Q2","lesson_id":"5.3","number":2,"type":"Übungskarte","displayFront":"Welche Information gehört in eine API-Beschreibung?","answer":"Eingaben, Antworten und relevante Fehlerfälle. — Clients benötigen einen vollständigen, nachvollziehbaren Vertrag."},{"id":"train-M05-03-Q3","lesson_id":"5.3","number":3,"type":"Übungskarte","displayFront":"Was macht eine Prozessbeschreibung besonders hilfreich?","answer":"Rollen, Schritte und Übergaben sind nachvollziehbar. — Die Beschreibung soll Zusammenarbeit und Verantwortlichkeiten erklären."},{"id":"train-M05-04-Q1","lesson_id":"5.4","number":1,"type":"Übungskarte","displayFront":"Welche Formulierung eignet sich für einen konkreten Handlungsschritt?","answer":"Wähle den Termin und tippe auf „Verschieben“. — Die Formulierung benennt eine beobachtbare, konkrete Handlung."},{"id":"train-M05-04-Q2","lesson_id":"5.4","number":2,"type":"Übungskarte","displayFront":"Was sollte eine Anleitung neben den Schritten erklären?","answer":"Voraussetzungen und das erwartete Ergebnis. — Voraussetzungen und Ergebnis helfen, den Ablauf richtig einzuordnen."},{"id":"train-M05-04-Q3","lesson_id":"5.4","number":3,"type":"Übungskarte","displayFront":"Was ist bei einem Screenshot besonders sinnvoll?","answer":"Eine passende Ansicht mit erforderlicher Erklärung und Versionsbezug verwenden. — Bilder ergänzen eine Anleitung nur, wenn sie zum beschriebenen Zustand passen."},{"id":"train-M05-05-Q1","lesson_id":"5.5","number":1,"type":"Übungskarte","displayFront":"Welche Schulungsaktivität unterstützt das Überprüfen des Verständnisses?","answer":"Einen Ablauf selbst durchführen und das Ergebnis besprechen. — Aktive Anwendung und Rückmeldung zeigen praktische Lücken."},{"id":"train-M05-05-Q2","lesson_id":"5.5","number":2,"type":"Übungskarte","displayFront":"Was hilft gegen eine veraltete Wissenssammlung?","answer":"Verantwortliche und regelmäßige oder ereignisbezogene Prüfung festlegen. — Pflege benötigt klare Verantwortung und erkennbare Auslöser."},{"id":"train-M05-05-Q3","lesson_id":"5.5","number":3,"type":"Übungskarte","displayFront":"Worin unterscheiden sich Unterlagen für Endnutzende und Multiplikatoren oft?","answer":"Multiplikatoren benötigen zusätzlich Hinweise zum Erklären und Begleiten von Übungen. — Die Rolle bestimmt, ob neben der Bedienung auch die Vermittlung unterstützt werden soll."},{"id":"train-M05-06-Q1","lesson_id":"5.6","number":1,"type":"Übungskarte","displayFront":"Welche Prüfung bewertet eine Anleitung besonders praxisnah?","answer":"Eine passende Person führt die beschriebene Aufgabe damit aus. — Die tatsächliche Nutzung zeigt Lücken, die beim reinen Lesen leicht übersehen werden."},{"id":"train-M05-06-Q2","lesson_id":"5.6","number":2,"type":"Übungskarte","displayFront":"Warum ist ein Versionsbezug wichtig?","answer":"Er zeigt, zu welchem Anwendungsstand die Beschreibung gehört. — Die Zuordnung verhindert, dass unterschiedliche Softwarestände verwechselt werden."},{"id":"train-M05-06-Q3","lesson_id":"5.6","number":3,"type":"Übungskarte","displayFront":"Welche automatisierte Dokumentationsprüfung ist sinnvoll?","answer":"Links und ausführbare Beispiele auf erwartetes Verhalten prüfen. — Automatische Prüfungen können konkrete technische Fehler zuverlässig sichtbar mac function normalizeProgress(value){
 if(!value||typeof value!=='object'||Array.isArray(value))return null;
 const out=blank();
 if(value.activeModule!==undefined){if(!Number.isInteger(value.activeModule)||value.activeModule<1||value.activeModule>5)return null;out.activeModule=value.activeModule;}
 for(const key of ['xp','attempts']){const n=value[key]??0;if(!Number.isSafeInteger(n)||n<0||n>100000000)return null;out[key]=n;}
 const record=(v,ids)=>{if(v===undefined)return {};if(!v||typeof v!=='object'||Array.isArray(v))throw Error();const r={};for(const [id,flag] of Object.entries(v)){if(!ids.has(id)||typeof flag!=='boolean')throw Error();if(flag)r[id]=true;}return r;};
 try{
  out.done=record(value.done,LESSON_IDS);out.correct=record(value.correct,QUESTION_IDS);out.wrong=record(value.wrong,QUESTION_IDS);
  if(value.practices!==undefined){if(!value.practices||typeof value.practices!=='object'||Array.isArray(value.practices))return null;for(const [id,p] of Object.entries(value.practices)){
   if(!LESSON_IDS.has(id)||!p||typeof p!=='object'||Array.isArray(p))return null;
   const v={};if(p.text!==undefined){if(typeof p.text!=='string'||p.text.length>3000)return null;v.text=p.text;}if(p.known!==undefined){if(typeof p.known!=='boolean')return null;v.known=p.known;}if(p.mode!==undefined){if(!['self','ai'].includes(p.mode))return null;v.mode=p.mode;}out.practices[id]=v;
  }}
  if(value.days!==undefined){if(!Array.isArray(value.days)||value.days.length>3660||!value.days.every(d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)))return null;out.days=[...new Set(value.days)];}
  if(value.coachReviews!==undefined){if(!value.coachReviews||typeof value.coachReviews!=='object'||Array.isArray(value.coachReviews))return null;for(const [id,r] of Object.entries(value.coachReviews)){
   if(!PRACTICE_IDS.has(id)||!r||!LESSON_IDS.has(r.lesson_id)||!Number.isFinite(r.score)||r.score<0||r.score>100||!['correct','partial','incorrect'].includes(r.verdict)||typeof r.at!=='string'||r.at.length>40||!Number.isFinite(Date.parse(r.at)))return null;
   out.coachReviews[id]={lesson_id:r.lesson_id,score:r.score,verdict:r.verdict,at:r.at};
  }}
  return out;
 }catch{return null;}
}

async function evaluateQuizCoach(){
 const q=current.session[current.question];if(current.page!=='quiz'||q?.type!=='free_text'||current.coachBusy||current.freeVerdict!==null)return;
 const field=byId('quizFreeText');if(field&&!field.readOnly)current.draft=field.value;
 if(current.draft.trim().length<12)return;
 current.coachBusy=true;current.coachError='';render(false);
 const lesson=current.lesson,index=current.question;
 try{const r=await callCoach(q.id,current.draft);
  if(current.page!=='quiz'||current.lesson!==lesson||current.question!==index)return;
  current.coachFeedback=r;current.answer='submitted';
 }catch(err){if(current.page==='quiz'&&current.question===index)current.coachError=err.message||'Bewertung fehlgeschlagen.'}
 finally{if(current.page==='quiz'&&current.question===index){current.coachBusy=false;render(false)}}
}

function beginQuiz(id,review=false){
 current.lesson=id;current.page='quiz';current.answer=-1;current.question=0;current.sessionCorrect=0;current.sessionWrong=0;

 all=[...all].sort((a,b)=>(!!progress.wrong[b.id])-(!!progress.wrong[a.id]) || Math.random()-.5);

 if(!review){

 }
 current.session=session;render();
}

function assessFree(understood,mode="self"){

function chooseOption(i){

 if(!Number.isInteger(i)||i<0||current.session[current.question].type==='free_text'||i>=current.session[current.question].options.length)return;
 current.pick=i;
 render(false);
}
function confirmOption(){

 touchDay();
 if(i===q.correct_index){
  current.sessionCorrect++;

 } else {current.sessionWrong++;progress.wrong[q.id]=true}
 save();render(false);
}

function exportData(){const blob=new Blob([JSON.stringify({app:'skillyr-learn-m01-m05',schemaVersion:2,exportedAt:new Date().toISOString(),progress},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='skillyr-m01-m05-fortschritt.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;
 if(b.dataset.module){setModule(Number(b.dataset.module));return}
 if(b.dataset.option!==undefined){chooseOption(Number(b.dataset.option));return}
 if(b.dataset.page){setPage(b.dataset.page,b.dataset.lesson);return}
 if(b.dataset.lesson){setPage('lesson',b.dataset.lesson);return}
 switch(b.id){case 'prevConcept':current.step=Math.max(0,current.step-1);render(false);break;
 case 'nextConcept':{let l=L(current.lesson);if(current.step<l.concepts.length-1){current.step++;render(false)}else beginQuiz(l.id);break}
 case 'goCards':setPage('cards',current.lesson);break;case 'goPractice':setPage('practice',current.lesson);current.showPractice=false;break;
 case 'confirmAnswer':confirmOption();break;
 case 'submitFree':submitFreeAnswer();break;
 case 'askCoach':evaluateQuizCoach();break;
 case 'evaluatePracticeCoach':evaluatePracticeCoach();break;
 case 'acceptCoach':acceptCoachReview();break;
 case 'reviseCoach':reviseCoachAnswer();break;
 case 'freeKnown':assessFree(true);break;
 case 'freeRetry':assessFree(false);break;
  case 'nextQuestion':current.question++;current.answer=-1;current.pick=-1;current.draft='';current.freeVerdict=null;current.coachFeedback=null;current.coachError='';current.coachBusy=false;current.lastXPGain=0;render();break;
 case 'retryQuiz':beginQuiz(current.lesson,current.review);break;
 case 'cardNext':current.flashIndex=Math.min(lessonCards(current.lesson).length-1,current.flashIndex+1);current.flashRevealed=false;render(false);break;
 case 'cardPrev':current.flashIndex=Math.max(0,current.flashIndex-1);current.flashRevealed=false;render(false);break;
 case 'flip':current.flashRevealed=!current.flashRevealed;render(false);break;
 case 'showModel':{const field=byId('practiceText');progress.practices[current.lesson]={...(progress.practices[current.lesson]||{}),text:field.value};save();current.showPractice=true;render(false);break}
 case 'practiceAgain':current.showPractice=false;render(false);break;
 case 'practiceKnown':progress.practices[current.lesson]={...(progress.practices[current.lesson]||{}),known:true};save();setPage('lesson',current.lesson);break;
 case 'beginReview':beginQuiz(current.lesson,true);break;
 case 'exportProgress':exportData();break;
 case 'resetProgress':if(confirm('Den neuen lokalen Lernstand aller fünf Testmodule zurücksetzen?')){progress=blank();current.module=progress.activeModule;current.lesson=defaultLesson(current.module);save();render()}break;
 }});
document.addEventListener('input',e=>{if(e.target.id==='quizFreeText'&&current.page==='quiz'){current.draft=e.target.value;const b=byId('submitFree');if(b)b.disabled=current.draft.trim().length<12;const ai=byId('askCoach');if(ai)ai.disabled=current.draft.trim().length<12;const c=byId('freeCount');if(c)c.textContent=current.draft.length+' Zeichen';}});
document.addEventListener('change',async e=>{
 if(e.target.id==='cardLesson'){current.lesson=e.target.value;current.module=L(current.lesson).module;current.flashIndex=0;current.flashRevealed=false;render(false)}
 if(e.target.id==='reviewModule'){current.reviewScope=e.target.value==='all'?'all':'module';if(current.reviewScope==='module'){current.module=Number(e.target.value);current.lesson=defaultLesson(current.module);progress.activeModule=current.module;save();}render(false)}
 if(e.target.id==='importProgress'){
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{if(f.size>1000000)throw Error('Die Sicherung ist zu groß.');const j=JSON.parse(await f.text());const clean=['skillyr-learn-m01-m05','skillyr-learn-m02'].includes(j.app)?normalizeProgress(j.progress):null;if(clean&&j.app==='skillyr-learn-m02')clean.activeModule=2;if(!clean)throw Error('Keine gültige Skillyr-Lernstandsicherung');
   if(confirm('Den aktuellen Lernstand aller fünf Module durch diesen Export ersetzen?')){progress=clean;current.module=progress.activeModule;current.lesson=defaultLesson(current.module);save();render();}
  }catch(err){alert('Import nicht möglich: '+err.message)}
 }
});
render(false);
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline-Serviceworker:',e));
</script>
